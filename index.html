ة، وإن كان ناتجًا عن التشغيل يُحمل مصروفًا."]],"en":{"title":"DipIFR Question (4) – IAS 37 and IAS 10: provision scenarios","tag":"Frequency: very frequently tested. Provisions and events after the reporting period are among the most common items in mixed-topics questions, and rely more on explanation than calculation.","q":["The financial year ends on 31/12/2027 and the statements are authorized on 15/3/2028. Discuss the treatment of each situation:","(a) On 1/12/2027 the board decided to close a branch, but the decision was not announced and no detailed plan existed until 20/1/2028. Estimated cost 900,000.","(b) A customer has sued the company; the lawyer’s opinion at 31/12/2027 was a 30% chance of losing. On 20/2/2028 a first-instance judgment was issued against the company for 400,000 and the company will not appeal.","(c) The company operates in a country with no environmental law, but it has a published policy committing it to clean up any contamination it causes, and it has historically honoured it. Estimated clean-up cost 250,000."],"sol":[["p","**(a)** There is no constructive obligation at 31/12/2027 because the plan was not detailed and had not been announced to those affected → **no provision**. The announcement after year end is a non-adjusting event → disclose only if material."],["p","**(b)** The judgment after year end provides evidence of a condition that existed (the lawsuit) → an **adjusting event** under IAS 10 → a provision of **400,000** is recognized in the 2027 statements even though the earlier estimate was 30%."],["p","**(c)** The published policy and past practice created a **constructive obligation** and a valid expectation in others → a provision of **250,000** (discounted if the time effect is material). If the contamination relates to constructing an asset it is added to the cost; if it arises from operations it is expensed."]]}},{"title":"سؤال DipIFR (5) – IAS 12: ضريبة مؤجلة على تكاليف تطوير وخسائر مرحلة","tag":"مستوى التكرار: متكرر جدًا. الضريبة المؤجلة تُدمج في كل الحالات تقريبًا كجزء من البند.","q":["معدل الضريبة 25%. في 31/12/2027:","(1) رسملت الشركة تكاليف تطوير 600,000 وفق IAS 38، والقانون الضريبي يسمح بخصمها بالكامل عند الإنفاق.","(2) لدى الشركة خسائر ضريبية مرحلة 800,000. الموازنات المعتمدة تتوقع أرباحًا ضريبية 500,000 فقط خلال الفترة المسموحة لترحيل الخسائر، والشركة حققت خسائر في آخر 3 سنوات."],"sol":[["p","**(1)** القيمة الدفترية 600,000 والأساس الضريبي صفر (خُصمت بالكامل) ← فرق خاضع للضريبة 600,000 ← **التزام ضريبي مؤجل 150,000** يُحمل على الأرباح والخسائر."],["p","**(2)** الأصل الضريبي المؤجل يُعترف به فقط في حدود الأرباح الضريبية المستقبلية المحتملة. تاريخ الخسائر يتطلب **دليلًا مقنعًا**. بفرض أن التوقعات مقنعة: الأصل = 500,000 × 25% = **125,000** فقط، وليس 200,000. يُفصح عن الخسائر غير المعترف بها (300,000)."],["p","**المقاصة:** يُسمح بعرض الأصل والالتزام بالصافي إذا كانا لنفس السلطة الضريبية ولنفس المنشأة ويوجد حق قانوني بالمقاصة ← صافي التزام 25,000."]],"en":{"title":"DipIFR Question (5) – IAS 12: deferred tax on development costs and carried-forward losses","tag":"Frequency: very frequently tested. Deferred tax is embedded in almost every scenario as part of the item.","q":["Tax rate 25%. At 31/12/2027:","(1) The company capitalized development costs of 600,000 under IAS 38, and tax law allows them to be fully deducted when incurred.","(2) The company has carried-forward tax losses of 800,000. Approved budgets forecast taxable profits of only 500,000 within the period allowed for carrying losses forward, and the company has made losses in the last 3 years."],"sol":[["p","**(1)** Carrying amount 600,000 and tax base zero (fully deducted) → taxable difference 600,000 → **deferred tax liability 150,000** charged to profit or loss."],["p","**(2)** A deferred tax asset is recognized only to the extent of probable future taxable profits. A history of losses requires **convincing evidence**. Assuming the forecasts are convincing: asset = 500,000 × 25% = **125,000** only, not 200,000. Disclose the unrecognized losses (300,000)."],["p","**Offsetting:** the asset and liability may be presented net if they relate to the same tax authority and the same entity and there is a legal right of offset → net liability 25,000."]]}},{"title":"سؤال DipIFR (6) – IFRS 9: استثمار في أسهم","tag":"مستوى التكرار: متكرر. يأتي كجزء من الحالات المتنوعة لاختبار التصنيف والفرق بين FVOCI و FVTPL.","q":["في 1/7/2027 اشترت الشركة أسهمًا بـ 500,000 وتكاليف وساطة 10,000، بغرض الاحتفاظ طويل الأجل، واختارت بشكل نهائي القياس بـ FVOCI. القيمة العادلة في 31/12/2027 = 560,000. في 30/6/2028 بيعت بـ 600,000. اشرح المعالجة، وقارن لو كانت مصنفة FVTPL."],"sol":[["t",["البند","FVOCI","FVTPL"],[["القياس الأولي","510,000 (التكاليف تُضاف)","500,000 (التكاليف 10,000 مصروف)"],["التغير في 2027","50,000 مكسب في OCI","60,000 مكسب في الأرباح والخسائر"],["التغير حتى البيع في 2028","40,000 مكسب في OCI","40,000 مكسب في الأرباح والخسائر"],["عند البيع","لا إعادة تصنيف للأرباح والخسائر؛ يجوز تحويل الرصيد المتراكم 90,000 للأرباح المحتجزة داخل حقوق الملكية","لا شيء إضافي"]],[2600,3638,3400]],["p","**ملاحظة:** توزيعات الأرباح المستلمة تُعترف في الأرباح والخسائر في الحالتين. وتعديلات 2026 أضافت إفصاحات عن أدوات حقوق الملكية بـ FVOCI (القيمة العادلة لكل فئة والمكاسب المحولة داخل حقوق الملكية)."]],"en":{"title":"DipIFR Question (6) – IFRS 9: an investment in shares","tag":"Frequency: frequently tested. Appears in mixed topics to test classification and the difference between FVOCI and FVTPL.","q":["On 1/7/2027 the company bought shares for 500,000 plus brokerage of 10,000, to hold long term, and irrevocably elected FVOCI. Fair value at 31/12/2027 = 560,000. On 30/6/2028 they were sold for 600,000. Explain the treatment and compare with FVTPL classification."],"sol":[["t",["Item","FVOCI","FVTPL"],[["Initial measurement","510,000 (costs added)","500,000 (costs of 10,000 expensed)"],["Change in 2027","Gain of 50,000 in OCI","Gain of 60,000 in profit or loss"],["Change to sale in 2028","Gain of 40,000 in OCI","Gain of 40,000 in profit or loss"],["On sale","No reclassification to profit or loss; the cumulative 90,000 may be transferred to retained earnings within equity","Nothing further"]],[2600,3638,3400]],["p","**Note:** dividends received are recognized in profit or loss in both cases. The 2026 amendments added disclosures for equity instruments at FVOCI (fair value per class and gains transferred within equity)."]]}},{"title":"سؤال DipIFR (7) – IFRS 2: حقوق ارتفاع قيمة الأسهم النقدية (SARs)","tag":"مستوى التكرار: متكرر. يأتي غالبًا مع سؤال عن الضريبة المؤجلة على المدفوعات على أساس الأسهم.","q":["في 1/1/2027 منحت الشركة 200 حق ارتفاع قيمة أسهم (تسدد نقدًا) لكل من 50 مديرًا بشرط البقاء 3 سنوات. يُتوقع بقاء الجميع. القيمة العادلة للحق: 31/12/2027 = 10، 31/12/2028 = 12. احسب الالتزام والمصروف لكل سنة."],"sol":[["p","**المبدأ:** المدفوعات المسددة نقدًا تُنشئ التزامًا يُعاد قياسه بالقيمة العادلة في كل تاريخ تقرير، ويوزع على فترة الاستحقاق."],["t",["السنة","الحساب","الالتزام","المصروف"],[["2027","50 × 200 × 10 × 1/3","33,333","33,333"],["2028","50 × 200 × 12 × 2/3","80,000","46,667"]],[1600,3638,2200,2200]],["p","**الفرق عن الخيارات المسددة بأدوات حقوق ملكية:** تلك تُقاس بالقيمة العادلة في تاريخ المنح فقط، والجانب الدائن حقوق ملكية وليس التزامًا."]],"en":{"title":"DipIFR Question (7) – IFRS 2: cash-settled share appreciation rights (SARs)","tag":"Frequency: frequently tested. Often appears together with deferred tax on share-based payments.","q":["On 1/1/2027 the company granted 200 cash-settled share appreciation rights to each of 50 managers, conditional on staying 3 years. All are expected to stay. Fair value per right: 31/12/2027 = 10, 31/12/2028 = 12. Calculate the liability and expense for each year."],"sol":[["p","**Principle:** cash-settled payments create a liability remeasured at fair value at each reporting date and spread over the vesting period."],["t",["Year","Working","Liability","Expense"],[["2027","50 × 200 × 10 × 1/3","33,333","33,333"],["2028","50 × 200 × 12 × 2/3","80,000","46,667"]],[1600,3638,2200,2200]],["p","**Difference from equity-settled options:** those are measured at grant-date fair value only, and the credit is to equity rather than a liability."]]}},{"title":"سؤال DipIFR (8) – IAS 16 و IAS 36: انخفاض قيمة أصل معاد تقييمه","tag":"مستوى التكرار: متكرر. يختبر ترتيب الخصم من فائض إعادة التقييم قبل الأرباح والخسائر.","q":["مبنى مقاس بنموذج إعادة التقييم، قيمته الدفترية 900,000 ويتضمن فائض إعادة تقييم خاص به 50,000. بسبب ضرر مادي، القيمة القابلة للاسترداد 820,000. ما المعالجة؟"],"sol":[["p","**خسارة الانخفاض** = 900,000 – 820,000 = 80,000. وفق IAS 36 خسارة الأصل المعاد تقييمه تُعامل كانخفاض إعادة تقييم: **50,000 من فائض إعادة التقييم (OCI)** والباقي **30,000 في الأرباح والخسائر**."],["je",[["فائض إعادة التقييم (OCI)","50,000",""],["خسارة انخفاض القيمة (أرباح وخسائر)","30,000",""],["المبنى","","80,000"]]]],"en":{"title":"DipIFR Question (8) – IAS 16 and IAS 36: impairment of a revalued asset","tag":"Frequency: frequently tested. Tests the order: deduct from the revaluation surplus before profit or loss.","q":["A building measured under the revaluation model has a carrying amount of 900,000, including its own revaluation surplus of 50,000. Due to physical damage, its recoverable amount is 820,000. What is the treatment?"],"sol":[["p","**Impairment loss** = 900,000 – 820,000 = 80,000. Under IAS 36, a loss on a revalued asset is treated as a revaluation decrease: **50,000 from the revaluation surplus (OCI)** and the remaining **30,000 in profit or loss**."],["je",[["Revaluation surplus (OCI)","50,000",""],["Impairment loss (profit or loss)","30,000",""],["Building","","80,000"]]]]}},{"title":"سؤال DipIFR (9) – IAS 21: الشهرة لتابعة أجنبية","tag":"مستوى التكرار: متكرر في سؤال التجميع عند وجود تابعة أجنبية (حساب فرق الترجمة على الشهرة وصافي الأصول).","q":["استحوذت شركة عملة عرضها الدولار على تابعة عملتها الوظيفية \"الكراون\" (Kr). الشهرة عند الاستحواذ Kr 1,000. سعر الاستحواذ 2 Kr = 1$، وسعر الإقفال 2.5 Kr = 1$. لا انخفاض قيمة. الحصة غير المسيطرة 20% مقاسة بالقيمة العادلة."],"sol":[["p","الشهرة أصل للعملية الأجنبية وتترجم بسعر الإقفال: عند الاستحواذ 1,000 ÷ 2 = $500، في نهاية السنة 1,000 ÷ 2.5 = $400 ← **خسارة ترجمة $100 في OCI**."],["p","بما أن الحصة غير المسيطرة بالقيمة العادلة (شهرة كاملة)، تتحمل 20% = $20 والمجموعة $80 في احتياطي الترجمة."]],"en":{"title":"DipIFR Question (9) – IAS 21: goodwill of a foreign subsidiary","tag":"Frequency: frequently tested in the consolidation question when there is a foreign subsidiary (calculating the translation difference on goodwill and net assets).","q":["A company with a dollar presentation currency acquired a subsidiary whose functional currency is the \"crown\" (Kr). Goodwill at acquisition was Kr 1,000. The acquisition rate was 2 Kr = $1, and the closing rate is 2.5 Kr = $1. No impairment. NCI of 20% is measured at fair value."],"sol":[["p","Goodwill is an asset of the foreign operation and is translated at the closing rate: at acquisition 1,000 ÷ 2 = $500, at year end 1,000 ÷ 2.5 = $400 → **translation loss of $100 in OCI**."],["p","Because NCI is at fair value (full goodwill), it bears 20% = $20 and the group $80 in the translation reserve."]]}},{"title":"سؤال DipIFR (10) – IFRS 18: تصنيف ومقاييس أداء الإدارة","tag":"مستوى التكرار: جديد ومتوقع بقوة من دورة ديسمبر 2026 فما بعدها (أسئلة شرح وتصنيف).","q":["شركة صناعية تعلن في عرض المستثمرين مقياس \"الربح التشغيلي المعدّل\" = الربح التشغيلي قبل تكاليف إعادة الهيكلة وانخفاض قيمة الشهرة. وتعلن أيضًا \"التدفق النقدي الحر\". المطلوب:","(أ) هل كل منهما مقياس أداء معرّف من الإدارة (MPM)؟","(ب) صنف البنود: إيراد إيجار من عقار استثماري، مصروف فائدة على التزام إيجار، خسارة انخفاض قيمة الشهرة، فروق عملة على قرض بالدولار."],"sol":[["p","**(أ)** \"الربح التشغيلي المعدّل\" إجمالي فرعي للدخل والمصروفات، يُستخدم في الاتصالات العامة، ويعبر عن وجهة نظر الإدارة، وغير محدد في IFRS ← **MPM**: يتطلب إيضاحًا مع تسوية إلى \"الربح التشغيلي\" والأثر الضريبي وأثر الحصة غير المسيطرة لكل بند تسوية. أما \"التدفق النقدي الحر\" فهو ليس إجماليًا فرعيًا للدخل والمصروفات ← **ليس MPM** وفق IFRS 18."],["p","**(ب)** إيراد الإيجار من عقار استثماري ← استثمارية. فائدة التزام الإيجار ← تمويلية. انخفاض الشهرة ← تشغيلية. فروق العملة تُصنف في نفس فئة البند الذي نشأت عنه ← القرض تمويلي فتُصنف **تمويلية**."]],"en":{"title":"DipIFR Question (10) – IFRS 18: classification and management-defined performance measures","tag":"Frequency: new and highly expected from the December 2026 sitting onwards (explanation and classification questions).","q":["A manufacturer announces in its investor presentation an \"adjusted operating profit\" = operating profit before restructuring costs and goodwill impairment. It also announces \"free cash flow\". Required:","(a) Is each of them a management-defined performance measure (MPM)?","(b) Classify these items: rental income from investment property, interest expense on a lease liability, goodwill impairment loss, exchange differences on a dollar loan."],"sol":[["p","**(a)** \"Adjusted operating profit\" is a subtotal of income and expenses, used in public communications, reflects management’s view, and is not specified by IFRS → an **MPM**: it requires a note with a reconciliation to \"operating profit\" and the tax and NCI effects of each reconciling item. \"Free cash flow\" is not a subtotal of income and expenses → **not an MPM** under IFRS 18."],["p","**(b)** Rental income from investment property → investing. Interest on the lease liability → financing. Goodwill impairment → operating. Exchange differences are classified in the same category as the item that gave rise to them → the loan is financing, so they are **financing**."]]}},{"title":"سؤال DipIFR (11) – IAS 33: إصدار بسعر السوق ثم أسهم مجانية","tag":"مستوى التكرار: متكرر. يأتي ضمن الحالات المتنوعة بحساب المتوسط المرجح وإعادة عرض المقارنة.","q":["أسهم قائمة 2,000,000 في 1/1/2027. في 1/7/2027 أُصدر 500,000 سهم بسعر السوق. في 1/10/2027 أسهم مجانية 1 لكل 5. صافي الربح 5,400,000. ربحية السهم المعلنة لـ 2026 كانت 2.40."],"sol":[["t",["الفترة","الأسهم × معامل المجانية × الكسر الزمني","المرجح"],[["1/1 – 30/6","2,000,000 × 1.2 × 6/12","1,200,000"],["1/7 – 30/9","2,500,000 × 1.2 × 3/12","750,000"],["1/10 – 31/12","3,000,000 × 3/12","750,000"],["!الإجمالي","","2,700,000"]],[2400,4838,2400]],["p","ربحية السهم 2027 = 5,400,000 ÷ 2,700,000 = **2.00**. ربحية المقارنة المعدلة لـ 2026 = 2.40 ÷ 1.2 = **2.00**."]],"en":{"title":"DipIFR Question (11) – IAS 33: an issue at market price followed by a bonus issue","tag":"Frequency: frequently tested. Appears in mixed topics with calculation of the weighted average and restatement of the comparative.","q":["Shares outstanding 2,000,000 on 1/1/2027. On 1/7/2027, 500,000 shares were issued at market price. On 1/10/2027, a 1-for-5 bonus issue. Net profit 5,400,000. Reported EPS for 2026 was 2.40."],"sol":[["t",["Period","Shares × bonus factor × time fraction","Weighted"],[["1/1 – 30/6","2,000,000 × 1.2 × 6/12","1,200,000"],["1/7 – 30/9","2,500,000 × 1.2 × 3/12","750,000"],["1/10 – 31/12","3,000,000 × 3/12","750,000"],["!Total","","2,700,000"]],[2400,4838,2400]],["p","EPS for 2027 = 5,400,000 ÷ 2,700,000 = **2.00**. Restated comparative EPS for 2026 = 2.40 ÷ 1.2 = **2.00**."]]}}],"mcqs":[{"tag":"IAS 2","ans":1,"ar":{"q":"شركة لديها 3 أصناف مخزون: (أ) تكلفة 100 وNRV 120، (ب) تكلفة 80 وNRV 70، (ج) تكلفة 50 وNRV 60. بكم يظهر المخزون؟","opts":["230","220","250","240"],"why":"IAS 2 يقيس المخزون بالأقل من التكلفة وصافي القيمة القابلة للتحقق **لكل صنف لوحده**. الصنف (أ): الأقل 100. الصنف (ب): الأقل 70 (لأن NRV أقل من التكلفة). الصنف (ج): الأقل 50. المجموع = 100 + 70 + 50 = **220**.","wrong":["230 هو مجموع التكلفة (100 + 80 + 50) من غير ما تخفض الصنف (ب) لصافي القيمة القابلة للتحقق 70. ده بيتجاهل قاعدة \"الأقل من\".",null,"250 هو مجموع NRV (120 + 70 + 60). المخزون ممنوع يتسجل بأعلى من تكلفته، يعني مينفعش نرفع (أ) و(ج) لـ NRV.","240 ناتج عن مقارنة الإجمالي: التكلفة الكلية 230 مقابل NRV الكلي 250 ثم أخذ رقم غلط. المقارنة على مستوى الإجمالي ممنوعة لأنها بتخلي ربح صنف يغطي خسارة صنف تاني."]},"en":{"q":"A company has 3 inventory items: (A) cost 100, NRV 120; (B) cost 80, NRV 70; (C) cost 50, NRV 60. At what amount is inventory shown?","opts":["230","220","250","240"],"why":"IAS 2 measures inventory at the lower of cost and net realizable value **item by item**. Item A: lower is 100. Item B: lower is 70 (NRV below cost). Item C: lower is 50. Total = 100 + 70 + 50 = **220**.","wrong":["230 is total cost (100 + 80 + 50) without writing item B down to its NRV of 70. It ignores the \"lower of\" rule.",null,"250 is total NRV (120 + 70 + 60). Inventory can never be carried above cost, so A and C cannot be written up to NRV.","240 comes from comparing totals instead of individual items. Comparing in aggregate is not allowed because it lets a gain on one item offset a loss on another."]}},{"tag":"IAS 16","ans":2,"ar":{"q":"أي من التالي لا يُضاف لتكلفة آلة وفق IAS 16؟","opts":["تكاليف التركيب","القيمة الحالية لتكاليف الإزالة","تكاليف تدريب العاملين على الآلة","رسوم الاستيراد غير المستردة"],"why":"التكلفة في IAS 16 تشمل فقط التكاليف **المنسوبة مباشرة** لجعل الأصل في موقعه وحالته الجاهزة للتشغيل. التدريب بيطور مهارة العاملين ومش بيغير حالة الآلة نفسها، فهو **مصروف** في الأرباح والخسائر.","wrong":["التركيب ضروري علشان الآلة تشتغل، فهو تكلفة منسوبة مباشرة وتُرسمل.","IAS 16 بيطلب صراحة إضافة التقدير الأولي لتكاليف الإزالة وإعادة الموقع (بالقيمة الحالية) لتكلفة الأصل، مع مخصص مقابله وفق IAS 37.",null,"الرسوم غير المستردة جزء من سعر الشراء الفعلي، فتُضاف للتكلفة. (لو كانت مستردة زي ضريبة قيمة مضافة قابلة للخصم، ماتُضافش.)"]},"en":{"q":"Which of the following is NOT included in the cost of a machine under IAS 16?","opts":["Installation costs","Present value of dismantling costs","Costs of training staff to use the machine","Non-refundable import duties"],"why":"Cost under IAS 16 includes only costs **directly attributable** to bringing the asset to the location and condition necessary for it to operate. Training develops staff skills and does not change the machine itself, so it is an **expense** in profit or loss.","wrong":["Installation is necessary for the machine to work, so it is directly attributable and capitalized.","IAS 16 explicitly requires the initial estimate of dismantling and restoration costs (at present value) to be added to cost, with a matching IAS 37 provision.",null,"Non-refundable duties are part of the actual purchase price, so they are added to cost. (Refundable taxes such as recoverable VAT are not.)"]}},{"tag":"IAS 8","ans":2,"ar":{"q":"قررت شركة تغيير طريقة الإهلاك من القسط الثابت إلى القسط المتناقص. كيف يُعالج ذلك؟","opts":["تغيير سياسة بأثر رجعي","تصحيح خطأ","تغيير تقدير بأثر مستقبلي","لا يُسمح بالتغيير"],"why":"IAS 16 بيعتبر طريقة الإهلاك **تقدير** لنمط استهلاك المنافع الاقتصادية للأصل. لما الإدارة تغيرها بسبب معلومات جديدة عن النمط ده، تبقى تغيير تقدير، ووفق IAS 8 تُطبق **بأثر مستقبلي** من الفترة الحالية بدون تعديل المقارنة.","wrong":["كتير بيفتكروها سياسة، لكن IAS 16 بيقول صراحة إن تغيير الطريقة تغيير تقدير. السياسة مثلًا هي اختيار نموذج التكلفة أو إعادة التقييم.","مفيش خطأ هنا. الخطأ يكون إغفال أو سوء استخدام لمعلومات كانت متاحة وقت إعداد القوائم السابقة.",null,"التغيير مسموح ومطلوب كمان لو النمط المتوقع اتغير. IAS 16 بيطلب مراجعة الطريقة مرة في السنة على الأقل."]},"en":{"q":"A company decides to change its depreciation method from straight-line to reducing balance. How is this treated?","opts":["Change in policy, retrospectively","Correction of an error","Change in estimate, prospectively","The change is not allowed"],"why":"IAS 16 treats the depreciation method as an **estimate** of the pattern in which the asset’s economic benefits are consumed. When management changes it because of new information about that pattern, it is a change in estimate, applied **prospectively** under IAS 8 from the current period without restating comparatives.","wrong":["Many think it is a policy, but IAS 16 states explicitly that a change in method is a change in estimate. A policy would be, for example, choosing the cost or revaluation model.","There is no error. An error is an omission or misuse of information that was available when prior statements were prepared.",null,"The change is allowed, and even required if the expected pattern changes. IAS 16 requires the method to be reviewed at least annually."]}},{"tag":"IAS 10","ans":1,"ar":{"q":"أعلنت شركة توزيعات أرباح في 20/1/2028 عن سنة 31/12/2027. المعالجة في قوائم 2027:","opts":["التزام متداول","إفصاح فقط","تخفيض الأرباح المحتجزة","مخصص"],"why":"في 31/12/2027 مكانش فيه التزام حالي، لأن الالتزام بالتوزيع بيتولد **بالإعلان** نفسه، والإعلان حصل بعد نهاية السنة. يعني ده حدث **غير معدِّل** وفق IAS 10، فيتفصح عنه في الإيضاحات بس.","wrong":["مينفعش يتسجل التزام لأنه مكانش موجود في تاريخ الميزانية. IAS 10 بينص صراحة إن التوزيعات المعلنة بعد نهاية الفترة ماتتسجلش كالتزام.",null,"تخفيض الأرباح المحتجزة معناه إننا سجلنا التوزيع، وده بيحصل في سنة 2028 لما يتعلن مش في 2027.","المخصص التزام غير مؤكد التوقيت أو المبلغ، ولازم يكون فيه التزام حالي في تاريخ الميزانية، وده مش موجود هنا."]},"en":{"q":"A company declared dividends on 20/1/2028 for the year ended 31/12/2027. The treatment in the 2027 statements:","opts":["Current liability","Disclosure only","Reduce retained earnings","Provision"],"why":"At 31/12/2027 there was no present obligation, because the obligation to pay arises **on declaration**, which happened after year end. This is a **non-adjusting** event under IAS 10, so it is disclosed in the notes only.","wrong":["No liability can be recorded because none existed at the reporting date. IAS 10 states explicitly that dividends declared after the period are not recognized as a liability.",null,"Reducing retained earnings would mean recording the dividend, which happens in 2028 when it is declared, not in 2027.","A provision is a liability of uncertain timing or amount and still requires a present obligation at the reporting date, which does not exist here."]}},{"tag":"IFRS 9","ans":2,"ar":{"q":"أي مما يلي صحيح بالنسبة لاستثمار في أسهم مصنف FVOCI؟","opts":["المكاسب المتراكمة يُعاد تصنيفها للأرباح والخسائر عند البيع","يُحسب له خسائر ائتمانية متوقعة","التوزيعات تُعترف في الأرباح والخسائر","يمكن إلغاء الاختيار في أي وقت"],"why":"اختيار FVOCI لأدوات حقوق الملكية معناه إن تغيرات القيمة العادلة تروح OCI، لكن **توزيعات الأرباح** بتتسجل في الأرباح والخسائر لأنها عائد على الاستثمار مش استرداد لتكلفته.","wrong":["ده صحيح لأدوات **الدين** بـ FVOCI بس. أدوات حقوق الملكية بـ FVOCI **عمرها ما بيتعاد تصنيفها**، وممكن تنقل الرصيد للأرباح المحتجزة جوه حقوق الملكية.","نموذج الخسائر الائتمانية المتوقعة بيتطبق على أدوات الدين، مش على الأسهم. الأسهم مالهاش تدفقات تعاقدية ممكن العميل يتأخر فيها.",null,"الاختيار **نهائي وغير قابل للإلغاء** (Irrevocable) من وقت الاعتراف الأولي."]},"en":{"q":"Which of the following is true for an equity investment classified at FVOCI?","opts":["Cumulative gains are reclassified to profit or loss on sale","Expected credit losses are calculated","Dividends are recognized in profit or loss","The election can be revoked at any time"],"why":"The FVOCI election for equity instruments means fair value changes go to OCI, but **dividends** are recognized in profit or loss because they are a return on the investment, not a recovery of its cost.","wrong":["This is true only for **debt** instruments at FVOCI. Equity instruments at FVOCI are **never reclassified**; the balance may be transferred to retained earnings within equity.","The expected credit loss model applies to debt instruments, not shares. Shares have no contractual cash flows a counterparty could default on.",null,"The election is **irrevocable** from initial recognition."]}},{"tag":"IAS 12","ans":1,"ar":{"q":"كيف تُقاس الأصول والالتزامات الضريبية المؤجلة؟","opts":["بالقيمة الحالية بسعر الاقتراض","بدون خصم وبالمعدل الصادر أو الصادر فعليًا","بمعدل الضريبة الحالي فقط دون اعتبار للتغييرات الصادرة","بالقيمة العادلة"],"why":"IAS 12 بيقيس الضرائب المؤجلة بالمعدل **المتوقع تطبيقه** وقت ما الفرق يتعكس، بشرط يكون المعدل **صادر أو صادر فعليًا** في نهاية الفترة. والمعيار **بيمنع الخصم** لأن تحديد توقيت عكس كل فرق صعب جدًا.","wrong":["الخصم ممنوع صراحة في IAS 12 حتى لو الفرق هيتعكس بعد سنين.",null,"لو اتصدر قانون بمعدل جديد هيطبق وقت العكس، لازم يتستخدم المعدل الجديد. المعدل الحالي بس غلط.","الضرائب المؤجلة مش بتتقاس بالقيمة العادلة؛ هي ببساطة الفرق المؤقت × المعدل."]},"en":{"q":"How are deferred tax assets and liabilities measured?","opts":["At present value using the borrowing rate","Undiscounted, at enacted or substantively enacted rates","At the current tax rate only, ignoring enacted changes","At fair value"],"why":"IAS 12 measures deferred tax at the rate **expected to apply** when the difference reverses, provided the rate is **enacted or substantively enacted** by the end of the period. The standard **prohibits discounting** because scheduling the reversal of each difference is very difficult.","wrong":["Discounting is explicitly prohibited by IAS 12, even if the difference reverses years later.",null,"If a new rate has been enacted that will apply on reversal, the new rate must be used. Using only the current rate is wrong.","Deferred tax is not measured at fair value; it is simply the temporary difference × the rate."]}},{"tag":"IAS 36","ans":2,"ar":{"q":"هل يجوز عكس خسارة انخفاض قيمة الشهرة؟","opts":["نعم دائمًا","نعم إذا زادت القيمة القابلة للاسترداد","لا، أبدًا","نعم في القوائم الأولية فقط"],"why":"IAS 36 **بيمنع** عكس انخفاض الشهرة. السبب إن أي زيادة لاحقة في قيمة الوحدة غالبًا بتكون **شهرة متولدة داخليًا**، وIAS 38 بيمنع الاعتراف بالشهرة المتولدة داخليًا.","wrong":["العكس مسموح لباقي الأصول بس، مش للشهرة.","ده بالظبط الشرط اللي بيسمح بالعكس للأصول التانية، لكن الشهرة مستثناة منه.",null,"IFRIC 10 بيقول إن انخفاض الشهرة اللي اتسجل في فترة أولية **مايتعكسش** في فترة لاحقة، فالعكس ممنوع في الأولية كمان."]},"en":{"q":"Can an impairment loss on goodwill be reversed?","opts":["Yes, always","Yes, if the recoverable amount increases","No, never","Yes, in interim statements only"],"why":"IAS 36 **prohibits** reversing goodwill impairment. Any later increase in the unit’s value is likely to be **internally generated goodwill**, which IAS 38 prohibits recognizing.","wrong":["Reversal is allowed for other assets, not for goodwill.","That is exactly the condition that permits reversal for other assets, but goodwill is excluded from it.",null,"IFRIC 10 states that goodwill impairment recognized in an interim period is **not reversed** later, so reversal is prohibited in interims too."]}},{"tag":"IFRS 13","ans":1,"ar":{"q":"وفق IFRS 13، عند قياس القيمة العادلة لأصل في سوقه الرئيسي:","opts":["تُخصم تكاليف المعاملة وتكاليف النقل","تُخصم تكاليف النقل فقط إذا كان الموقع خاصية للأصل","تُضاف تكاليف المعاملة","لا تُخصم أي تكاليف إطلاقًا"],"why":"القيمة العادلة هي سعر خروج للأصل **زي ما هو في مكانه**. لو الموقع خاصية للأصل (زي سلعة لازم تتنقل للسوق)، تكاليف النقل بتتخصم. أما **تكاليف المعاملة** فمش خاصية للأصل، دي خاصية للمعاملة نفسها، فماتتخصمش.","wrong":["تكاليف المعاملة **ماتتخصمش** من القيمة العادلة. بتتستخدم بس علشان نحدد السوق الأكثر فائدة لو مفيش سوق رئيسي.",null,"القيمة العادلة سعر خروج (اللي هتستلمه)، فمفيش منطق إنك تضيف تكاليف عليه.","تكاليف النقل بتتخصم لو الموقع خاصية للأصل، فـ \"ولا تكلفة\" غلط."]},"en":{"q":"Under IFRS 13, when measuring the fair value of an asset in its principal market:","opts":["Transaction costs and transport costs are deducted","Only transport costs are deducted, if location is a characteristic of the asset","Transaction costs are added","No costs are ever deducted"],"why":"Fair value is an exit price for the asset **in its current location**. If location is a characteristic of the asset (e.g., a commodity that must be moved to the market), transport costs are deducted. **Transaction costs** are a characteristic of the transaction, not the asset, so they are not deducted.","wrong":["Transaction costs are **not** deducted from fair value. They are used only to identify the most advantageous market when there is no principal market.",null,"Fair value is an exit price (what you would receive), so there is no logic in adding costs to it.","Transport costs are deducted when location is a characteristic of the asset, so \"no costs\" is wrong."]}},{"tag":"IAS 7","ans":2,"ar":{"q":"وفق التعديلات المصاحبة لـ IFRS 18، أين تُصنف الفوائد المدفوعة في قائمة التدفقات النقدية لشركة صناعية؟","opts":["تشغيلية","استثمارية","تمويلية","حسب اختيار المنشأة"],"why":"التعديلات على IAS 7 مع IFRS 18 **ألغت الاختيار** للمنشآت العادية: الفوائد والتوزيعات **المدفوعة** تمويلية، والفوائد والتوزيعات **المحصلة** استثمارية. ده بيخلي التصنيف متسق مع فئات قائمة الدخل الجديدة.","wrong":["كان ده اختيار مسموح زمان، ولسه بيحصل في البنوك وشركات التمويل لأن التمويل نشاطها الرئيسي، لكن مش لشركة صناعية.","الاستثمارية للفوائد **المحصلة** مش المدفوعة.",null,"الاختيار اتلغى بالتعديلات علشان يزود القابلية للمقارنة بين الشركات."]},"en":{"q":"Under the amendments accompanying IFRS 18, where is interest paid classified in the statement of cash flows of a manufacturer?","opts":["Operating","Investing","Financing","At the entity’s choice"],"why":"The amendments to IAS 7 with IFRS 18 **removed the choice** for general entities: interest and dividends **paid** are financing, and interest and dividends **received** are investing. This aligns classification with the new income statement categories.","wrong":["This used to be an allowed choice, and still applies to banks and finance companies because financing is their main business, but not to a manufacturer.","Investing is for interest **received**, not paid.",null,"The choice was removed by the amendments to improve comparability between entities."]}},{"tag":"IFRS 3","ans":2,"ar":{"q":"تكاليف قانونية واستشارية بمبلغ 30,000 لاستحواذ على تابعة. المعالجة في القوائم المجمعة:","opts":["تضاف للشهرة","تُخصم من حقوق الملكية","مصروف في الأرباح والخسائر","تُطفأ على 5 سنوات"],"why":"IFRS 3 بيعتبر تكاليف الاستحواذ **مش جزء من العوض** المدفوع للبائعين، لأنها خدمات منفصلة اتدفعت لأطراف تانية. فبتتسجل **مصروف** في الفترة اللي اتصرفت فيها.","wrong":["ده كان مسموح في IFRS 3 القديم (قبل 2008)، لكن دلوقتي ممنوع. الشهرة بتتحسب من العوض بس.","اللي بيتخصم من حقوق الملكية هو **تكاليف إصدار الأسهم** المستخدمة كعوض، مش التكاليف القانونية والاستشارية.",null,"مفيش أصل يتطفأ. التكاليف دي مصروف فوري."]},"en":{"q":"Legal and advisory costs of 30,000 for acquiring a subsidiary. The treatment in the consolidated statements:","opts":["Added to goodwill","Deducted from equity","Expensed in profit or loss","Amortized over 5 years"],"why":"IFRS 3 treats acquisition costs as **not part of the consideration** paid to the sellers, because they are separate services paid to other parties. So they are **expensed** in the period incurred.","wrong":["This was allowed under the old IFRS 3 (before 2008), but is now prohibited. Goodwill is calculated from the consideration only.","What is deducted from equity is **share issue costs** for shares used as consideration, not legal and advisory costs.",null,"There is no asset to amortize. These costs are expensed immediately."]}},{"tag":"IAS 38","ans":2,"ar":{"q":"أي مما يلي يُعترف به أصلًا غير ملموس؟","opts":["علامة تجارية مولدة داخليًا","تكاليف بحث","تكاليف تطوير تحققت فيها كل شروط IAS 38","تكاليف تدريب"],"why":"التطوير اللي بيحقق **كل** شروط PIRATE (منافع محتملة، نية الإكمال، موارد، قدرة على الاستخدام أو البيع، جدوى فنية، قياس موثوق) **لازم** يترسمل كأصل غير ملموس.","wrong":["IAS 38 بيمنع صراحة الاعتراف بالعلامات التجارية وقوائم العملاء المتولدة داخليًا، لأن تكلفتها مش ممكن تتفصل عن تكلفة تطوير النشاط ككل.","البحث دايمًا مصروف لأن المنشأة مش قادرة تثبت إن فيه منافع مستقبلية محتملة في المرحلة دي.",null,"المنشأة مش بتسيطر على الموظفين المدربين (ممكن يسيبوا الشغل)، فالتدريب مش أصل."]},"en":{"q":"Which of the following is recognized as an intangible asset?","opts":["An internally generated brand","Research costs","Development costs meeting all IAS 38 criteria","Training costs"],"why":"Development that meets **all** the PIRATE criteria (probable benefits, intention to complete, resources, ability to use or sell, technical feasibility, reliable measurement) **must** be capitalized as an intangible asset.","wrong":["IAS 38 explicitly prohibits recognizing internally generated brands and customer lists, because their cost cannot be distinguished from developing the business as a whole.","Research is always expensed because the entity cannot demonstrate probable future benefits at that stage.",null,"The entity does not control trained employees (they can leave), so training is not an asset."]}},{"tag":"IAS 41","ans":1,"ar":{"q":"أشجار النخيل التي تنتج التمر تُعالج وفق:","opts":["IAS 41 بالقيمة العادلة","IAS 16 كنباتات مثمرة","IAS 2","IAS 40"],"why":"النخل **نبات مثمر (Bearer plant)**: بيتستخدم لإنتاج محصول على مدار أكتر من فترة، ومش بيتباع هو نفسه غير كخردة. تعديل 2014 نقل النباتات المثمرة لـ **IAS 16** لأنها شبه الآلات. أما **التمر** وهو لسه على النخل فبيفضل في IAS 41.","wrong":["IAS 41 بيغطي التمر قبل الحصاد، لكن الشجرة نفسها اتنقلت لـ IAS 16.",null,"IAS 2 بيطبق على التمر **بعد الحصاد** بس، مش على الشجرة.","IAS 40 للعقارات المحتفظ بيها للإيجار أو ارتفاع القيمة، والنخل مش كده."]},"en":{"q":"Date palms that produce dates are accounted for under:","opts":["IAS 41 at fair value","IAS 16 as bearer plants","IAS 2","IAS 40"],"why":"Palms are **bearer plants**: used to produce crops over more than one period and not sold themselves except as scrap. The 2014 amendment moved bearer plants into **IAS 16** because they resemble machinery. The **dates** growing on the palms remain within IAS 41.","wrong":["IAS 41 covers the dates before harvest, but the tree itself moved to IAS 16.",null,"IAS 2 applies only to dates **after harvest**, not the tree.","IAS 40 is for property held for rental or capital appreciation, which palms are not."]}},{"tag":"IFRS 5","ans":1,"ar":{"q":"أصل مصنف محتفظًا به للبيع وفق IFRS 5:","opts":["يستمر إهلاكه","يتوقف إهلاكه ويقاس بالأقل بين القيمة الدفترية والقيمة العادلة ناقص تكاليف البيع","يقاس بالقيمة العادلة دائمًا","يبقى ضمن الأصول غير المتداولة"],"why":"لما الأصل يتصنف للبيع، قيمته هتسترد من **البيع** مش من الاستخدام، فـ **الإهلاك بيقف**. وبيتقاس بالأقل بين قيمته الدفترية والقيمة العادلة ناقص تكاليف البيع، علشان مايتسجلش بأعلى من اللي هيتحصل.","wrong":["الإهلاك بيقف بالظبط من تاريخ التصنيف.",null,"لو القيمة العادلة ناقص تكاليف البيع أعلى من الدفترية، بيفضل بالدفترية؛ IFRS 5 مش بيسمح بالربح عند التصنيف.","بيتعرض **منفصل** في سطر خاص بالأصول المحتفظ بيها للبيع، مش ضمن الأصول غير المتداولة العادية."]},"en":{"q":"An asset classified as held for sale under IFRS 5:","opts":["Continues to be depreciated","Stops being depreciated and is measured at the lower of carrying amount and fair value less costs to sell","Is always measured at fair value","Remains within non-current assets"],"why":"Once classified as held for sale, the asset’s value will be recovered through **sale**, not use, so **depreciation stops**. It is measured at the lower of carrying amount and fair value less costs to sell, so it is not carried above what will be received.","wrong":["Depreciation stops from the classification date.",null,"If fair value less costs to sell is higher than carrying amount, it stays at carrying amount; IFRS 5 does not allow a gain on classification.","It is presented **separately** in a held-for-sale line, not among ordinary non-current assets."]}},{"tag":"IAS 28","ans":1,"ar":{"q":"يملك مستثمر 25% من أسهم شركة، وله عضو في مجلس إدارتها. كيف يحاسب عن الاستثمار في القوائم المجمعة؟","opts":["تجميع كامل","طريقة حقوق الملكية","القيمة العادلة من خلال الأرباح والخسائر","التكلفة"],"why":"نسبة 25% بتعمل **افتراض نفوذ مؤثر** (من 20% لـ 50%)، والتمثيل في مجلس الإدارة مؤشر قوي بيأكده. يعني الشركة **شقيقة**، وIAS 28 بيطلب **طريقة حقوق الملكية**.","wrong":["التجميع للتابعة اللي فيها **سيطرة**، و25% مع عضو واحد في المجلس مش سيطرة.",null,"القيمة العادلة من خلال الأرباح والخسائر للاستثمارات اللي مفيهاش نفوذ مؤثر. (فيه استثناء لشركات رأس المال المخاطر بس.)","التكلفة ممكنة في القوائم **المنفصلة** للمستثمر حسب IAS 27، مش في القوائم المجمعة."]},"en":{"q":"An investor owns 25% of a company’s shares and has a seat on its board. How is the investment accounted for in the consolidated statements?","opts":["Full consolidation","Equity method","Fair value through profit or loss","Cost"],"why":"25% creates a **presumption of significant influence** (20% to 50%), and board representation is a strong indicator confirming it. So the company is an **associate**, and IAS 28 requires the **equity method**.","wrong":["Consolidation is for subsidiaries with **control**; 25% with one board seat is not control.",null,"FVTPL is for investments without significant influence. (There is an exception for venture capital organizations only.)","Cost is possible in the investor’s **separate** statements under IAS 27, not in the consolidated statements."]}},{"tag":"IFRS 2","ans":1,"ar":{"q":"في خيارات أسهم مسددة بأدوات حقوق ملكية بشرط سوقي (سعر السهم يصل 50)، لم يتحقق الشرط رغم بقاء الموظفين. ماذا يحدث للمصروف المعترف به؟","opts":["يُعكس بالكامل","لا يُعكس","يُعكس نصفه","يُحول لالتزام"],"why":"شروط **السوق** (زي سعر السهم) بتكون **محسوبة جوه القيمة العادلة** في تاريخ المنح، يعني احتمال عدم تحققها اتاخد في الاعتبار من الأول. فطالما الموظفين استوفوا شرط **الخدمة**، المصروف مايتعكسش حتى لو شرط السوق ماتحققش.","wrong":["العكس بيحصل لو شرط **الخدمة** أو شرط أداء **غير سوقي** ماتحققش، مش شرط السوق.",null,"مفيش حاجة اسمها عكس جزئي هنا؛ يا إما الشرط من النوع اللي بيأثر على العدد، يا إما لأ.","طريقة التسوية (أسهم) ماتغيرتش، فمفيش سبب يتحول لالتزام."]},"en":{"q":"Equity-settled share options with a market condition (share price reaching 50). The condition was not met although employees stayed. What happens to the expense recognized?","opts":["Fully reversed","Not reversed","Half reversed","Transferred to a liability"],"why":"**Market** conditions (like share price) are **built into the grant-date fair value**, so the probability of not meeting them was already reflected. As long as employees met the **service** condition, the expense is not reversed even if the market condition fails.","wrong":["Reversal happens if a **service** condition or a **non-market** performance condition is not met, not a market condition.",null,"There is no partial reversal here; either the condition affects the number of instruments or it does not.","The settlement method (shares) has not changed, so there is no reason to transfer it to a liability."]}},{"tag":"IFRS 16","ans":1,"ar":{"q":"عقد إيجار سيارة لمدة 10 أشهر بدون خيار شراء. اختارت المنشأة الإعفاء. المعالجة:","opts":["أصل حق استخدام والتزام","مصروف إيجار بالقسط الثابت","إيجار تمويلي","إفصاح فقط"],"why":"العقد مدته **12 شهر أو أقل** ومفيهوش خيار شراء، يعني **إيجار قصير الأجل**. IFRS 16 بيسمح للمستأجر يختار الإعفاء ويسجل الدفعات **مصروف بالقسط الثابت** بدل ما يسجل أصل والتزام.","wrong":["ده المعالجة العادية لو المنشأة ماختارتش الإعفاء. السؤال بيقول إنها اختارته.",null,"تصنيف تمويلي وتشغيلي موجود عند **المؤجر** بس في IFRS 16، مش عند المستأجر.","لازم يتسجل مصروف الإيجار؛ الإفصاح لوحده مش كفاية."]},"en":{"q":"A 10-month car lease with no purchase option. The entity elected the exemption. The treatment:","opts":["Right-of-use asset and liability","Lease expense on a straight-line basis","Finance lease","Disclosure only"],"why":"The lease term is **12 months or less** with no purchase option, so it is a **short-term lease**. IFRS 16 lets the lessee elect the exemption and recognize payments as an **expense on a straight-line basis** instead of an asset and liability.","wrong":["That is the normal treatment if the exemption is not elected. The question says it was elected.",null,"Finance/operating classification exists only for the **lessor** under IFRS 16, not the lessee.","The lease expense must be recognized; disclosure alone is not enough."]}},{"tag":"IAS 24","ans":2,"ar":{"q":"أي من التالي يُعد طرفًا ذا علاقة وفق IAS 24؟","opts":["البنك المقرض الرئيسي","أكبر عميل للشركة (60% من المبيعات)","زوجة العضو المنتدب","جهة حكومية تنظم القطاع"],"why":"IAS 24 بيعتبر **الأقارب المقربين** (زوج أو زوجة، أولاد، معالين) لأي حد من **الإدارة العليا** أطراف ذات علاقة، لأنهم ممكن يأثروا أو يتأثروا بقرارات الشخص ده. والعضو المنتدب من الإدارة العليا.","wrong":["IAS 24 بيستثني صراحة **مقدمي التمويل** من كونهم أطراف ذات علاقة لمجرد علاقة التمويل.","العميل الرئيسي مش طرف ذو علاقة لمجرد حجم التعامل، حتى لو الشركة معتمدة عليه اقتصاديًا.",null,"الجهات الحكومية والمرافق العامة مستثناة لمجرد التعامل العادي."]},"en":{"q":"Which of the following is a related party under IAS 24?","opts":["The main lending bank","The largest customer (60% of sales)","The managing director’s wife","A government agency regulating the sector"],"why":"IAS 24 treats **close family members** (spouse, children, dependants) of any **key management personnel** as related parties, because they may influence or be influenced by that person. The managing director is key management.","wrong":["IAS 24 explicitly excludes **providers of finance** from being related parties merely because of the financing relationship.","A major customer is not related merely because of volume of business, even with economic dependence.",null,"Government agencies and public utilities are excluded merely for normal dealings."]}},{"tag":"IFRS 15","ans":1,"ar":{"q":"وفق IFRS 15، عندما تكون المنشأة وكيلًا في بيع سلعة بـ 1,000 وتحصل على عمولة 100:","opts":["إيراد 1,000 وتكلفة 900","إيراد 100","إيراد 900","لا إيراد"],"why":"الوكيل **مش بيسيطر** على السلعة قبل ما تتنقل للعميل؛ التزامه بس إنه يرتب إن طرف تاني يوفرها. فبيسجل كإيراد **صافي العمولة** = 100.","wrong":["التسجيل بالإجمالي (1,000 إيراد و900 تكلفة) ده للأصيل اللي بيسيطر على السلعة. الربح واحد لكن الإيراد بيبقى متضخم.",null,"900 هو المبلغ المستحق للأصيل، ومش إيراد للوكيل أصلًا.","الوكيل عنده إيراد فعلًا، وهو العمولة."]},"en":{"q":"Under IFRS 15, when an entity acts as an agent selling goods for 1,000 and earns a commission of 100:","opts":["Revenue 1,000 and cost 900","Revenue 100","Revenue 900","No revenue"],"why":"An agent **does not control** the good before it transfers to the customer; its obligation is only to arrange for another party to provide it. So it recognizes the **net commission** of 100 as revenue.","wrong":["Gross recognition (revenue 1,000, cost 900) is for a principal that controls the good. Profit is the same but revenue would be overstated.",null,"900 is the amount due to the principal, not revenue for the agent at all.","The agent does have revenue: the commission."]}},{"tag":"IFRS 15","ans":1,"ar":{"q":"عقد لبيع آلة مع خدمة صيانة لمدة سنتين بسعر إجمالي 1,200. سعر البيع المنفرد للآلة 1,000 وللصيانة 400. كم الإيراد المخصص للآلة؟","opts":["1,000","857","800","1,200"],"why":"الخطوة 4 في IFRS 15: يتوزع السعر على التزامات الأداء **بنسبة أسعار البيع المنفردة**. إجمالي الأسعار المنفردة = 1,400. نصيب الآلة = 1,200 × 1,000 ÷ 1,400 = **857**، ويتسجل إيراد وقت التسليم.","wrong":["1,000 هو السعر المنفرد، لكن العقد فيه خصم 200 لازم يتوزع على الاتنين بالنسبة.",null,"800 ناتج عن طرح سعر الصيانة المنفرد من الإجمالي (1,200 − 400). ده \"الطريقة المتبقية\" ومش مسموحة هنا لأن السعرين المنفردين معروفين.","كل المبلغ مينفعش يتسجل للآلة لأن جزء منه مقابل خدمة الصيانة اللي لسه هتتقدم."]},"en":{"q":"A contract to sell a machine with two years of maintenance for a total price of 1,200. Standalone selling price of the machine is 1,000 and of the maintenance 400. How much revenue is allocated to the machine?","opts":["1,000","857","800","1,200"],"why":"Step 4 of IFRS 15: the price is allocated to performance obligations **in proportion to standalone selling prices**. Total standalone prices = 1,400. Machine share = 1,200 × 1,000 ÷ 1,400 = **857**, recognized on delivery.","wrong":["1,000 is the standalone price, but the contract includes a discount of 200 that must be allocated to both in proportion.",null,"800 comes from deducting the maintenance standalone price from the total (1,200 − 400). That is the \"residual approach\", not allowed here because both standalone prices are observable.","The whole amount cannot go to the machine because part of it is for maintenance still to be provided."]}},{"tag":"IFRS 16","ans":1,"ar":{"q":"عقد إيجار 5 سنوات بدفعة سنوية 100,000 آخر كل سنة، ومعدل الاقتراض الإضافي 10% (معامل القيمة الحالية 3.791). كم الفائدة في السنة الأولى؟","opts":["10,000","37,910","100,000","20,000"],"why":"أول خطوة: التزام الإيجار = القيمة الحالية للدفعات = 100,000 × 3.791 = **379,100**. بعدها الفائدة = الرصيد الافتتاحي × المعدل = 379,100 × 10% = **37,910**، وبتتعرض في الفئة التمويلية حسب IFRS 18.","wrong":["10,000 هو 10% من الدفعة السنوية، لكن الفائدة بتتحسب على **رصيد الالتزام** مش على الدفعة.",null,"100,000 هي الدفعة النقدية، وجزء منها بس فائدة والباقي بيسدد أصل الالتزام.","20,000 مالوش أساس حسابي؛ ممكن يكون إهلاك أصل الاستخدام لو اتحسب غلط، بس ده مش الفائدة."]},"en":{"q":"A 5-year lease with an annual payment of 100,000 at the end of each year, incremental borrowing rate 10% (PV factor 3.791). What is the interest in year 1?","opts":["10,000","37,910","100,000","20,000"],"why":"First, lease liability = PV of payments = 100,000 × 3.791 = **379,100**. Then interest = opening balance × rate = 379,100 × 10% = **37,910**, presented in the financing category under IFRS 18.","wrong":["10,000 is 10% of the annual payment, but interest is calculated on the **liability balance**, not the payment.",null,"100,000 is the cash payment; only part of it is interest and the rest reduces the liability.","20,000 has no basis; it might be a miscalculated depreciation figure, but it is not the interest."]}},{"tag":"IFRS 16","ans":2,"ar":{"q":"أي من التالي يصلح لإعفاء الأصل منخفض القيمة في IFRS 16؟","opts":["مبنى إداري","سيارة نقل","جهاز لابتوب","خط إنتاج"],"why":"الإعفاء بيتقيم على **قيمة الأصل وهو جديد**، بغض النظر عن أهميته للمنشأة. الأجهزة الصغيرة زي اللابتوب والتليفون والأثاث الصغير هي الأمثلة اللي المعيار نفسه ذكرها.","wrong":["المبنى قيمته عالية وهو جديد، فمينفعش.","السيارة مستبعدة صراحة في أساس الاستنتاج للمعيار لأن قيمتها وهي جديدة مش منخفضة.",null,"خط الإنتاج قيمته عالية جدًا."]},"en":{"q":"Which of the following qualifies for the low-value asset exemption in IFRS 16?","opts":["An office building","A delivery vehicle","A laptop","A production line"],"why":"The exemption is assessed on the **value of the asset when new**, regardless of its importance to the entity. Small items like laptops, phones and small furniture are the examples the standard itself mentions.","wrong":["A building has a high value when new, so it does not qualify.","Cars are explicitly excluded in the Basis for Conclusions because their value when new is not low.",null,"A production line has a very high value."]}},{"tag":"IFRS 9","ans":1,"ar":{"q":"سند محتفظ به لتحصيل التدفقات التعاقدية، وتدفقاته أصل وفائدة فقط. كيف يُقاس؟","opts":["القيمة العادلة من خلال الأرباح والخسائر","التكلفة المستهلكة","القيمة العادلة من خلال الدخل الشامل الآخر","التكلفة"],"why":"IFRS 9 بيحدد التصنيف باختبارين: **نموذج الأعمال** (هنا \"الاحتفاظ للتحصيل\") و**اختبار SPPI** (التدفقات أصل وفائدة بس). لما الاتنين يتحققوا يبقى القياس **بالتكلفة المستهلكة** بطريقة الفائدة الفعلية.","wrong":["FVTPL للي مايعديش اختبار SPPI أو نموذج أعماله متاجرة، أو لو المنشأة اختارت القيمة العادلة لتجنب عدم تطابق محاسبي.",null,"FVOCI لأدوات الدين لما نموذج الأعمال يكون \"تحصيل **وبيع**\"، وهنا الهدف التحصيل بس.","\"التكلفة\" لوحدها مش فئة قياس في IFRS 9."]},"en":{"q":"A bond held to collect contractual cash flows, whose cash flows are solely principal and interest. How is it measured?","opts":["Fair value through profit or loss","Amortized cost","Fair value through OCI","Cost"],"why":"IFRS 9 classifies using two tests: the **business model** (here \"hold to collect\") and the **SPPI test** (cash flows are solely principal and interest). When both are met, the asset is measured at **amortized cost** using the effective interest method.","wrong":["FVTPL is for assets failing SPPI or held for trading, or where the fair value option is elected to avoid an accounting mismatch.",null,"FVOCI for debt applies when the business model is \"collect **and sell**\"; here the objective is collection only.","\"Cost\" alone is not a measurement category in IFRS 9."]}},{"tag":"IFRS 9","ans":1,"ar":{"q":"زادت مخاطر الائتمان لقرض زيادة جوهرية منذ الاعتراف الأولي، لكنه غير مضمحل ائتمانيًا. كم الخسارة الائتمانية المتوقعة؟","opts":["12 شهرًا","على مدى العمر","صفر","حسب حكم الإدارة"],"why":"دي **المرحلة الثانية**: زيادة جوهرية في المخاطر من غير اضمحلال. المخصص بيتحول من 12 شهر لـ **الخسائر المتوقعة على مدى عمر الأداة**، والفائدة لسه بتتحسب على إجمالي القيمة الدفترية.","wrong":["12 شهر للمرحلة الأولى بس، لما مفيش زيادة جوهرية في المخاطر.",null,"نموذج ECL بيطلب مخصص حتى للأصول السليمة، فالصفر غلط.","فيه حكم في تحديد \"الزيادة الجوهرية\"، لكن لما تتحدد، المعيار بيحدد أساس القياس بالظبط."]},"en":{"q":"A loan’s credit risk has increased significantly since initial recognition, but it is not credit-impaired. What expected credit loss is recognized?","opts":["12-month","Lifetime","Zero","At management’s judgement"],"why":"This is **Stage 2**: a significant increase in risk without impairment. The allowance moves from 12-month to **lifetime expected credit losses**, and interest is still calculated on the gross carrying amount.","wrong":["12-month applies only to Stage 1, when there is no significant increase in risk.",null,"The ECL model requires an allowance even for performing assets, so zero is wrong.","Judgement is used to identify a \"significant increase\", but once identified, the standard specifies the measurement basis exactly."]}},{"tag":"IFRS 18","ans":1,"ar":{"q":"وفق IFRS 18، في أي فئة تُعرض حصة شركة صناعية في أرباح شركة شقيقة؟","opts":["التشغيلية","الاستثمارية","التمويلية","لا تُعرض في قائمة الدخل"],"why":"IFRS 18 بيلزم إن نتائج الاستثمارات المحاسبة **بطريقة حقوق الملكية** (الشقيقة والمشروعات المشتركة) تتعرض **دايمًا في الفئة الاستثمارية**. السبب إنها عائد على استثمار مستقل عن النشاط الرئيسي، فدخولها في الربح التشغيلي كان بيخلي المقارنة بين الشركات صعبة.","wrong":["ده كان شائع قبل IFRS 18، لكن دلوقتي ممنوع إن الحصة تدخل الربح التشغيلي.",null,"التمويلية لدخل ومصروف الالتزامات اللي جاية من التمويل، والشقيقة أصل مش التزام.","الحصة بتتعرض في قائمة الدخل كسطر مستقل."]},"en":{"q":"Under IFRS 18, in which category is a manufacturer’s share of profit of an associate presented?","opts":["Operating","Investing","Financing","Not presented in profit or loss"],"why":"IFRS 18 requires results of **equity-accounted** investments (associates and joint ventures) to be presented **always in the investing category**. They are a return on an investment independent of the main business, and including them in operating profit hurt comparability between entities.","wrong":["This was common before IFRS 18, but now the share may not be included in operating profit.",null,"Financing is for income and expenses on liabilities from raising finance; an associate is an asset, not a liability.","The share is presented in profit or loss as a separate line."]}},{"tag":"IFRS 18","ans":1,"ar":{"q":"أين يُفصح عن مقاييس الأداء المعرفة من الإدارة (MPMs) وفق IFRS 18؟","opts":["في تقرير مجلس الإدارة فقط","في إيضاح واحد داخل القوائم المالية مع تسوية","على وجه قائمة الدخل","لا يلزم الإفصاح عنها"],"why":"IFRS 18 بيطلب إن كل الـ MPMs تتجمع في **إيضاح واحد داخل القوائم المالية**، فيه: وصف المقياس وليه مفيد، و**تسوية** لأقرب مجموع فرعي في IFRS، والأثر الضريبي وأثر الحصة غير المسيطرة لكل بند تسوية. وبكده المقاييس دي بتبقى خاضعة للمراجعة.","wrong":["المشكلة اللي المعيار جه يحلها إن المقاييس دي كانت بتتنشر برا القوائم من غير رقابة.",null,"MPMs ممكن تظهر كمجاميع فرعية على وجه القائمة لو الشروط تسمح، لكن الإيضاح والتسوية إلزاميين في كل الأحوال.","الإفصاح إلزامي لو المقياس بيستوفي التعريف."]},"en":{"q":"Where are management-defined performance measures (MPMs) disclosed under IFRS 18?","opts":["In the directors’ report only","In a single note within the financial statements, with a reconciliation","On the face of the income statement","No disclosure required"],"why":"IFRS 18 requires all MPMs to be disclosed in **a single note within the financial statements**, including: a description of the measure and why it is useful, a **reconciliation** to the most directly comparable IFRS subtotal, and the tax and NCI effects of each reconciling item. This brings these measures within the scope of audit.","wrong":["The problem the standard addresses is that these measures were published outside the statements without oversight.",null,"MPMs may appear as subtotals on the face of the statement if conditions allow, but the note and reconciliation are required in all cases.","Disclosure is mandatory if the measure meets the definition."]}},{"tag":"IFRS 18","ans":2,"ar":{"q":"وفق IFRS 18، شركة صناعية عليها فائدة قرض بنكي. في أي فئة تُعرض؟","opts":["التشغيلية","الاستثمارية","التمويلية","ضرائب الدخل"],"why":"القرض البنكي **التزام ناتج عن معاملة الغرض منها الحصول على تمويل بس**. والمصروف على الالتزامات دي بيتعرض في **الفئة التمويلية** للمنشأة العادية غير المالية.","wrong":["لو المنشأة بنك أو شركة تمويل، ممكن تبقى تشغيلية لأن التمويل نشاطها الرئيسي. لكن الشركة الصناعية لأ.","الاستثمارية للدخل من الأصول زي فوائد الودائع، مش لفوائد القروض.",null,"ضرائب الدخل لمصروف ضريبة الدخل وفق IAS 12 بس."]},"en":{"q":"Under IFRS 18, a manufacturer has interest on a bank loan. In which category is it presented?","opts":["Operating","Investing","Financing","Income taxes"],"why":"A bank loan is **a liability arising from a transaction that involves only raising finance**. Expenses on such liabilities are presented in the **financing category** for a general, non-financial entity.","wrong":["For a bank or finance company it could be operating, because financing is its main business, but not for a manufacturer.","Investing is for income from assets such as interest on deposits, not loan interest.",null,"Income taxes is only for income tax expense under IAS 12."]}},{"tag":"IAS 37","ans":2,"ar":{"q":"أي تكلفة يجوز إدراجها في مخصص إعادة الهيكلة وفق IAS 37؟","opts":["إعادة تدريب الموظفين المستمرين","نقل الموظفين لموقع جديد","تعويضات إنهاء الخدمة","تسويق العلامة الجديدة"],"why":"مخصص إعادة الهيكلة بيشمل **التكاليف المباشرة الضرورية** للهيكلة و**غير المرتبطة بالأنشطة المستمرة** بس. تعويضات إنهاء الخدمة للي هيمشوا نتيجة مباشرة للهيكلة، فبتدخل.","wrong":["التدريب مرتبط بالأنشطة اللي هتستمر، فبيتسجل مصروف لما يحصل. IAS 37 ذكره بالاسم كاستثناء.","النقل برضه مرتبط بالأنشطة المستمرة، ومستثنى بالاسم.",null,"التسويق تكلفة مستقبلية للنشاط المستمر، ومستثناة بالاسم."]},"en":{"q":"Which cost may be included in a restructuring provision under IAS 37?","opts":["Retraining continuing staff","Relocating staff to a new site","Redundancy payments","Marketing the new brand"],"why":"A restructuring provision includes only **direct costs that are necessary** for the restructuring and **not associated with ongoing activities**. Redundancy payments for staff leaving as a direct result of the restructuring qualify.","wrong":["Retraining relates to ongoing activities, so it is expensed when incurred. IAS 37 names it explicitly as excluded.","Relocation also relates to ongoing activities and is explicitly excluded.",null,"Marketing is a future cost of the continuing business and is explicitly excluded."]}},{"tag":"IAS 37","ans":1,"ar":{"q":"كيف تُعالج القيمة الحالية لتكاليف إزالة منصة بترول عند إنشائها؟","opts":["مصروف فوري","مخصص يُضاف لتكلفة الأصل","إفصاح فقط","مخصص يُحمّل على الأرباح المحتجزة"],"why":"إنشاء المنصة بيعمل **التزام حالي** بإزالتها (حدث سابق)، فبيتسجل **مخصص** بالقيمة الحالية. والطرف المدين **بيتضاف لتكلفة الأصل** وفق IAS 16، لأن الإزالة جزء من تكلفة الحصول على الأصل، فبتتحمل على عمره عن طريق الإهلاك. وبعدين فك الخصم بيبقى مصروف تمويلي.","wrong":["لو اتسجل مصروف فوري، الأرباح هتقل في سنة واحدة رغم إن الأصل هيستخدم سنين كتير. ده مخالف لـ IAS 16.",null,"الالتزام محتمل ومقاس بموثوقية، فلازم يتسجل مخصص مش إفصاح بس.","مفيش سبب لتعديل الأرباح المحتجزة مباشرة؛ ده مش تصحيح خطأ ولا تغيير سياسة."]},"en":{"q":"How is the present value of dismantling costs for an oil platform treated when it is constructed?","opts":["Expensed immediately","A provision added to the cost of the asset","Disclosure only","A provision charged to retained earnings"],"why":"Constructing the platform creates a **present obligation** to dismantle it (a past event), so a **provision** is recognized at present value. The debit is **added to the asset’s cost** under IAS 16, because dismantling is part of the cost of obtaining the asset, so it is spread over its life through depreciation. Unwinding the discount is then a finance cost.","wrong":["Expensing it immediately would reduce profit in one year even though the asset is used for many years, contrary to IAS 16.",null,"The obligation is probable and reliably measurable, so a provision must be recognized, not just disclosed.","There is no reason to adjust retained earnings directly; this is neither an error nor a change in policy."]}},{"tag":"IAS 19","ans":1,"ar":{"q":"أين تُعترف إعادة قياس صافي التزام المزايا المحددة (الأرباح والخسائر الاكتوارية)؟","opts":["الأرباح والخسائر","الدخل الشامل الآخر بدون إعادة تصنيف","الدخل الشامل الآخر ثم يعاد تصنيفها","مباشرة في رأس المال"],"why":"IAS 19 بيقسم المصروف لـ 3 أجزاء: تكلفة الخدمة (أرباح وخسائر، تشغيلي)، صافي الفائدة (أرباح وخسائر، تمويلي)، و**إعادة القياس في OCI**. وإعادة القياس **عمرها ما بتتعاد تصنيفها** للأرباح والخسائر، لأنها تغيرات في التقديرات طويلة الأجل ومش أداء الفترة.","wrong":["تكلفة الخدمة وصافي الفائدة بس اللي في الأرباح والخسائر.",null,"إعادة التصنيف بتحصل في بنود زي فروق الترجمة وتحوط التدفقات النقدية، مش في إعادة قياس المعاشات.","ممكن تتنقل جوه حقوق الملكية للأرباح المحتجزة، لكن الاعتراف الأولي بيكون في OCI."]},"en":{"q":"Where are remeasurements of the net defined benefit liability (actuarial gains and losses) recognized?","opts":["Profit or loss","OCI, never reclassified","OCI, then reclassified","Directly in share capital"],"why":"IAS 19 splits the cost into 3 parts: service cost (P/L, operating), net interest (P/L, financing), and **remeasurements in OCI**. Remeasurements are **never reclassified** to profit or loss, because they are changes in long-term estimates, not the period’s performance.","wrong":["Only service cost and net interest go to profit or loss.",null,"Reclassification happens for items like translation differences and cash flow hedges, not pension remeasurements.","They may be transferred within equity to retained earnings, but initial recognition is in OCI."]}},{"tag":"IAS 12","ans":1,"ar":{"q":"أصل قيمته الدفترية 900 وأساسه الضريبي 700، ومعدل الضريبة 20%. ما الأثر؟","opts":["أصل ضريبي مؤجل 40","التزام ضريبي مؤجل 40","التزام ضريبي مؤجل 180","لا أثر"],"why":"القيمة الدفترية للأصل (900) أكبر من أساسه الضريبي (700)، يعني لما الأصل يسترد بقيمته الدفترية هتطلع أرباح ضريبية زيادة 200 في المستقبل. ده **فرق مؤقت خاضع للضريبة** ← **التزام** ضريبي مؤجل = 200 × 20% = **40**.","wrong":["الأصل الضريبي المؤجل بيطلع لما القيمة الدفترية للأصل **أقل** من أساسه الضريبي. هنا العكس.",null,"180 = 900 × 20%. الضريبة المؤجلة بتتحسب على **الفرق** مش على القيمة كلها.","فيه فرق مؤقت 200 فلازم يبقى فيه أثر."]},"en":{"q":"An asset with a carrying amount of 900 and a tax base of 700; tax rate 20%. What is the effect?","opts":["Deferred tax asset of 40","Deferred tax liability of 40","Deferred tax liability of 180","No effect"],"why":"The asset’s carrying amount (900) exceeds its tax base (700), so recovering it at carrying amount will generate an extra 200 of taxable profit in future. This is a **taxable temporary difference** → a deferred tax **liability** = 200 × 20% = **40**.","wrong":["A deferred tax asset arises when an asset’s carrying amount is **lower** than its tax base. Here it is the opposite.",null,"180 = 900 × 20%. Deferred tax is calculated on the **difference**, not the whole amount.","There is a temporary difference of 200, so there must be an effect."]}},{"tag":"IFRS 3","ans":1,"ar":{"q":"دفعت شركة 1,000 لشراء 80% من شركة، والقيمة العادلة لحقوق غير المسيطرين 300، وصافي الأصول بالقيمة العادلة 1,100. كم الشهرة؟","opts":["120","200","100","300"],"why":"الشهرة = العوض المحول + الحصة غير المسيطرة + القيمة العادلة لأي حصة سابقة − صافي الأصول القابلة للتحديد بالقيمة العادلة. يعني 1,000 + 300 − 1,100 = **200**. (دي \"شهرة كاملة\" لأن الحصة غير المسيطرة متقاسة بالقيمة العادلة.)","wrong":["120 = 1,000 − 80% × 1,100. دي طريقة قديمة بتحسب الشهرة الخاصة بالأم بس ومش بتراعي الحصة غير المسيطرة زي ما IFRS 3 بيطلب.",null,"100 = 1,100 − 1,000. ده خلط في ترتيب المعادلة.","300 هي الحصة غير المسيطرة نفسها مش الشهرة."]},"en":{"q":"A company paid 1,000 for 80% of another; fair value of NCI is 300 and net assets at fair value are 1,100. What is goodwill?","opts":["120","200","100","300"],"why":"Goodwill = consideration transferred + NCI + fair value of any previous interest − identifiable net assets at fair value. So 1,000 + 300 − 1,100 = **200**. (This is \"full goodwill\" because NCI is at fair value.)","wrong":["120 = 1,000 − 80% × 1,100. That is an old method calculating only the parent’s goodwill and ignoring NCI as IFRS 3 requires.",null,"100 = 1,100 − 1,000, which mixes up the order of the formula.","300 is the NCI itself, not goodwill."]}},{"tag":"IFRS 10","ans":1,"ar":{"q":"ما عناصر السيطرة الثلاثة في IFRS 10؟","opts":["ملكية أكثر من 50% وتعيين المجلس وتوزيعات","سلطة، وتعرض لعوائد متغيرة، وقدرة على استخدام السلطة للتأثير على العوائد","نفوذ مؤثر وتمثيل في المجلس ومعاملات","ملكية الأصول وإدارة النقدية وحق التصويت"],"why":"IFRS 10 بيعرّف السيطرة بثلاث عناصر **لازم يتحققوا مع بعض**: (1) **سلطة** على الأنشطة ذات الصلة، (2) **تعرض لعوائد متغيرة**، (3) **قدرة على استخدام السلطة** للتأثير على العوائد دي. والنسبة مش شرط، فممكن تبقى فيه سيطرة بأقل من 50%.","wrong":["أكتر من 50% مؤشر شائع لكنه مش التعريف. ممكن يبقى فيه سيطرة بأقل (سيطرة فعلية) ومفيش سيطرة بأكتر (لو حقوق التصويت مش جوهرية).",null,"دي مؤشرات **النفوذ المؤثر** في IAS 28، يعني شركة شقيقة مش تابعة.","دي مش العناصر اللي المعيار حددها."]},"en":{"q":"What are the three elements of control in IFRS 10?","opts":["Over 50% ownership, board appointment and dividends","Power, exposure to variable returns, and the ability to use power to affect returns","Significant influence, board representation and transactions","Asset ownership, cash management and voting rights"],"why":"IFRS 10 defines control by three elements that **must all be present**: (1) **power** over relevant activities, (2) **exposure to variable returns**, (3) **the ability to use power** to affect those returns. A percentage is not required; control can exist below 50%.","wrong":["Over 50% is a common indicator but not the definition. Control can exist below it (de facto control), and not exist above it (if voting rights are not substantive).",null,"These are indicators of **significant influence** under IAS 28, i.e., an associate, not a subsidiary.","These are not the elements the standard specifies."]}},{"tag":"IAS 23","ans":1,"ar":{"q":"تكاليف قرض محدد لإنشاء مصنع يستغرق سنتين:","opts":["يجوز رسملتها اختياريًا","يجب رسملتها خلال فترة الإنشاء","مصروف دائمًا","تُرسمل فقط بعد اكتمال المصنع"],"why":"المصنع **أصل مؤهل** لأنه بياخد فترة طويلة لحد ما يبقى جاهز. وIAS 23 بيقول إن تكاليف الاقتراض المنسوبة مباشرة للأصل المؤهل **لازم** تترسمل (مش اختياري) خلال فترة الإنشاء.","wrong":["الرسملة كانت اختيارية في نسخة قديمة من IAS 23 قبل 2009، لكن دلوقتي إلزامية.",null,"المصروف بيبقى للأصول غير المؤهلة أو للفترات اللي برا فترة الرسملة.","الرسملة **بتقف** لما الأصل يكمل؛ الفوائد بعد الاكتمال مصروف."]},"en":{"q":"Interest on a specific loan to build a factory that takes two years:","opts":["May optionally be capitalized","Must be capitalized during construction","Is always expensed","Is capitalized only after the factory is complete"],"why":"The factory is a **qualifying asset** because it takes a substantial period to get ready. IAS 23 states that borrowing costs directly attributable to a qualifying asset **must** be capitalized (not optional) during construction.","wrong":["Capitalization was optional in an old version of IAS 23 before 2009, but it is now mandatory.",null,"Expensing applies to non-qualifying assets or to periods outside the capitalization period.","Capitalization **stops** when the asset is complete; interest after completion is an expense."]}},{"tag":"IAS 21","ans":1,"ar":{"q":"اشترت شركة بضاعة بـ 10,000 دولار على الحساب بسعر 48، وفي نهاية السنة السعر 50 والمورد لم يُسدَّد. المعالجة؟","opts":["لا تعديل","خسارة فروق عملة 20,000 في الأرباح والخسائر","خسارة 20,000 في OCI","تعديل تكلفة المخزون"],"why":"الدائنون **بند نقدي** (هتدفع عدد ثابت من الدولارات)، والبنود النقدية بتتترجم بـ **سعر الإقفال** في نهاية الفترة: 10,000 × 50 = 500,000. الفرق عن 480,000 = **خسارة 20,000** في الأرباح والخسائر.","wrong":["البنود النقدية لازم تتعدل لسعر الإقفال. التعديل بيتلغى بس للبنود غير النقدية بالتكلفة.",null,"فروق ترجمة **العمليات الأجنبية** هي اللي بتروح OCI، مش فروق المعاملات العادية.","المخزون **بند غير نقدي** بالتكلفة، فبيفضل بالسعر التاريخي (480,000). فرق العملة مالوش علاقة بتكلفة البضاعة."]},"en":{"q":"A company bought goods for 10,000 dollars on credit at a rate of 48; at year end the rate is 50 and the supplier is unpaid. The treatment?","opts":["No adjustment","Exchange loss of 20,000 in profit or loss","Loss of 20,000 in OCI","Adjust the cost of inventory"],"why":"Payables are a **monetary item** (a fixed number of dollars to pay), and monetary items are retranslated at the **closing rate**: 10,000 × 50 = 500,000. The difference from 480,000 is a **loss of 20,000** in profit or loss.","wrong":["Monetary items must be retranslated at the closing rate. No retranslation applies only to non-monetary items at cost.",null,"Translation differences on **foreign operations** go to OCI, not differences on ordinary transactions.","Inventory is a **non-monetary item** at cost, so it stays at the historical rate (480,000). The exchange difference is not part of the cost of goods."]}},{"tag":"IAS 40","ans":1,"ar":{"q":"عقار استثماري بنموذج القيمة العادلة زادت قيمته من 5,000 إلى 5,600. المعالجة؟","opts":["600 في OCI وإهلاك سنوي","600 في الأرباح والخسائر بدون إهلاك","لا يُعترف بالزيادة","600 في الأرباح والخسائر مع إهلاك"],"why":"في نموذج القيمة العادلة في IAS 40، كل تغير في القيمة العادلة بيروح **الأرباح والخسائر** (وفي IFRS 18 بيبقى في الفئة الاستثمارية)، و**مفيش إهلاك** لأن القيمة العادلة بتعكس أي استهلاك.","wrong":["ده بيخلط مع **نموذج إعادة التقييم** في IAS 16 (الزيادة في OCI مع إهلاك). العقار الاستثماري مختلف.",null,"الزيادة لازم تتسجل في نموذج القيمة العادلة. اللي مش بيسجلها هو نموذج التكلفة.","الإهلاك مش بيتحسب في نموذج القيمة العادلة."]},"en":{"q":"An investment property under the fair value model rose in value from 5,000 to 5,600. The treatment?","opts":["600 in OCI with annual depreciation","600 in profit or loss, no depreciation","The increase is not recognized","600 in profit or loss with depreciation"],"why":"Under the IAS 40 fair value model, every change in fair value goes to **profit or loss** (in the investing category under IFRS 18), and there is **no depreciation** because fair value already reflects any wear.","wrong":["This confuses it with the IAS 16 **revaluation model** (increase in OCI with depreciation). Investment property is different.",null,"The increase must be recognized under the fair value model. Only the cost model ignores it.","Depreciation is not charged under the fair value model."]}},{"tag":"IFRS 13","ans":1,"ar":{"q":"أي مما يلي مُدخل من المستوى الثاني في IFRS 13؟","opts":["سعر معلن لنفس السهم في البورصة","سعر معلن لأصل مشابه في سوق نشط","توقعات الإدارة للتدفقات النقدية","تقدير خبير بدون بيانات سوقية"],"why":"المستوى الثاني هو **مدخلات ملحوظة** غير الأسعار المعلنة للأصل المطابق، زي **أسعار أصول مشابهة**، أو أسعار في أسواق غير نشطة، أو أسعار فائدة ومنحنيات عائد ملحوظة.","wrong":["سعر معلن لأصل **مطابق** في سوق نشط ده **المستوى الأول**، وهو أعلى درجة موثوقية.",null,"توقعات الإدارة مدخلات **غير ملحوظة** ← المستوى الثالث.","التقدير من غير بيانات سوقية **غير ملحوظ** ← المستوى الثالث."]},"en":{"q":"Which of the following is a Level 2 input under IFRS 13?","opts":["A quoted price for the same share on an exchange","A quoted price for a similar asset in an active market","Management’s cash flow forecasts","An expert estimate with no market data"],"why":"Level 2 is **observable inputs** other than quoted prices for the identical asset, such as **prices of similar assets**, prices in inactive markets, or observable interest rates and yield curves.","wrong":["A quoted price for an **identical** asset in an active market is **Level 1**, the most reliable.",null,"Management forecasts are **unobservable** → Level 3.","An estimate without market data is **unobservable** → Level 3."]}},{"tag":"IFRS 5","ans":1,"ar":{"q":"ما الذي يجعل المكون \"عملية متوقفة\" وفق IFRS 5؟","opts":["أي أصل محتفظ به للبيع","خط أعمال رئيسي منفصل أو منطقة جغرافية رئيسية تم استبعاده أو مصنف للبيع","أي فرع خاسر","آلة تم بيعها"],"why":"العملية المتوقفة لازم تكون **مكون** من المنشأة (عملياته وتدفقاته متفصلة بوضوح) و**بيمثل خط أعمال رئيسي منفصل أو منطقة جغرافية رئيسية**، أو تابعة مشتراة بغرض البيع، وتكون اتستبعدت أو اتصنفت للبيع.","wrong":["الأصل الواحد المحتفظ به للبيع بيتعرض منفصل في الميزانية، لكنه مش عملية متوقفة إلا لو كان خط أعمال رئيسي.",null,"كون الفرع خسران مش معيار. اللازم إنه يتستبعد أو يتصنف للبيع ويكون رئيسي.","بيع آلة واحدة استبعاد أصل عادي، مش توقف نشاط."]},"en":{"q":"What makes a component a \"discontinued operation\" under IFRS 5?","opts":["Any asset held for sale","A separate major line of business or geographical area that has been disposed of or classified as held for sale","Any loss-making branch","A machine that has been sold"],"why":"A discontinued operation must be a **component** of the entity (with clearly distinguishable operations and cash flows) that **represents a separate major line of business or geographical area**, or a subsidiary acquired exclusively for resale, and has been disposed of or classified as held for sale.","wrong":["A single asset held for sale is presented separately on the balance sheet, but is not a discontinued operation unless it is a major line of business.",null,"Being loss-making is not the criterion; it must be disposed of or held for sale and be major.","Selling one machine is an ordinary asset disposal, not discontinuing an activity."]}},{"tag":"IAS 33","ans":1,"ar":{"q":"عند حساب ربحية السهم المخفضة مع سندات قابلة للتحويل:","opts":["تُضاف الفائدة قبل الضريبة للربح","تُضاف الفائدة بعد الضريبة للربح، وتُضاف الأسهم المحتملة للمقام","تُضاف الأسهم فقط","لا تُعدل"],"why":"ربحية السهم المخفضة بتفترض إن التحويل حصل من أول الفترة: الشركة كانت هتوفر **الفائدة**، لكن هتخسر الوفر الضريبي عليها، فبنضيف **الفائدة × (1 − معدل الضريبة)** للبسط، وبنضيف الأسهم اللي كانت هتتصدر للمقام.","wrong":["الفائدة مصروف قابل للخصم ضريبيًا، فالوفر الحقيقي في الربح هو بعد الضريبة مش قبلها.",null,"لو زودنا المقام بس من غير البسط، هنبالغ في التخفيض.","السندات القابلة للتحويل أسهم عادية محتملة، ولازم تتعمل لو كانت مخففة."]},"en":{"q":"When calculating diluted EPS with convertible bonds:","opts":["Add back pre-tax interest to profit","Add back post-tax interest to profit and add the potential shares to the denominator","Add only the shares","No adjustment"],"why":"Diluted EPS assumes conversion happened at the start of the period: the company would save the **interest**, but lose the tax relief on it, so we add **interest × (1 − tax rate)** to the numerator and the shares that would be issued to the denominator.","wrong":["Interest is tax-deductible, so the real saving in profit is after tax, not before.",null,"Increasing only the denominator without the numerator overstates dilution.","Convertible bonds are potential ordinary shares and must be included if dilutive."]}},{"tag":"IFRS 8","ans":1,"ar":{"q":"ما الحد الكمي الأساسي لتحديد قطاع تشغيلي قابل للتقرير في IFRS 8؟","opts":["5%","10% من الإيراد أو الربح أو الأصول","25%","50%"],"why":"القطاع بيبقى قابل للتقرير لو وصل **10% أو أكتر** من أي واحد من التلاتة: الإيرادات المجمعة (داخلية وخارجية)، أو الربح أو الخسارة (بالقيمة المطلقة)، أو الأصول. وكمان القطاعات اللي بيتفصح عنها لازم تغطي **75%** على الأقل من الإيراد الخارجي.","wrong":["5% مش حد في IFRS 8.",null,"25% مش حد في المعيار.","50% أعلى بكتير من الحد. 75% هو الحد الإجمالي للتغطية، مش لكل قطاع."]},"en":{"q":"What is the main quantitative threshold for a reportable operating segment under IFRS 8?","opts":["5%","10% of revenue, profit or assets","25%","50%"],"why":"A segment is reportable if it reaches **10% or more** of any of: combined revenue (internal and external), profit or loss (in absolute terms), or assets. Reported segments must also cover at least **75%** of external revenue.","wrong":["5% is not a threshold in IFRS 8.",null,"25% is not a threshold in the standard.","50% is far above the threshold. 75% is the overall coverage test, not a per-segment threshold."]}},{"tag":"IAS 20","ans":1,"ar":{"q":"منحة حكومية لشراء آلة. أي معالجة مسموحة وفق IAS 20؟","opts":["إيراد فوري","دخل مؤجل يُستهلك على عمر الأصل أو تخفيض تكلفة الأصل","إضافة لرأس المال","التزام دائم"],"why":"IAS 20 بيطلب إن المنحة تتسجل في الأرباح والخسائر **بانتظام مقابل التكاليف اللي بتعوضها**. للمنحة المرتبطة بأصل فيه طريقتين مسموحتين: **دخل مؤجل** يتطفأ على عمر الأصل، أو **تخفيض تكلفة الأصل** فيقل الإهلاك. الأثر على الربح واحد.","wrong":["الإيراد الفوري بيخالف مبدأ المقابلة لأن الآلة هتستخدم سنين.",null,"المنحة مش مساهمة من الملاك، فمينفعش تروح حقوق الملكية مباشرة.","المنحة مش التزام دائم، ممكن تبقى التزام بس لو فيه شك جوهري في الوفاء بشروطها."]},"en":{"q":"A government grant to buy a machine. Which treatment is permitted under IAS 20?","opts":["Immediate income","Deferred income released over the asset’s life, or deduction from the asset’s cost","Credit to share capital","A permanent liability"],"why":"IAS 20 requires grants to be recognized in profit or loss **systematically, matching the costs they compensate**. For asset-related grants there are two permitted methods: **deferred income** released over the asset’s life, or **deducting the grant from the asset’s cost**, reducing depreciation. The effect on profit is the same.","wrong":["Immediate income violates matching because the machine will be used for years.",null,"A grant is not an owner contribution, so it cannot go directly to equity.","A grant is not a permanent liability; it is a liability only if there is significant doubt about meeting its conditions."]}},{"tag":"IFRS 19","ans":1,"ar":{"q":"من يحق له تطبيق IFRS 19؟","opts":["أي شركة مدرجة","تابعة غير خاضعة للمساءلة العامة، وشركتها الأم تُعد قوائم مجمعة وفق IFRS","البنوك","أي شركة صغيرة"],"why":"IFRS 19 **اختياري** لثلاث شروط مع بعض: إنها **تابعة**، و**مش خاضعة للمساءلة العامة** (أدواتها مش متداولة ومش بتحتفظ بأصول للغير كنشاط رئيسي)، و**الأم النهائية أو الوسيطة** بتنشر قوائم مجمعة وفق IFRS.","wrong":["الشركة المدرجة خاضعة للمساءلة العامة، فمستبعدة.",null,"البنوك بتحتفظ بأصول للغير كنشاط رئيسي، فخاضعة للمساءلة العامة.","لازم تكون تابعة لأم بتطبق IFRS. والشركات الصغيرة المستقلة ليها معيار IFRS for SMEs."]},"en":{"q":"Who may apply IFRS 19?","opts":["Any listed company","A subsidiary without public accountability whose parent prepares IFRS consolidated statements","Banks","Any small company"],"why":"IFRS 19 is **optional** when three conditions are met together: it is a **subsidiary**, it has **no public accountability** (its instruments are not traded and it does not hold assets in a fiduciary capacity as a main business), and its **ultimate or intermediate parent** publishes IFRS consolidated statements.","wrong":["A listed company has public accountability, so it is excluded.",null,"Banks hold assets in a fiduciary capacity as a main business, so they have public accountability.","It must be a subsidiary of a parent applying IFRS. Small stand-alone entities have IFRS for SMEs."]}},{"tag":"IFRS 2","ans":0,"ar":{"q":"كيف تُقاس خيارات الأسهم المسددة بأدوات حقوق ملكية للموظفين؟","opts":["بالقيمة العادلة في تاريخ المنح بدون إعادة قياس","بالقيمة العادلة في كل تاريخ تقرير","بالقيمة الذاتية في تاريخ الممارسة","بالتكلفة"],"why":"IFRS 2 بيقيس الخيارات المسددة بأسهم بـ **القيمة العادلة في تاريخ المنح**، وبتفضل ثابتة. اللي بيتغير بس هو **تقدير عدد الخيارات** المتوقع استحقاقها (بسبب شروط الخدمة والأداء غير السوقي).","wrong":[null,"إعادة القياس في كل تاريخ تقرير دي للمدفوعات **المسددة نقدًا** (SARs) لأنها التزام.","القيمة الذاتية بتتستخدم في حالات نادرة جدًا لما القيمة العادلة مش ممكن تتقاس بموثوقية.","مفيش تكلفة نقدية أصلًا؛ المنشأة بتسجل قيمة الخدمات المستلمة."]},"en":{"q":"How are equity-settled share options for employees measured?","opts":["At grant-date fair value, not remeasured","At fair value at each reporting date","At intrinsic value at exercise date","At cost"],"why":"IFRS 2 measures equity-settled options at **grant-date fair value**, which stays fixed. Only the **estimate of the number of options** expected to vest changes (due to service and non-market performance conditions).","wrong":[null,"Remeasurement at each reporting date applies to **cash-settled** payments (SARs) because they are a liability.","Intrinsic value is used only in rare cases where fair value cannot be measured reliably.","There is no cash cost; the entity recognizes the value of services received."]}},{"tag":"IAS 32","ans":1,"ar":{"q":"أسهم ممتازة واجبة الاسترداد بمبلغ ثابت في تاريخ محدد. كيف تُصنف وفق IAS 32؟","opts":["حقوق ملكية","التزام مالي","أداة مركبة دائمًا","إفصاح فقط"],"why":"IAS 32 بيصنف حسب **الجوهر مش الشكل القانوني**. الأسهم دي فيها **التزام تعاقدي** إن المنشأة تدفع نقدية في تاريخ محدد ومش قادرة تتجنبه، فهي **التزام مالي**، وتوزيعاتها بتتسجل مصروف فوائد.","wrong":["شكلها القانوني أسهم، لكن الالتزام بالسداد بيخليها التزام. وده الفخ الأشهر في IAS 32.",null,"تبقى مركبة لو فيها مكون حقوق ملكية (زي توزيعات تقديرية أو خيار تحويل). السؤال مفيهوش ده.","لازم يتسجل التزام في الميزانية."]},"en":{"q":"Preference shares mandatorily redeemable for a fixed amount on a specified date. How are they classified under IAS 32?","opts":["Equity","Financial liability","Always a compound instrument","Disclosure only"],"why":"IAS 32 classifies by **substance, not legal form**. These shares contain a **contractual obligation** to pay cash on a specified date that the entity cannot avoid, so they are a **financial liability**, and their dividends are recognized as interest expense.","wrong":["Legally they are shares, but the obligation to redeem makes them a liability. This is the most famous IAS 32 trap.",null,"They would be compound if they had an equity component (such as discretionary dividends or a conversion option). The question has none.","A liability must be recognized on the balance sheet."]}},{"tag":"IFRS 11","ans":1,"ar":{"q":"ترتيب مشترك منظم في شركة مستقلة، والأطراف ليها حقوق في صافي أصوله فقط. كيف يُحاسب؟","opts":["عملية مشتركة: كل طرف يعترف بحصته في الأصول والالتزامات","مشروع مشترك بطريقة حقوق الملكية","تجميع كامل","بالقيمة العادلة"],"why":"IFRS 11 بيفرق حسب **الحقوق والالتزامات**: لو الأطراف ليها حقوق في **صافي أصول** الترتيب (عادة شركة منفصلة) يبقى **مشروع مشترك (Joint venture)**، وبيتحاسب **بطريقة حقوق الملكية** وفق IAS 28.","wrong":["العملية المشتركة لما الأطراف يكون ليها حقوق مباشرة في الأصول والتزامات عن الالتزامات، مش في الصافي.",null,"التجميع للسيطرة المنفردة، والسيطرة هنا مشتركة.","القيمة العادلة مش الطريقة الأساسية للمشروعات المشتركة (إلا لمنشآت معينة زي صناديق رأس المال المخاطر)."]},"en":{"q":"A joint arrangement structured through a separate company, where the parties have rights only to its net assets. How is it accounted for?","opts":["Joint operation: each party recognizes its share of assets and liabilities","Joint venture, equity method","Full consolidation","Fair value"],"why":"IFRS 11 classifies by **rights and obligations**: if the parties have rights to the **net assets** of the arrangement (usually a separate company), it is a **joint venture**, accounted for using the **equity method** under IAS 28.","wrong":["A joint operation is where the parties have direct rights to assets and obligat
