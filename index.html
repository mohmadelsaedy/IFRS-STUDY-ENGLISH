<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مذاكرة IFRS – شرح وتدريب وأسئلة DipIFR و Cert IFR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --sunk:#EAF0EC; --text:#1B2631; --muted:#5B6875; --rule:#D3DDD7;
  --ink:#16395C; --ink-soft:#E3ECF5; --dr:#1B7651; --dr-soft:#E2F2EA; --cr:#B13C2C; --cr-soft:#F9E6E2;
  --gold:#8A6410; --gold-soft:#FBF1D9; --shadow:0 1px 0 rgba(22,57,92,.06);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1821; --surface:#15232F; --sunk:#1B2C3A; --text:#E4EBF0; --muted:#9AABB9; --rule:#2A3D4D;
  --ink:#8FBAE6; --ink-soft:#1C3247; --dr:#5CC79A; --dr-soft:#153328; --cr:#EB8273; --cr-soft:#3A1F1B;
  --gold:#E3BE6A; --gold-soft:#33291A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1821; --surface:#15232F; --sunk:#1B2C3A; --text:#E4EBF0; --muted:#9AABB9; --rule:#2A3D4D;
  --ink:#8FBAE6; --ink-soft:#1C3247; --dr:#5CC79A; --dr-soft:#153328; --cr:#EB8273; --cr-soft:#3A1F1B;
  --gold:#E3BE6A; --gold-soft:#33291A; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.85}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);line-height:1.5;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:14px;max-width:1280px;margin:0 auto;padding:10px 18px}
.brand{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;font-weight:800;color:var(--ink);font-size:18px;white-space:nowrap;background:none;border:0;padding:0}
.brand small{display:block;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:500;font-size:12px;color:var(--muted);line-height:1.2}
nav.tabs{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--ink-soft)}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.meter .track{width:90px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter .fill{height:100%;background:var(--dr);width:0;transition:width .4s}
#menuBtn{display:none;background:var(--sunk);border:0;border-radius:8px;padding:6px 10px;color:var(--ink);font-weight:600}

/* layout */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1280px;margin:0 auto;gap:0}
aside.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100vh - 58px);overflow:auto;border-inline-end:1px solid var(--rule);padding:18px 14px 40px;background:var(--bg)}
.toc h4{font-size:13px;color:var(--muted);margin:18px 6px 6px;font-weight:600}
.toc button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:right;background:none;border:0;padding:6px 8px;border-radius:7px;color:var(--text);font-size:14.5px;line-height:1.6}
.toc button:hover{background:var(--sunk)}
.toc button.on{background:var(--ink-soft);color:var(--ink);font-weight:600}
.toc .tick{flex:none;width:16px;height:16px;margin-top:4px;border:1.5px solid var(--rule);border-radius:50%}
.toc .done .tick{background:var(--dr);border-color:var(--dr);box-shadow:inset 0 0 0 3px var(--bg)}
main{padding:28px clamp(16px,4vw,48px) 120px;min-width:0}
.col{max-width:780px}

/* content blocks */
.crumb{color:var(--muted);font-size:14px;margin-bottom:6px}
.lesson-title{font-size:clamp(24px,3.4vw,32px);font-weight:800;margin-bottom:18px}
main h3{font-size:20px;margin:28px 0 10px}
main p{margin:0 0 14px}
main ul,main ol{margin:0 0 16px;padding-inline-start:24px}
main li{margin-bottom:6px}
main li::marker{color:var(--ink)}
.tbl{overflow-x:auto;margin:6px 0 20px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.7}
th{background:var(--ink);color:var(--surface);text-align:right;padding:9px 12px;font-weight:600;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--rule);vertical-align:top}
tr.strong td{background:var(--ink-soft);font-weight:700}
/* ledger (journal entries) */
.ledger{margin:6px 0 22px;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.ledger .lh{display:flex;justify-content:space-between;padding:6px 14px;font-size:13px;color:var(--muted);background:var(--sunk)}
.ledger table th{background:transparent;color:var(--muted);font-size:13px;border-bottom:2px solid var(--text)}
.ledger td.amt{font-variant-numeric:tabular-nums;white-space:nowrap;width:22%;text-align:left;font-weight:600}
.ledger td.dr{color:var(--dr)} .ledger td.cr{color:var(--cr)}
.ledger tr.credit td:first-child{padding-inline-start:40px}
.box{border-radius:10px;padding:14px 18px;margin:8px 0 22px;border-inline-start:4px solid}
.box .bt{font-weight:700;margin-bottom:6px}
.box p{margin:0 0 6px}
.box.ex{background:var(--gold-soft);border-color:var(--gold)} .box.ex .bt{color:var(--gold)}
.box.note{background:var(--cr-soft);border-color:var(--cr)} .box.note .bt{color:var(--cr)}
.box.new{background:var(--dr-soft);border-color:var(--dr)} .box.new .bt{color:var(--dr)}
.box.exam{background:var(--ink-soft);border-color:var(--ink)} .box.exam .bt{color:var(--ink)}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.good{background:var(--dr);border-color:var(--dr);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ai-only[hidden]{display:none!important}

/* home timeline */
.hero{padding:6px 0 10px}
.hero h1{font-size:clamp(26px,4vw,40px);font-weight:800;line-height:1.35;max-width:18em}
.hero p{color:var(--muted);max-width:40em;margin:12px 0 0}
.timeline{position:relative;margin:34px 0 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.timeline::before{content:"";position:absolute;top:22px;right:0;left:0;height:3px;background:linear-gradient(to left,var(--dr),var(--ink) 50%,var(--muted))}
.stop{position:relative;padding:0 0 0 18px}
.stop .yr{display:inline-block;position:relative;font-family:"Noto Kufi Arabic",Tahoma,sans-serif;font-weight:800;font-size:28px;color:var(--ink);background:var(--bg);padding-inline-end:12px;line-height:46px}
.stop .yr::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid currentColor;margin-inline-end:10px;vertical-align:middle}
.stop:first-child .yr{color:var(--dr)}
.stop .st{font-size:13px;color:var(--muted);margin:2px 0 10px}
.stop ul{list-style:none;padding:0;margin:0}
.stop li{padding:8px 0;border-top:1px dashed var(--rule);font-size:15px;line-height:1.65}
.stop li b{color:var(--text)}
.stats{display:flex;flex-wrap:wrap;gap:26px;margin:10px 0 26px;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stats div{font-size:14px;color:var(--muted)} .stats b{display:block;font-size:26px;color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,sans-serif}

/* quiz */
.q{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.q .qt{font-weight:600;margin-bottom:10px}
.q .tag{font-size:13px;color:var(--muted);margin-top:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:right;width:100%;background:var(--bg);border:1.5px solid var(--rule);border-radius:9px;padding:9px 12px;color:var(--text);line-height:1.6}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--dr);background:var(--dr-soft)} .opt.right .k{background:var(--dr);color:var(--surface)}
.opt.wrong{border-color:var(--cr);background:var(--cr-soft)} .opt.wrong .k{background:var(--cr);color:var(--surface)}
.opt:disabled{cursor:default}
.why{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:15.5px}
.why b.ok{color:var(--dr)} .why b.no{color:var(--cr)}
.runner-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:14px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i.r{background:var(--dr)} .dots i.w{background:var(--cr)} .dots i.c{background:var(--ink)}
.score{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;font-size:54px;font-weight:800;color:var(--ink);line-height:1.2}
select,textarea,input[type=text]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:8px 10px}
textarea{width:100%;min-height:180px;line-height:1.8;resize:vertical}

/* exam list */
.elist{list-style:none;padding:0;margin:0}
.elist li button{display:flex;gap:14px;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 4px;color:var(--text);align-items:baseline}
.elist li button:hover .et{color:var(--ink)}
.elist .en{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;font-weight:800;color:var(--muted);min-width:28px}
.elist .et{font-weight:600}
.elist .es{font-size:13px;color:var(--muted);display:block;font-weight:400}
.elist .st{margin-inline-start:auto;font-size:12.5px;color:var(--dr);white-space:nowrap}

/* AI output */
.ai-out{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 18px;margin:12px 0 18px}
.ai-out .lab{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.ai-out h4{font-size:16px;margin:12px 0 6px}
.thinking{color:var(--muted);font-style:normal}
.thinking::after{content:"…";animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}}

/* tutor panel */
#tutorFab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);border:0;border-radius:28px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#tutor{position:fixed;left:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:min(420px,calc(100vw - 36px));height:min(620px,calc(100vh - 160px));background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
#tutor[hidden]{display:none}
#tutor .th{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
#tutor .th b{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;color:var(--ink)}
#tutor .ctx{font-size:12.5px;color:var(--muted)}
#chat{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 13px;border-radius:12px;font-size:15.5px;line-height:1.75}
.msg.u{align-self:flex-start;background:var(--ink);color:var(--surface);border-end-start-radius:4px}
.msg.a{align-self:flex-end;background:var(--sunk);border-end-end-radius:4px}
.msg p{margin:0 0 6px}.msg ul,.msg ol{margin:0 0 6px;padding-inline-start:20px}
.msg table{font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.chips button{background:var(--sunk);border:0;border-radius:14px;padding:4px 10px;font-size:13px;color:var(--ink)}
#tutor form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--rule)}
#tutor form input{flex:1;min-width:0}


/* bilingual + detailed answers */
.lang{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.lang button{border:0;background:none;padding:5px 10px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.bi{display:block}
.bi > .e{display:block}
.bi > .a{display:block;direction:rtl;text-align:right;color:var(--muted);font-size:.92em;margin-top:2px;padding-top:2px;border-top:1px dashed var(--rule)}
th .bi > .a{color:inherit;opacity:.85;border-top-color:rgba(255,255,255,.3)}
[dir="ltr"]{text-align:left}
[dir="ltr"] th{text-align:left}
[dir="ltr"] .opt{text-align:left}
[dir="ltr"] .ledger td.amt{text-align:right}
.lesson-title .sub{display:block;font-size:.6em;color:var(--muted);font-weight:600;direction:rtl;text-align:right;margin-top:4px}
.toc button .tt{display:flex;flex-direction:column}
.toc button .tt small{color:var(--muted);font-size:12.5px}
.exp{margin-top:12px;display:grid;gap:8px}
.exp .blk{border-radius:9px;padding:10px 14px;font-size:15.5px;line-height:1.8}
.exp .blk .h{font-weight:700;margin-bottom:4px;display:block}
.exp .blk.bad{background:var(--cr-soft);border-inline-start:4px solid var(--cr)} .exp .blk.bad .h{color:var(--cr)}
.exp .blk.good{background:var(--dr-soft);border-inline-start:4px solid var(--dr)} .exp .blk.good .h{color:var(--dr)}
.exp details{background:var(--sunk);border-radius:9px;padding:8px 14px}
.exp summary{cursor:pointer;font-weight:600;color:var(--ink)}
.exp .all{list-style:none;padding:0;margin:8px 0 0}
.exp .all li{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.exp .all .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--surface)}
.exp .all .m.y{background:var(--dr)} .exp .all .m.n{background:var(--cr)}
.exp .row{margin-top:2px}
.verdict{font-weight:700;font-size:16px}
.verdict.ok{color:var(--dr)} .verdict.no{color:var(--cr)}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  #menuBtn{display:inline-block}
  aside.toc{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);height:auto;z-index:40;transform:translateX(105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
  aside.toc.open{transform:none}
  .meter .track{width:50px}
  .timeline{grid-template-columns:1fr;gap:10px}
  .timeline::before{display:none}
  .stop{padding:0}
  .bar{flex-wrap:wrap}
  nav.tabs{order:3;width:100%;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button id="menuBtn" aria-controls="toc">الفهرس</button>
    <button class="brand" data-go="home">مذاكرة IFRS<small>تحديث أكتوبر 2026</small></button>
    <div class="lang" role="group" aria-label="لغة الشرح">
      <button data-lang="en" aria-pressed="false">English</button>
      <button data-lang="both" aria-pressed="true">الاتنين</button>
      <button data-lang="ar" aria-pressed="false">عربي</button>
    </div>
    <nav class="tabs" aria-label="الأقسام">
      <button data-go="home">الرئيسية</button>
      <button data-go="lessons">الدروس</button>
      <button data-go="practice">تدريب سريع</button>
      <button data-go="exams">أسئلة DipIFR</button>
      <button data-go="plan">خطة المذاكرة</button>
    </nav>
    <div class="meter" title="الدروس اللي خلصتها"><span class="track"><span class="fill" id="meterFill"></span></span><span id="meterTxt" class="num"></span></div>
  </div>
</header>
<div class="wrap">
  <aside class="toc" id="toc" aria-label="فهرس الدروس"></aside>
  <main id="main" tabindex="-1"></main>
</div>

<button id="tutorFab" class="ai-only" hidden>اسأل المدرس</button>
<section id="tutor" hidden aria-label="المدرس">
  <div class="th"><div><b>المدرس</b><div class="ctx" id="tutorCtx"></div></div><button class="btn" id="tutorClose" aria-label="قفل">قفل</button></div>
  <div id="chat"></div>
  <div class="chips" id="chips"></div>

</section>

<script id="data" type="application/json">{"sections":[{"title":"الجزء الأول: آخر تحديثات IFRS ومواعيد سريانها","lessons":[],"intro":[["p","قبل الدخول في المعايير، لازم تعرف الصورة الحالية: مجلس معايير المحاسبة الدولية (IASB) أصدر خلال 2024–2025 مجموعة من المعايير والتعديلات، بعضها ساري بالفعل من 1 يناير 2026، وبعضها يسري من 2027 ومن 2029."],["t",["المعيار / التعديل","ملخص التغيير","تاريخ السريان"],[["IFRS 18 عرض البيانات المالية والإفصاح","يحل محل IAS 1. فئات جديدة في قائمة الدخل (تشغيلي/استثماري/تمويلي/ضرائب/عمليات متوقفة)، إجماليات فرعية إلزامية، الإفصاح عن مقاييس الأداء المعرّفة من الإدارة (MPMs)، قواعد التجميع والتفصيل. يُطبّق بأثر رجعي.","1 يناير 2027"],["IFRS 19 الشركات التابعة غير الخاضعة للمساءلة العامة: الإفصاحات","يسمح للشركات التابعة المؤهلة بتطبيق القياس الكامل لـ IFRS مع إفصاحات مخفضة. التطبيق المبكر مسموح.","1 يناير 2027"],["تعديلات IFRS 9 و IFRS 7 – تصنيف وقياس الأدوات المالية (مايو 2024)","تاريخ الاعتراف والاستبعاد، استثناء لسداد الالتزامات عبر أنظمة الدفع الإلكتروني، اختبار SPPI للأصول المرتبطة بمؤشرات ESG، إفصاحات جديدة لأدوات حقوق الملكية بـ FVOCI.","1 يناير 2026"],["تعديلات IFRS 9 و IFRS 7 – عقود الكهرباء المعتمدة على الطبيعة (ديسمبر 2024)","عقود شراء الكهرباء من مصادر متجددة (رياح/شمس): استثناء \"الاستخدام الخاص\" ومحاسبة التحوط.","1 يناير 2026"],["التحسينات السنوية – المجلد 11 (يوليو 2024)","تعديلات محدودة على IFRS 1 و IFRS 7 و IFRS 9 و IFRS 10 و IAS 7.","1 يناير 2026"],["تعديلات IAS 21 – عدم قابلية العملة للتبادل (أغسطس 2023)","كيف تحدد سعر صرف تقديري عندما لا تكون العملة قابلة للتبادل.","1 يناير 2025 (سارٍ)"],["تعديلات IAS 21 – الترجمة إلى عملة عرض ذات تضخم مفرط (نوفمبر 2025)","توحيد طريقة الترجمة من عملة وظيفية غير تضخمية إلى عملة عرض تضخمية.","1 يناير 2027"],["IFRS 20 الأصول والالتزامات التنظيمية (صدر 27 مايو 2026)","نموذج محاسبي للشركات الخاضعة لتنظيم الأسعار (كهرباء، مياه...) يعترف بالأصول والالتزامات التنظيمية.","1 يناير 2029"],["تعديلات IFRS 16 – التزام الإيجار في البيع وإعادة الاستئجار","قياس التزام الإيجار لدى البائع-المستأجر بحيث لا يعترف بأرباح تتعلق بحق الاستخدام المحتفظ به.","1 يناير 2024 (سارٍ)"],["تعديلات IAS 1 – الالتزامات غير المتداولة مع التعهدات (Covenants)","التصنيف يعتمد على الحق القائم في نهاية الفترة لتأجيل السداد 12 شهرًا؛ التعهدات المستقبلية تؤثر على الإفصاح فقط.","1 يناير 2024 (سارٍ)"],["تعديلات IAS 7 و IFRS 7 – ترتيبات تمويل الموردين","إفصاحات عن شروط الترتيب والمبالغ ونطاق تواريخ الاستحقاق ومخاطر السيولة.","1 يناير 2024 (سارٍ)"],["تعديلات IAS 12 – الإصلاح الضريبي الدولي (Pillar Two)","استثناء مؤقت إلزامي من الاعتراف بالضريبة المؤجلة الناتجة عن قواعد الحد الأدنى العالمي للضريبة + إفصاحات.","2023 (سارٍ)"]],[3300,4538,1800]],["new","ماذا يعني هذا لامتحان DipIFR؟",["ACCA تصدر قائمة \"المستندات القابلة للامتحان\" (Examinable documents) كل سنة، والمستندات الصادرة قبل تاريخ القطع (نهاية أغسطس/1 سبتمبر) تُمتحن في السنة التالية حتى لو كان تاريخ سريانها مستقبليًا.","قائمة دورتي ديسمبر 2025 ويونيو 2026 أظهرت IAS 8 باسمه الجديد \"أساس إعداد البيانات المالية\" (Basis of Preparation of Financial Statements) – وده نتيجة إصدار IFRS 18.","مصادر تدريبية تشير إلى أن IFRS 18 أصبح قابلًا للامتحان في DipIFR بدءًا من دورة ديسمبر 2026، وامتحان DipIFR أصبح امتحانًا إلكترونيًا (CBE). راجع دائمًا قائمة المستندات الخاصة بدورتك على موقع ACCA."]]],"en":{"title":"Part 1: Latest IFRS Updates and Effective Dates","intro":[["p","Before studying the standards, you need the current picture: during 2024–2025 the International Accounting Standards Board (IASB) issued a set of standards and amendments. Some are already effective from 1 January 2026, and others take effect from 2027 and 2029."],["t",["Standard / amendment","Summary of the change","Effective date"],[["IFRS 18 Presentation and Disclosure in Financial Statements","Replaces IAS 1. New categories in the statement of profit or loss (operating/investing/financing/income taxes/discontinued operations), mandatory subtotals, disclosure of management-defined performance measures (MPMs), aggregation and disaggregation rules. Applied retrospectively.","1 January 2027"],["IFRS 19 Subsidiaries without Public Accountability: Disclosures","Allows eligible subsidiaries to apply full IFRS measurement with reduced disclosures. Early application permitted.","1 January 2027"],["Amendments to IFRS 9 and IFRS 7: Classification and Measurement of Financial Instruments (May 2024)","Recognition and derecognition dates, an exception for settling liabilities through electronic payment systems, the SPPI test for assets linked to ESG targets, new disclosures for equity instruments at FVOCI.","1 January 2026"],["Amendments to IFRS 9 and IFRS 7: Contracts Referencing Nature-dependent Electricity (December 2024)","Power purchase contracts from renewable sources (wind/solar): the \"own-use\" exception and hedge accounting.","1 January 2026"],["Annual Improvements, Volume 11 (July 2024)","Narrow amendments to IFRS 1, IFRS 7, IFRS 9, IFRS 10 and IAS 7.","1 January 2026"],["Amendments to IAS 21: Lack of Exchangeability (August 2023)","How to estimate a spot rate when a currency is not exchangeable.","1 January 2025 (effective)"],["Amendments to IAS 21: Translation to a Hyperinflationary Presentation Currency (November 2025)","A uniform method for translating from a non-hyperinflationary functional currency into a hyperinflationary presentation currency.","1 January 2027"],["IFRS 20 Regulatory Assets and Regulatory Liabilities (issued 27 May 2026)","An accounting model for rate-regulated entities (electricity, water...) that recognizes regulatory assets and liabilities.","1 January 2029"],["Amendments to IFRS 16: Lease Liability in a Sale and Leaseback","The seller-lessee measures the lease liability so that it recognizes no gain relating to the right of use it retains.","1 January 2024 (effective)"],["Amendments to IAS 1: Non-current Liabilities with Covenants","Classification depends on the right existing at the end of the period to defer settlement for 12 months; future covenants affect disclosure only.","1 January 2024 (effective)"],["Amendments to IAS 7 and IFRS 7: Supplier Finance Arrangements","Disclosures of the arrangement terms, amounts, ranges of payment due dates and liquidity risk.","1 January 2024 (effective)"],["Amendments to IAS 12: International Tax Reform (Pillar Two)","A mandatory temporary exception from recognizing deferred tax arising from global minimum tax rules, plus disclosures.","2023 (effective)"]],[3300,4538,1800]],["new","What does this mean for the DipIFR exam?",["ACCA publishes a list of \"Examinable documents\" every year. Documents issued before the cut-off date (end of August/1 September) are examinable the following year, even if their effective date is in the future.","The list for the December 2025 and June 2026 sittings showed IAS 8 under its new name \"Basis of Preparation of Financial Statements\", as a result of IFRS 18.","Tuition providers indicate that IFRS 18 is examinable in DipIFR from the December 2026 sitting, and DipIFR is now a computer-based exam (CBE). Always check the examinable documents list for your sitting on the ACCA website."]]]}},{"title":"الجزء الثاني: الإطار المفاهيمي ومعايير العرض","lessons":[{"title":"1) الإطار المفاهيمي للتقرير المالي (Conceptual Framework 2018)","blocks":[["p","الإطار المفاهيمي ليس معيارًا ولا يتجاوز أي معيار، لكنه الأساس الذي يبني عليه المجلس المعايير، ويستخدمه المُعِد عندما لا يوجد معيار يغطي معاملة معينة (عبر IAS 8)."],["h3","الخصائص النوعية للمعلومات المالية"],["t",["النوع","الخاصية","المعنى المختصر"],[["أساسية","الملاءمة (Relevance)","قيمة تنبؤية أو تأكيدية + الأهمية النسبية (Materiality)."],["أساسية","التمثيل الصادق (Faithful representation)","كاملة، محايدة، خالية من الأخطاء. الحيطة (Prudence) تدعم الحياد."],["معززة","القابلية للمقارنة، القابلية للتحقق، التوقيت المناسب، القابلية للفهم","تُحسّن فائدة المعلومة لكنها لا تجعل المعلومة غير الملائمة مفيدة."]],[1600,3600,4438]],["h3","تعريفات العناصر (مهمة جدًا في الأسئلة المقالية)"],["b","**الأصل:** مورد اقتصادي حالي تسيطر عليه المنشأة نتيجة أحداث سابقة. والمورد الاقتصادي هو حق لديه القدرة على إنتاج منافع اقتصادية."],["b","**الالتزام:** التزام حالي على المنشأة بتحويل مورد اقتصادي نتيجة أحداث سابقة."],["b","**حقوق الملكية:** الحصة المتبقية في الأصول بعد طرح كل الالتزامات."],["b","**الدخل والمصروفات:** زيادات/نقص في الأصول أو الالتزامات تؤدي لزيادة/نقص في حقوق الملكية، بخلاف المعاملات مع الملاك."],["p","**معايير الاعتراف:** يُعترف بالعنصر إذا كان الاعتراف يوفر معلومات ملائمة وتمثيلًا صادقًا. **أسس القياس:** التكلفة التاريخية، والقيمة الحالية (القيمة العادلة، القيمة الاستخدامية/قيمة الوفاء، التكلفة الجارية)."],["exam","نقطة امتحان",["في أسئلة DipIFR المقالية، أقوى طريقة للإجابة هي: (1) اذكر التعريف من الإطار أو المعيار، (2) طبّقه على وقائع السؤال، (3) اذكر المعالجة والأثر على القوائم بالأرقام. المصحح يعطي درجات على \"التطبيق\" أكثر من \"الحفظ\"."]]],"en":{"title":"1) Conceptual Framework for Financial Reporting (2018)","blocks":[["p","The Conceptual Framework is not a standard and does not override any standard. It is the foundation the Board uses to develop standards, and preparers use it when no standard covers a particular transaction (via IAS 8)."],["h3","Qualitative characteristics of financial information"],["t",["Type","Characteristic","Short meaning"],[["Fundamental","Relevance","Predictive or confirmatory value, plus materiality."],["Fundamental","Faithful representation","Complete, neutral, free from error. Prudence supports neutrality."],["Enhancing","Comparability, verifiability, timeliness, understandability","They improve the usefulness of information but cannot make irrelevant information useful."]],[1600,3600,4438]],["h3","Definitions of the elements (very important in written questions)"],["b","**Asset:** a present economic resource controlled by the entity as a result of past events. An economic resource is a right that has the potential to produce economic benefits."],["b","**Liability:** a present obligation of the entity to transfer an economic resource as a result of past events."],["b","**Equity:** the residual interest in the assets after deducting all liabilities."],["b","**Income and expenses:** increases/decreases in assets or liabilities that result in increases/decreases in equity, other than transactions with owners."],["p","**Recognition criteria:** an element is recognized if recognition provides relevant information and a faithful representation. **Measurement bases:** historical cost and current value (fair value, value in use/fulfilment value, current cost)."],["exam","Exam point",["In DipIFR written questions, the strongest way to answer is: (1) state the definition from the Framework or the standard, (2) apply it to the facts in the question, (3) state the treatment and the effect on the financial statements with numbers. The examiner awards more marks for \"application\" than for \"memorization\"."]]]}},{"title":"2) IFRS 18 عرض البيانات المالية والإفصاح (يحل محل IAS 1)","blocks":[["p","**الهدف:** تحسين قابلية مقارنة قائمة الأرباح والخسائر بين الشركات، وزيادة الشفافية حول مقاييس الأداء التي تعلنها الإدارة، وتحسين تجميع المعلومات وتفصيلها. ما زالت القوائم الأساسية كما هي (المركز المالي، الأرباح والخسائر والدخل الشامل، التغيرات في حقوق الملكية، التدفقات النقدية، الإيضاحات)، والمتطلبات الخاصة بالمركز المالي وحقوق الملكية نُقلت من IAS 1 بدون تغيير جوهري."],["h3","أولًا: الفئات الخمس في قائمة الأرباح والخسائر"],["t",["الفئة","ماذا تتضمن (للمنشأة العامة غير المالية)"],[["التشغيلية (Operating)","الفئة \"الافتراضية\": كل الدخل والمصروفات التي لا تُصنّف في فئة أخرى، بما فيها المصروفات غير المتكررة وغير العادية والانخفاض في القيمة وفروق العملة على الذمم التجارية."],["الاستثمارية (Investing)","عوائد ومصروفات الاستثمارات في الشركات الشقيقة والمشروعات المشتركة (حقوق الملكية)، والنقدية وما في حكمها، والأصول التي تُولد عائدًا مستقلًا عن باقي موارد المنشأة (مثل توزيعات أرباح الاستثمارات، فوائد الودائع، إيرادات العقار الاستثماري)."],["التمويلية (Financing)","دخل ومصروفات الالتزامات الناتجة عن الحصول على تمويل فقط (فوائد القروض والسندات)، وكذلك مصروف الفائدة وأثر تغير سعر الخصم على التزامات أخرى (مثل فك خصم المخصصات، فائدة التزام الإيجار، صافي فائدة التزام المعاشات)."],["ضرائب الدخل","مصروف ضريبة الدخل وفق IAS 12."],["العمليات المتوقفة","كما في IFRS 5."]],[2400,7238]],["p","**ملاحظة جوهرية:** المنشآت التي نشاطها الرئيسي الاستثمار في أصول أو تقديم تمويل للعملاء (البنوك وشركات التأمين وشركات الاستثمار) تصنف بعض البنود التي تكون \"استثمارية\" أو \"تمويلية\" لغيرها ضمن الفئة التشغيلية، لأنها هي نشاطها الرئيسي."],["h3","ثانيًا: الإجماليات الفرعية الإلزامية"],["n","الربح أو الخسارة التشغيلية (Operating profit or loss).","num1"],["n","الربح أو الخسارة قبل التمويل وضرائب الدخل.","num1"],["n","الربح أو الخسارة (صافي الربح).","num1"],["h3","ثالثًا: مقاييس الأداء المعرّفة من الإدارة (MPMs)"],["p","هي إجماليات فرعية للدخل والمصروفات تستخدمها الإدارة في الاتصالات العامة خارج القوائم المالية (مثل \"EBITDA المعدّل\" أو \"الربح التشغيلي الأساسي\") ولا يحددها المعيار. يجب الإفصاح عنها في إيضاح واحد يتضمن: وصف المقياس ولماذا هو مفيد، وتسوية بينه وبين أقرب إجمالي فرعي يحدده IFRS، والأثر الضريبي وأثر الحصص غير المسيطرة لكل بند تسوية."],["h3","رابعًا: التجميع والتفصيل وتحليل المصروفات"],["b","يُجمَّع البند بناءً على الخصائص المشتركة ويُفصَّل عند اختلاف الخصائص، ويُمنع استخدام عناوين مثل \"أخرى\" إلا إذا لم يتوفر وصف أدق."],["b","المصروفات التشغيلية تُعرض حسب الطبيعة أو الوظيفة أو مزيج منهما (حسب ما يوفر أفضل معلومة). لو عُرضت حسب الوظيفة، يجب الإفصاح في الإيضاحات عن مبالغ: الاستهلاك، الإطفاء، مزايا العاملين، انخفاض القيمة، وتخفيض المخزون."],["h3","خامسًا: تأثير IFRS 18 على قائمة التدفقات النقدية (تعديلات IAS 7)"],["b","الطريقة غير المباشرة تبدأ من **الربح التشغيلي** بدلًا من صافي الربح."],["b","للمنشآت العامة: الفوائد وتوزيعات الأرباح **المدفوعة** ← تمويلية، والفوائد وتوزيعات الأرباح **المحصلة** ← استثمارية (تم إلغاء الاختيار الذي كان موجودًا)."],["ex","مثال 1 – إعادة عرض قائمة الدخل وفق IFRS 18",["شركة \"النيل\" (صناعية) لديها البيانات التالية لسنة 2027: الإيرادات 5,000، تكلفة المبيعات 3,000، مصروفات بيع 400، مصروفات إدارية 500، خسائر ائتمان متوقعة على العملاء 50، حصة في أرباح شركة شقيقة 120، توزيعات أرباح من استثمارات في أسهم 30، فوائد ودائع بنكية 20، فوائد قرض بنكي 150، فك خصم مخصص إزالة أصول 20، ضريبة الدخل 260."]],["t",["البند","المبلغ"],[["الإيرادات","5,000"],["تكلفة المبيعات","(3,000)"],["مصروفات البيع","(400)"],["مصروفات إدارية","(500)"],["خسائر الائتمان المتوقعة","(50)"],["!الربح التشغيلي","1,050"],["حصة في أرباح شركة شقيقة","120"],["توزيعات أرباح استثمارات","30"],["فوائد ودائع بنكية","20"],["!الربح قبل التمويل وضرائب الدخل","1,220"],["فوائد القرض البنكي","(150)"],["فك خصم المخصص","(20)"],["!الربح قبل الضريبة","1,050"],["ضريبة الدخل","(260)"],["!صافي ربح السنة","790"]],[6638,3000]],["p","**الشرح:** لاحظ أن حصة الشركة الشقيقة كانت في الممارسة القديمة تُعرض أحيانًا داخل الربح التشغيلي، أما الآن فهي إلزاميًا في الفئة الاستثمارية. وفك خصم المخصص ليس قرضًا، لكنه \"مصروف فائدة على التزام غير تمويلي\" فيذهب للفئة التمويلية."],["exam","نقطة امتحان",["الأسئلة المتوقعة على IFRS 18: تصنيف بنود في الفئات الصحيحة، حساب الإجماليات الفرعية، وتحديد هل مقياس معين يعتبر MPM (هل هو إجمالي فرعي للدخل والمصروفات؟ هل يُستخدم في الاتصالات العامة؟ هل يعبر عن وجهة نظر الإدارة؟). الموضوع \"جديد ومتوقع بقوة\"."]]],"en":{"title":"2) IFRS 18 Presentation and Disclosure in Financial Statements (replaces IAS 1)","blocks":[["p","**Objective:** improve comparability of the statement of profit or loss across entities, increase transparency about performance measures announced by management, and improve aggregation and disaggregation of information. The primary statements remain the same (financial position, profit or loss and OCI, changes in equity, cash flows, notes), and the requirements for financial position and equity were carried over from IAS 1 without significant change."],["h3","First: the five categories in the statement of profit or loss"],["t",["Category","What it includes (for a general, non-financial entity)"],[["Operating","The \"default\" category: all income and expenses not classified in another category, including unusual and non-recurring expenses, impairment, and foreign exchange differences on trade balances."],["Investing","Income and expenses from investments in associates and joint ventures (equity-accounted), cash and cash equivalents, and assets that generate a return individually and largely independently of other resources (e.g., dividends from investments, interest on deposits, rental income from investment property)."],["Financing","Income and expenses on liabilities arising from transactions that involve only the raising of finance (interest on loans and bonds), plus interest expense and the effect of changes in discount rates on other liabilities (e.g., unwinding of discount on provisions, interest on lease liabilities, net interest on a pension liability)."],["Income taxes","Income tax expense under IAS 12."],["Discontinued operations","As under IFRS 5."]],[2400,7238]],["p","**Key note:** entities whose main business activity is investing in assets or providing financing to customers (banks, insurers, investment entities) classify some items that would be \"investing\" or \"financing\" for others in the operating category, because that is their main business."],["h3","Second: mandatory subtotals"],["n","Operating profit or loss.","num1"],["n","Profit or loss before financing and income taxes.","num1"],["n","Profit or loss (net profit).","num1"],["h3","Third: management-defined performance measures (MPMs)"],["p","These are subtotals of income and expenses used by management in public communications outside the financial statements (e.g., \"adjusted EBITDA\" or \"underlying operating profit\") that are not specified by IFRS. They must be disclosed in a single note including: a description of the measure and why it is useful, a reconciliation to the most directly comparable IFRS subtotal, and the tax effect and non-controlling interest effect for each reconciling item."],["h3","Fourth: aggregation, disaggregation and analysis of expenses"],["b","Items are aggregated based on shared characteristics and disaggregated when characteristics differ. Labels such as \"other\" are prohibited unless no more informative description is available."],["b","Operating expenses are presented by nature, by function, or a mix (whichever provides the most useful information). If presented by function, the notes must disclose the amounts of: depreciation, amortization, employee benefits, impairment, and inventory write-downs."],["h3","Fifth: effect of IFRS 18 on the statement of cash flows (amendments to IAS 7)"],["b","The indirect method starts from **operating profit** instead of net profit."],["b","For general entities: interest and dividends **paid** → financing, and interest and dividends **received** → investing (the previous choice has been removed)."],["ex","Example 1 – Re-presenting the income statement under IFRS 18",["Nile Co (a manufacturer) has the following data for 2027: revenue 5,000, cost of sales 3,000, selling expenses 400, administrative expenses 500, expected credit losses on customers 50, share of profit of an associate 120, dividends from equity investments 30, interest on bank deposits 20, interest on a bank loan 150, unwinding of discount on a decommissioning provision 20, income tax 260."]],["t",["Item","Amount"],[["Revenue","5,000"],["Cost of sales","(3,000)"],["Selling expenses","(400)"],["Administrative expenses","(500)"],["Expected credit losses","(50)"],["!Operating profit","1,050"],["Share of profit of associate","120"],["Dividends from investments","30"],["Interest on bank deposits","20"],["!Profit before financing and income taxes","1,220"],["Interest on bank loan","(150)"],["Unwinding of discount on provision","(20)"],["!Profit before tax","1,050"],["Income tax","(260)"],["!Profit for the year","790"]],[6638,3000]],["p","**Explanation:** under old practice the share of an associate was sometimes shown inside operating profit; now it must be in the investing category. Unwinding the discount on a provision is not a loan, but it is \"interest expense on a non-financing liability\", so it goes to the financing category."],["exam","Exam point",["Expected IFRS 18 questions: classifying items into the correct categories, calculating the subtotals, and deciding whether a measure is an MPM (Is it a subtotal of income and expenses? Is it used in public communications? Does it reflect management’s view?). This topic is \"new and highly expected\"."]]]}},{"title":"3) IAS 8 أساس إعداد البيانات المالية (السياسات والتقديرات والأخطاء)","blocks":[["p","بعد IFRS 18 تغير اسم المعيار ليصبح \"أساس إعداد البيانات المالية\"، وانتقلت إليه بعض فقرات IAS 1 (مثل الاستمرارية وأساس الاستحقاق والإفصاح عن السياسات المحاسبية الجوهرية)، لكن جوهر المعالجة كما هو:"],["t",["الحالة","المعالجة","مثال"],[["تغيير في السياسة المحاسبية","بأثر رجعي: تعديل الرصيد الافتتاحي للأرباح المحتجزة وإعادة عرض المقارنة (إلا إذا نص المعيار الجديد على غير ذلك أو كان التطبيق غير عملي).","التحول من نموذج التكلفة إلى القيمة العادلة في IAS 40."],["تغيير في التقدير المحاسبي","بأثر مستقبلي في الفترة الحالية والفترات القادمة.","تغيير العمر الإنتاجي، القيمة المتبقية، مخصص الخسائر الائتمانية."],["تصحيح خطأ جوهري لفترة سابقة","بأثر رجعي: إعادة عرض المقارنة وتعديل الرصيد الافتتاحي.","إغفال استهلاك أصل في السنة الماضية."]],[2600,4238,2800]],["p","**تنبيه:** التحول من التكلفة إلى نموذج إعادة التقييم في IAS 16 و IAS 38 تغيير في السياسة لكنه يعالج كإعادة تقييم وفق المعيار (بأثر مستقبلي) – استثناء شهير في الامتحان."],["ex","مثال 2 – تغيير في تقدير العمر الإنتاجي",["آلة تكلفتها 1,000,000 في 1/1/2023، عمرها 10 سنوات، قسط ثابت. في 1/1/2027 قررت الإدارة أن العمر الإنتاجي الكلي 8 سنوات فقط.","القيمة الدفترية في 1/1/2027 = 1,000,000 – (100,000 × 4) = 600,000.","العمر المتبقي = 8 – 4 = 4 سنوات ← الاستهلاك الجديد = 600,000 ÷ 4 = **150,000** سنويًا من 2027. لا يُعدل أي رقم في السنوات السابقة."]],["ex","مثال 3 – تصحيح خطأ",["اكتشفت الشركة في 2027 أن مخزون نهاية 2026 كان مضخمًا بمبلغ 80,000 (معدل الضريبة 25% مع افتراض تعديل الضريبة). الأثر: أرباح 2026 كانت مضخمة بـ 60,000 بعد الضريبة.","المعالجة: إعادة عرض أرقام 2026 المقارنة (زيادة تكلفة المبيعات 80,000، تخفيض الضريبة 20,000)، وتخفيض الرصيد الافتتاحي للأرباح المحتجزة لسنة 2027 بمبلغ 60,000 في قائمة التغير في حقوق الملكية، مع الإفصاح عن طبيعة الخطأ."]],["je",[["الأرباح المحتجزة (الرصيد الافتتاحي)","60,000",""],["التزام ضريبي / ضريبة مستحقة","20,000",""],["المخزون (أثر على رصيد المقارنة)","","80,000"]]]],"en":{"title":"3) IAS 8 Basis of Preparation of Financial Statements (policies, estimates and errors)","blocks":[["p","After IFRS 18 the standard was renamed \"Basis of Preparation of Financial Statements\", and some IAS 1 paragraphs moved into it (such as going concern, accrual basis and disclosure of material accounting policies), but the core treatment is unchanged:"],["t",["Situation","Treatment","Example"],[["Change in accounting policy","Retrospective: adjust opening retained earnings and restate comparatives (unless the new standard says otherwise or it is impracticable).","Changing from the cost model to the fair value model under IAS 40."],["Change in accounting estimate","Prospective, in the current and future periods.","Changing useful life, residual value, or the credit loss allowance."],["Correction of a material prior-period error","Retrospective: restate comparatives and adjust the opening balance.","Omitting depreciation on an asset last year."]],[2600,4238,2800]],["p","**Watch out:** changing from cost to the revaluation model under IAS 16 and IAS 38 is a change in policy, but it is treated as a revaluation under the standard (prospectively), a well-known exam exception."],["ex","Example 2 – Change in the estimate of useful life",["A machine cost 1,000,000 on 1/1/2023, useful life 10 years, straight-line. On 1/1/2027 management decided the total useful life is only 8 years.","Carrying amount on 1/1/2027 = 1,000,000 – (100,000 × 4) = 600,000.","Remaining life = 8 – 4 = 4 years → new depreciation = 600,000 ÷ 4 = **150,000** per year from 2027. No prior-year figures are adjusted."]],["ex","Example 3 – Correction of an error",["In 2027 the company discovered that inventory at the end of 2026 was overstated by 80,000 (tax rate 25%, assuming tax is adjusted). Effect: 2026 profit was overstated by 60,000 after tax.","Treatment: restate the 2026 comparatives (increase cost of sales by 80,000, reduce tax by 20,000), and reduce 2027 opening retained earnings by 60,000 in the statement of changes in equity, with disclosure of the nature of the error."]],["je",[["Retained earnings (opening balance)","60,000",""],["Tax liability / tax payable","20,000",""],["Inventory (effect on comparative balance)","","80,000"]]]]}},{"title":"4) IAS 10 الأحداث بعد فترة التقرير","blocks":[["p","الأحداث التي تقع بين نهاية الفترة وتاريخ اعتماد القوائم للإصدار."],["t",["النوع","التعريف","المعالجة","أمثلة"],[["أحداث معدِّلة (Adjusting)","توفر دليلًا على ظروف كانت قائمة في نهاية الفترة","تُعدّل الأرقام","إفلاس عميل كان متعثرًا في نهاية السنة، بيع مخزون بأقل من التكلفة بعد السنة، حكم قضائي في قضية قائمة، اكتشاف غش أو خطأ."],["أحداث غير معدِّلة (Non-adjusting)","تدل على ظروف نشأت بعد نهاية الفترة","إفصاح فقط إذا كانت جوهرية","حريق بعد نهاية السنة، استحواذ كبير، انخفاض القيمة السوقية للاستثمارات، إصدار أسهم."]],[2000,2700,1600,3338]],["b","توزيعات الأرباح المعلنة بعد نهاية الفترة **لا** يُعترف بها كالتزام، بل يُفصح عنها."],["b","إذا تبين بعد نهاية الفترة أن فرض الاستمرارية غير ملائم، لا تُعد القوائم على أساس الاستمرارية (حتى لو كان الحدث نفسه غير معدِّل)."],["exam","نقطة امتحان",["IAS 10 يأتي غالبًا كجزء من سؤال \"الحالات المتنوعة\" (Mixed topics) في DipIFR بحوالي 4–6 درجات: المطلوب تحديد نوع الحدث وشرح السبب والمعالجة. موضوع \"متكرر\"."]]],"en":{"title":"4) IAS 10 Events after the Reporting Period","blocks":[["p","Events occurring between the end of the period and the date the financial statements are authorized for issue."],["t",["Type","Definition","Treatment","Examples"],[["Adjusting events","Provide evidence of conditions that existed at the end of the period","Adjust the figures","Bankruptcy of a customer who was in difficulty at year end, sale of inventory below cost after year end, a court ruling on an existing case, discovery of fraud or error."],["Non-adjusting events","Indicate conditions that arose after the end of the period","Disclose only if material","A fire after year end, a major acquisition, a fall in market value of investments, a share issue."]],[2000,2700,1600,3338]],["b","Dividends declared after the end of the period are **not** recognized as a liability; they are disclosed."],["b","If after the end of the period the going concern assumption becomes inappropriate, the statements are not prepared on a going concern basis (even if the event itself is non-adjusting)."],["exam","Exam point",["IAS 10 usually appears as part of a \"mixed topics\" question in DipIFR for about 4–6 marks: you must identify the type of event, explain why, and state the treatment. A \"frequently tested\" topic."]]]}},{"title":"5) IAS 7 قائمة التدفقات النقدية","blocks":[["p","تصنف التدفقات إلى تشغيلية واستثمارية وتمويلية. التشغيلية بالطريقة المباشرة أو غير المباشرة (المجلس يشجع المباشرة). النقدية وما في حكمها: استثمارات قصيرة الأجل عالية السيولة قابلة للتحويل لمبلغ معلوم وبمخاطر تغير قيمة ضئيلة (عادة استحقاق 3 شهور أو أقل من تاريخ الاقتناء)، والسحب على المكشوف الذي يسدد عند الطلب ويمثل جزءًا من إدارة النقد يُخصم منها."],["ex","مثال 4 – التدفق النقدي من التشغيل (الطريقة غير المباشرة بعد IFRS 18)",["الربح التشغيلي 1,050؛ الاستهلاك 200؛ خسارة بيع أصل 15؛ زيادة المخزون 60؛ نقص المدينين 40؛ زيادة الدائنين 30؛ ضريبة مدفوعة 240؛ فوائد مدفوعة 150.","النقدية من العمليات = 1,050 + 200 + 15 – 60 + 40 + 30 = **1,275**.","صافي التدفق التشغيلي = 1,275 – 240 ضريبة = **1,035** (الضريبة تبقى تشغيلية ما لم ترتبط بنشاط استثماري/تمويلي محدد).","الفوائد المدفوعة 150 ← تظهر في **الأنشطة التمويلية** وفق التعديلات المصاحبة لـ IFRS 18."]],["b","**ترتيبات تمويل الموردين (Supplier finance):** يجب الإفصاح عن شروطها، القيمة الدفترية للالتزامات الخاضعة لها وما حصله الموردون منها، ونطاق تواريخ الاستحقاق، والتغيرات غير النقدية."]],"en":{"title":"5) IAS 7 Statement of Cash Flows","blocks":[["p","Cash flows are classified as operating, investing and financing. Operating cash flows use the direct or indirect method (the Board encourages the direct method). Cash equivalents: short-term, highly liquid investments readily convertible to a known amount with insignificant risk of changes in value (usually maturity of 3 months or less from acquisition); bank overdrafts repayable on demand that form part of cash management are deducted."],["ex","Example 4 – Cash from operations (indirect method after IFRS 18)",["Operating profit 1,050; depreciation 200; loss on sale of an asset 15; increase in inventory 60; decrease in receivables 40; increase in payables 30; tax paid 240; interest paid 150.","Cash generated from operations = 1,050 + 200 + 15 – 60 + 40 + 30 = **1,275**.","Net operating cash flow = 1,275 – 240 tax = **1,035** (tax remains operating unless it relates to specific investing/financing activities).","Interest paid 150 → shown in **financing activities** under the amendments accompanying IFRS 18."]],["b","**Supplier finance arrangements:** disclose their terms, the carrying amount of liabilities subject to them and the amounts already paid to suppliers, the range of payment due dates, and non-cash changes."]]}}],"intro":[],"en":{"title":"Part 2: The Conceptual Framework and Presentation Standards","intro":[]}},{"title":"الجزء الثالث: معايير الأصول","lessons":[{"title":"6) IAS 2 المخزون","blocks":[["p","**القاعدة الذهبية:** يقاس المخزون بالتكلفة أو صافي القيمة القابلة للتحقق (NRV) أيهما أقل، **صنفًا بصنف** (وليس للمخزون ككل)."],["b","**التكلفة تشمل:** تكلفة الشراء (بعد الخصومات التجارية، بما فيها الرسوم الجمركية غير المستردة والنقل)، تكاليف التحويل (عمالة مباشرة + تحميل منتظم للتكاليف الصناعية الثابتة والمتغيرة)، وأي تكاليف أخرى لجعل المخزون في موقعه وحالته الحالية."],["b","**تُستبعد من التكلفة:** الهالك غير الطبيعي، تكاليف التخزين (إلا إذا كانت ضرورية لمرحلة إنتاج تالية)، المصروفات الإدارية غير المرتبطة بالإنتاج، مصروفات البيع."],["b","**التكاليف الثابتة** تُحمل على أساس **الطاقة العادية**؛ الجزء غير المحمل بسبب انخفاض الإنتاج يُحمل مصروفًا."],["b","**طرق التكلفة المسموحة:** التمييز المحدد، الوارد أولًا صادر أولًا (FIFO)، المتوسط المرجح. **LIFO ممنوعة.**"],["ex","مثال 5 – تحميل التكاليف الثابتة وصافي القيمة القابلة للتحقق",["تكاليف صناعية ثابتة 200,000، الطاقة العادية 10,000 وحدة، الإنتاج الفعلي 8,000 وحدة. ← معدل التحميل = 200,000 ÷ 10,000 = 20 لكل وحدة. المحمّل على المخزون 8,000 × 20 = 160,000، والباقي **40,000 مصروف** في قائمة الدخل.","صنف تكلفته 100، سعر بيعه المتوقع 120، تكلفة إكمال 15، مصروفات بيع 10 ← NRV = 120 – 15 – 10 = 95 ← يخفض المخزون بـ **5** للوحدة ويحمل على تكلفة المبيعات."]],["exam","نقطة امتحان",["IAS 2 يأتي غالبًا داخل سؤال التجميع (مخزون متبادل بين شركات المجموعة) أو كبند في الحالات المتنوعة. فخ شهير: الطاقة العادية مقابل الفعلية، ومقارنة التكلفة بـ NRV على أساس كل صنف."]]],"en":{"title":"6) IAS 2 Inventories","blocks":[["p","**The golden rule:** inventory is measured at the lower of cost and net realizable value (NRV), **item by item** (not for inventory as a whole)."],["b","**Cost includes:** purchase cost (after trade discounts, including non-recoverable import duties and transport), conversion costs (direct labor + systematic allocation of fixed and variable production overheads), and other costs incurred to bring inventory to its present location and condition."],["b","**Excluded from cost:** abnormal waste, storage costs (unless necessary for a further production stage), administrative overheads not related to production, selling costs."],["b","**Fixed overheads** are allocated based on **normal capacity**; the unallocated portion due to low production is expensed."],["b","**Permitted cost formulas:** specific identification, first-in first-out (FIFO), weighted average. **LIFO is prohibited.**"],["ex","Example 5 – Allocating fixed overheads and net realizable value",["Fixed production overheads 200,000, normal capacity 10,000 units, actual production 8,000 units. → Absorption rate = 200,000 ÷ 10,000 = 20 per unit. Charged to inventory 8,000 × 20 = 160,000, and the remaining **40,000 is expensed** in profit or loss.","An item costing 100, expected selling price 120, cost to complete 15, selling costs 10 → NRV = 120 – 15 – 10 = 95 → inventory is written down by **5** per unit and charged to cost of sales."]],["exam","Exam point",["IAS 2 usually appears in the consolidation question (intra-group inventory) or as an item in mixed topics. A classic trap: normal vs actual capacity, and comparing cost with NRV item by item."]]]}},{"title":"7) IAS 16 الممتلكات والآلات والمعدات","blocks":[["h3","الاعتراف والقياس الأولي"],["p","يُعترف بالبند كأصل إذا كان من المحتمل تدفق منافع اقتصادية مستقبلية ويمكن قياس التكلفة بموثوقية. التكلفة = سعر الشراء + رسوم الاستيراد والضرائب غير المستردة – الخصومات + التكاليف المباشرة لجعل الأصل جاهزًا للاستخدام + القيمة الحالية لتكاليف الإزالة وإعادة الموقع (الالتزام وفق IAS 37) + تكاليف الاقتراض المؤهلة (IAS 23)."],["p","**لا تُرسمل:** تكاليف افتتاح منشأة جديدة، الإعلان، التدريب، المصروفات الإدارية العامة، خسائر التشغيل الأولية. **ملاحظة تعديل 2022:** متحصلات بيع عينات منتجة أثناء الاختبار تُعترف كإيراد في الأرباح والخسائر ولا تُخصم من تكلفة الأصل."],["ex","مثال 6 – تحديد تكلفة آلة",["سعر الشراء 500,000، رسوم جمركية 20,000، نقل 10,000، تركيب 15,000، تدريب العاملين 8,000، القيمة الحالية لتكاليف الإزالة المتوقعة بعد 10 سنوات 30,000.","التكلفة = 500,000 + 20,000 + 10,000 + 15,000 + 30,000 = **575,000**. التدريب 8,000 مصروف."]],["je",[["آلات ومعدات","575,000",""],["مصروف تدريب","8,000",""],["النقدية / الدائنون","","553,000"],["مخصص تكاليف الإزالة","","30,000"]]],["h3","القياس اللاحق: نموذج التكلفة أو نموذج إعادة التقييم"],["b","نموذج إعادة التقييم يُطبق على **الفئة بالكامل** وبانتظام كافٍ."],["b","الزيادة ← الدخل الشامل الآخر (OCI) وفائض إعادة التقييم، إلا إذا كانت تعكس انخفاضًا سابقًا في الأرباح والخسائر لنفس الأصل."],["b","الانخفاض ← يُخصم من فائض إعادة التقييم لنفس الأصل أولًا، والباقي في الأرباح والخسائر."],["b","يمكن تحويل \"الاستهلاك الإضافي\" (الفرق بين الاستهلاك على القيمة المعاد تقييمها والاستهلاك على التكلفة) من الفائض إلى الأرباح المحتجزة سنويًا (تحويل داخل حقوق الملكية)."],["ex","مثال 7 – إعادة التقييم",["مبنى تكلفته 1,000,000 في 1/1/2017، عمره 50 سنة. في 1/1/2027 (بعد 10 سنوات) القيمة الدفترية 800,000، وأُعيد تقييمه إلى 1,200,000.","فائض إعادة التقييم = 1,200,000 – 800,000 = **400,000** في OCI.","الاستهلاك الجديد = 1,200,000 ÷ 40 سنة متبقية = **30,000**. الاستهلاك القديم كان 20,000، فالاستهلاك الإضافي 10,000 يمكن تحويله سنويًا من الفائض إلى الأرباح المحتجزة."]],["je",[["مجمع الإهلاك","200,000",""],["المبنى (1,200,000 – 1,000,000)","200,000",""],["فائض إعادة التقييم (OCI)","","400,000"]]],["h3","المكونات والاستبعاد"],["p","كل جزء له تكلفة جوهرية بالنسبة للأصل يُهلك منفصلًا (مثل محرك الطائرة وهيكلها). تكلفة الفحص الدوري الكبير تُرسمل كمكون. عند الاستبعاد: الربح أو الخسارة = المتحصلات – القيمة الدفترية، ويُعترف به في الأرباح والخسائر (وليس كإيراد)، ويحوّل أي فائض إعادة تقييم متبقٍ مباشرة إلى الأرباح المحتجزة."],["exam","نقطة امتحان",["IAS 16 من أكثر المعايير تكرارًا في DipIFR: حساب تكلفة أصل مع مخصص إزالة وفك الخصم، وإعادة التقييم مع ضريبة مؤجلة (IAS 12)، والمكونات. موضوع \"متكرر جدًا\"."]]],"en":{"title":"7) IAS 16 Property, Plant and Equipment","blocks":[["h3","Recognition and initial measurement"],["p","An item is recognized as an asset if future economic benefits are probable and cost can be measured reliably. Cost = purchase price + import duties and non-refundable taxes – discounts + directly attributable costs of bringing the asset to working condition + present value of dismantling and site restoration costs (the obligation under IAS 37) + qualifying borrowing costs (IAS 23)."],["p","**Not capitalized:** costs of opening a new facility, advertising, training, general administrative overheads, initial operating losses. **2022 amendment note:** proceeds from selling samples produced during testing are recognized in profit or loss and are not deducted from the asset’s cost."],["ex","Example 6 – Determining the cost of a machine",["Purchase price 500,000, customs duties 20,000, transport 10,000, installation 15,000, staff training 8,000, present value of expected dismantling costs in 10 years 30,000.","Cost = 500,000 + 20,000 + 10,000 + 15,000 + 30,000 = **575,000**. Training of 8,000 is an expense."]],["je",[["Plant and equipment","575,000",""],["Training expense","8,000",""],["Cash / payables","","553,000"],["Provision for dismantling costs","","30,000"]]],["h3","Subsequent measurement: cost model or revaluation model"],["b","The revaluation model is applied to the **entire class** with sufficient regularity."],["b","An increase → other comprehensive income (OCI) and revaluation surplus, unless it reverses a previous decrease of the same asset recognized in profit or loss."],["b","A decrease → first deducted from the revaluation surplus of the same asset, with the remainder in profit or loss."],["b","The \"excess depreciation\" (depreciation on the revalued amount minus depreciation on cost) may be transferred annually from the surplus to retained earnings (a transfer within equity)."],["ex","Example 7 – Revaluation",["A building cost 1,000,000 on 1/1/2017, useful life 50 years. On 1/1/2027 (after 10 years) its carrying amount is 800,000, and it is revalued to 1,200,000.","Revaluation surplus = 1,200,000 – 800,000 = **400,000** in OCI.","New depreciation = 1,200,000 ÷ 40 remaining years = **30,000**. Old depreciation was 20,000, so the excess depreciation of 10,000 may be transferred annually from the surplus to retained earnings."]],["je",[["Accumulated depreciation","200,000",""],["Building (1,200,000 – 1,000,000)","200,000",""],["Revaluation surplus (OCI)","","400,000"]]],["h3","Components and derecognition"],["p","Each part with a cost significant relative to the asset is depreciated separately (such as an aircraft’s engine and its body). The cost of a major periodic inspection is capitalized as a component. On derecognition: gain or loss = proceeds – carrying amount, recognized in profit or loss (not as revenue), and any remaining revaluation surplus is transferred directly to retained earnings."],["exam","Exam point",["IAS 16 is among the most frequently tested standards in DipIFR: cost of an asset with a dismantling provision and unwinding of discount, revaluation with deferred tax (IAS 12), and components. A \"very frequently tested\" topic."]]]}},{"title":"8) IAS 23 تكاليف الاقتراض","blocks":[["p","تكاليف الاقتراض المنسوبة مباشرة لاقتناء أو إنشاء أو إنتاج **أصل مؤهل** (يستغرق فترة طويلة ليصبح جاهزًا) **يجب** رسملتها. الرسملة تبدأ عند تحقق 3 شروط معًا: تكبد الإنفاق، وتكبد تكاليف الاقتراض، وبدء الأنشطة اللازمة. تتوقف مؤقتًا خلال فترات التعليق الطويلة، وتنتهي عندما يصبح الأصل جاهزًا فعليًا."],["ex","مثال 8 – قرض محدد",["اقترضت الشركة 10,000,000 بفائدة 8% في 1/1/2027 لبناء مصنع. بدأ البناء فعليًا في 1/3/2027 واستمر حتى نهاية السنة. استُثمرت الأموال غير المستخدمة مؤقتًا خلال فترة البناء وحققت عائدًا 50,000.","الفائدة المؤهلة = 10,000,000 × 8% × 10/12 = 666,667 – عائد الاستثمار المؤقت 50,000 = **616,667** تُرسمل.","فائدة يناير وفبراير = 133,333 مصروف تمويلي (قبل بدء الأنشطة)."]],["p","**القروض العامة:** يُطبق معدل الرسملة (المتوسط المرجح لتكلفة القروض العامة) على النفقات المصروفة على الأصل. مثال: قروض عامة 5,000,000 بـ 10% و 3,000,000 بـ 6% ← المعدل = (500,000 + 180,000) ÷ 8,000,000 = 8.5%."]],"en":{"title":"8) IAS 23 Borrowing Costs","blocks":[["p","Borrowing costs directly attributable to the acquisition, construction or production of a **qualifying asset** (one that takes a substantial period to get ready) **must** be capitalized. Capitalization starts when all 3 conditions are met: expenditure is incurred, borrowing costs are incurred, and necessary activities have started. It is suspended during extended periods of suspension and ends when the asset is substantially ready."],["ex","Example 8 – Specific borrowing",["The company borrowed 10,000,000 at 8% on 1/1/2027 to build a factory. Construction actually started on 1/3/2027 and continued until year end. Unused funds were temporarily invested during the construction period and earned 50,000.","Eligible interest = 10,000,000 × 8% × 10/12 = 666,667 – temporary investment income 50,000 = **616,667** capitalized.","Interest for January and February = 133,333 finance expense (before activities started)."]],["p","**General borrowings:** apply the capitalization rate (the weighted average cost of general borrowings) to the expenditure on the asset. Example: general loans of 5,000,000 at 10% and 3,000,000 at 6% → rate = (500,000 + 180,000) ÷ 8,000,000 = 8.5%."]]}},{"title":"9) IAS 20 المنح الحكومية","blocks":[["p","يُعترف بالمنحة عند وجود تأكيد معقول على الالتزام بشروطها واستلامها. تُعترف في الأرباح والخسائر على أساس منتظم يقابل التكاليف التي تعوضها."],["b","**منح مرتبطة بأصول:** إما دخل مؤجل يُطفأ على عمر الأصل، أو تُخصم من تكلفة الأصل."],["b","**منح مرتبطة بالدخل:** تُعرض كدخل أو تُخصم من المصروف المرتبط."],["b","**قرض حكومي بفائدة أقل من السوق:** الفرق بين المتحصلات والقيمة العادلة للقرض (وفق IFRS 9) يعالج كمنحة."],["b","**رد المنحة:** تغيير في التقدير؛ يُخفض الرصيد المؤجل أولًا والباقي مصروف فورًا (أو للأصل: يزاد الأصل ويُحمل فرق الإهلاك المتراكم فورًا)."],["ex","مثال 9 – منحة لشراء آلة",["آلة 100,000، منحة 20,000، العمر 5 سنوات.","الطريقة 1 (دخل مؤجل): إهلاك 20,000 سنويًا + إطفاء دخل مؤجل 4,000 ← صافي الأثر 16,000.","الطريقة 2 (خصم من التكلفة): الأصل 80,000 ← إهلاك 16,000. النتيجة على الربح واحدة، والفرق في العرض بالمركز المالي."]]],"en":{"title":"9) IAS 20 Government Grants","blocks":[["p","A grant is recognized when there is reasonable assurance that its conditions will be met and it will be received. It is recognized in profit or loss on a systematic basis matching the costs it compensates."],["b","**Grants related to assets:** either deferred income released over the asset’s life, or deducted from the asset’s cost."],["b","**Grants related to income:** presented as income or deducted from the related expense."],["b","**Below-market-rate government loan:** the difference between proceeds and the loan’s fair value (under IFRS 9) is treated as a grant."],["b","**Repayment of a grant:** a change in estimate; first reduce the deferred balance, then expense the rest immediately (or for assets: increase the asset and expense the cumulative extra depreciation immediately)."],["ex","Example 9 – Grant to buy a machine",["Machine 100,000, grant 20,000, useful life 5 years.","Method 1 (deferred income): depreciation 20,000 per year + release of deferred income 4,000 → net effect 16,000.","Method 2 (deduct from cost): asset 80,000 → depreciation 16,000. The effect on profit is the same; the difference is presentation in the statement of financial position."]]]}},{"title":"10) IAS 38 الأصول غير الملموسة","blocks":[["p","أصل غير نقدي قابل للتحديد (قابل للفصل أو ناشئ عن حق تعاقدي/قانوني) بدون كيان مادي، تسيطر عليه المنشأة ويحقق منافع مستقبلية."],["h3","البحث والتطوير"],["b","**مرحلة البحث:** مصروف دائمًا."],["b","**مرحلة التطوير:** تُرسمل **إلزاميًا** عند إثبات كل الشروط (تُحفظ بـ PIRATE): احتمال المنافع (Probable)، النية للإكمال (Intention)، الموارد المتاحة (Resources)، القدرة على الاستخدام أو البيع (Ability)، الجدوى الفنية (Technical feasibility)، قياس النفقات بموثوقية (Expenditure measured)."],["b","النفقات التي حُملت مصروفًا قبل تحقق الشروط **لا** يُعاد رسملتها لاحقًا."],["b","**لا يُعترف** بالعلامات التجارية وقوائم العملاء والشهرة المولدة داخليًا."],["b","الأصل ذو العمر المحدد يُطفأ؛ ذو العمر غير المحدد لا يُطفأ ويُختبر سنويًا لانخفاض القيمة. نموذج إعادة التقييم مسموح فقط إذا وُجد سوق نشط."],["ex","مثال 10 – مشروع تطوير",["أنفقت الشركة على مشروع برنامج جديد: يناير–مارس 2027 مبلغ 200,000 (بحث ودراسات)، وفي 1 أبريل تحققت كل شروط الرسملة، ثم أنفقت من أبريل إلى ديسمبر 600,000. بدأ البيع التجاري في 1/1/2028 بعمر متوقع 4 سنوات.","المعالجة: 200,000 مصروف في 2027، و **600,000** أصل غير ملموس (قيد التطوير، لا يُطفأ في 2027 لكنه يُختبر للانخفاض). من 2028 إطفاء 150,000 سنويًا."]]],"en":{"title":"10) IAS 38 Intangible Assets","blocks":[["p","An identifiable (separable, or arising from contractual/legal rights) non-monetary asset without physical substance, controlled by the entity and producing future benefits."],["h3","Research and development"],["b","**Research phase:** always expensed."],["b","**Development phase:** **must** be capitalized once all criteria are demonstrated (remember PIRATE): Probable benefits, Intention to complete, Resources available, Ability to use or sell, Technical feasibility, Expenditure measured reliably."],["b","Expenditure expensed before the criteria were met is **not** reinstated later."],["b","Internally generated brands, customer lists and goodwill are **not recognized**."],["b","Finite-life assets are amortized; indefinite-life assets are not amortized and are tested annually for impairment. The revaluation model is allowed only if an active market exists."],["ex","Example 10 – A development project",["The company spent on a new software project: January–March 2027, 200,000 (research and studies). On 1 April all capitalization criteria were met, then it spent 600,000 from April to December. Commercial sales began on 1/1/2028 with an expected life of 4 years.","Treatment: 200,000 expensed in 2027, and **600,000** recognized as an intangible asset (under development, not amortized in 2027 but tested for impairment). From 2028, amortization of 150,000 per year."]]]}},{"title":"11) IAS 40 العقار الاستثماري","blocks":[["p","عقار (أرض أو مبنى) محتفظ به لتحقيق إيجار أو ارتفاع رأسمالي، وليس للاستخدام في الإنتاج أو الإدارة أو للبيع في النشاط المعتاد. العقار المؤجر لشركة تابعة يُعد استثماريًا في القوائم المنفردة، لكنه PPE في القوائم المجمعة."],["t",["نموذج القيمة العادلة","نموذج التكلفة"],[["يُقاس بالقيمة العادلة في كل تاريخ تقرير، والتغير في **الأرباح والخسائر**، ولا يُهلك.","يُعامل مثل IAS 16 (تكلفة – إهلاك – انخفاض) مع الإفصاح عن القيمة العادلة."]],[4819,4819]],["h3","التحويلات (تغير الاستخدام)"],["b","من مملوك للاستخدام (IAS 16) إلى استثماري بالقيمة العادلة: يُعاد تقييم العقار وفق IAS 16 في تاريخ التحويل، والفرق إلى **OCI** (فائض إعادة تقييم)."],["b","من مخزون إلى استثماري بالقيمة العادلة: الفرق في **الأرباح والخسائر**."],["b","من استثماري بالقيمة العادلة إلى مملوك للاستخدام أو مخزون: القيمة العادلة في تاريخ التحويل تصبح \"التكلفة المفترضة\"."],["ex","مثال 11 – تحويل مبنى إداري إلى عقار استثماري",["مبنى إداري تكلفته 5,000,000، مجمع إهلاكه حتى 30/6/2027 مبلغ 1,000,000. في 30/6/2027 أُخلي المبنى وأُجّر لطرف خارجي، والقيمة العادلة 4,600,000. الشركة تستخدم نموذج القيمة العادلة للعقار الاستثماري. في 31/12/2027 القيمة العادلة 4,750,000.","في 30/6: الإهلاك حتى تاريخ التحويل يُحمل، ثم إعادة تقييم وفق IAS 16: الفرق = 4,600,000 – 4,000,000 = **600,000 إلى OCI**.","في 31/12: الزيادة 150,000 ← **أرباح وخسائر** (لأنه الآن عقار استثماري)، ولا إهلاك بعد التحويل."]],["exam","نقطة امتحان",["التحويلات بين IAS 16 و IAS 40 من الموضوعات \"المتكررة جدًا\" في الحالات المتنوعة بـ DipIFR، وغالبًا مع ضريبة مؤجلة على فائض إعادة التقييم."]]],"en":{"title":"11) IAS 40 Investment Property","blocks":[["p","Property (land or a building) held to earn rentals or for capital appreciation, not for use in production or administration or for sale in the ordinary course of business. Property leased to a subsidiary is investment property in the individual financial statements, but PPE in the consolidated statements."],["t",["Fair value model","Cost model"],[["Measured at fair value at each reporting date, with changes in **profit or loss**, and not depreciated.","Treated like IAS 16 (cost – depreciation – impairment) with disclosure of fair value."]],[4819,4819]],["h3","Transfers (change in use)"],["b","From owner-occupied (IAS 16) to investment property at fair value: revalue the property under IAS 16 at the transfer date, with the difference to **OCI** (revaluation surplus)."],["b","From inventory to investment property at fair value: the difference goes to **profit or loss**."],["b","From investment property at fair value to owner-occupied or inventory: fair value at the transfer date becomes the \"deemed cost\"."],["ex","Example 11 – Transferring an office building to investment property",["An office building cost 5,000,000, with accumulated depreciation to 30/6/2027 of 1,000,000. On 30/6/2027 the building was vacated and leased to a third party; fair value 4,600,000. The company uses the fair value model for investment property. On 31/12/2027 fair value is 4,750,000.","On 30/6: depreciation up to the transfer date is charged, then revalue under IAS 16: difference = 4,600,000 – 4,000,000 = **600,000 to OCI**.","On 31/12: the increase of 150,000 → **profit or loss** (because it is now investment property), and no depreciation after the transfer."]],["exam","Exam point",["Transfers between IAS 16 and IAS 40 are \"very frequently tested\" in DipIFR mixed topics, often together with deferred tax on the revaluation surplus."]]]}},{"title":"12) IAS 41 الزراعة","blocks":[["p","الأصول البيولوجية (حيوانات ونباتات حية) والمنتج الزراعي عند الحصاد تقاس بـ **القيمة العادلة ناقص تكاليف البيع**، والتغير في الأرباح والخسائر. **النباتات المثمرة (Bearer plants)** مثل أشجار الفاكهة والنخيل تُعامل وفق IAS 16، لكن الثمار التي عليها تبقى ضمن IAS 41. بعد الحصاد ينتقل المنتج إلى IAS 2 بتكلفة = القيمة العادلة ناقص تكاليف البيع عند الحصاد."],["ex","مثال 12 – قطيع ماشية",["قطيع 100 بقرة، القيمة العادلة ناقص تكاليف البيع في بداية السنة 1,000 للرأس، وفي نهايتها 1,100 (منها 60 بسبب النمو و 40 بسبب ارتفاع الأسعار). ← المكسب = 100 × 100 = **10,000** في الأرباح والخسائر، ويُستحسن الإفصاح عن التحليل بين التغير المادي وتغير السعر."]]],"en":{"title":"12) IAS 41 Agriculture","blocks":[["p","Biological assets (living animals and plants) and agricultural produce at harvest are measured at **fair value less costs to sell**, with changes in profit or loss. **Bearer plants** such as fruit trees and palms are accounted for under IAS 16, but the produce growing on them remains within IAS 41. After harvest the produce moves to IAS 2 with cost = fair value less costs to sell at harvest."],["ex","Example 12 – A dairy herd",["A herd of 100 cows; fair value less costs to sell at the start of the year 1,000 per head, and at the end 1,100 (of which 60 is due to growth and 40 due to price increases). → Gain = 100 × 100 = **10,000** in profit or loss; disclosing the split between physical change and price change is encouraged."]]]}},{"title":"13) IAS 36 انخفاض قيمة الأصول","blocks":[["p","**المبدأ:** لا يُدرج الأصل بأكثر من **قيمته القابلة للاسترداد** = الأعلى بين (القيمة العادلة ناقص تكاليف الاستبعاد) و (القيمة الاستخدامية = القيمة الحالية للتدفقات المتوقعة من الاستخدام)."],["b","الاختبار عند وجود مؤشر انخفاض (داخلي أو خارجي)، **وسنويًا** للشهرة والأصول غير الملموسة ذات العمر غير المحدد وغير الجاهزة للاستخدام."],["b","التدفقات في القيمة الاستخدامية تستبعد: إعادة الهيكلة غير الملتزم بها، التحسينات المستقبلية، تدفقات التمويل والضرائب. سعر الخصم قبل الضريبة."],["b","**وحدة توليد النقد (CGU):** أصغر مجموعة أصول تولد تدفقات مستقلة. خسارة الانخفاض تُوزع: (1) على الشهرة أولًا، (2) ثم على باقي الأصول بنسبة قيمها الدفترية، دون تخفيض أي أصل عن الأعلى بين قيمته القابلة للاسترداد المنفردة أو صفر."],["b","عكس الانخفاض مسموح إلا للشهرة. الانخفاض على أصل معاد تقييمه يُخصم من فائض إعادة التقييم أولًا."],["ex","مثال 13 – انخفاض قيمة وحدة توليد نقد",["وحدة توليد نقد تتضمن: شهرة 120، مبنى 500، آلات 300 = 920. القيمة القابلة للاسترداد 700 ← الخسارة 220.","توزيع الخسارة: الشهرة 120 (تُشطب بالكامل)، الباقي 100 يوزع بنسبة 500:300 ← المبنى 62.5 والآلات 37.5.","الأرصدة بعد الانخفاض: شهرة صفر، مبنى 437.5، آلات 262.5 = 700 ✓."]],["p","**ملحوظة على الحصص غير المسيطرة:** لو قيست الحصة غير المسيطرة بالنسبة من صافي الأصول (وليس القيمة العادلة)، يجب \"تكبير\" الشهرة بإضافة الشهرة الخاصة بالحصة غير المسيطرة قبل مقارنة القيمة الدفترية بالقابلة للاسترداد (Gross-up)، ثم يُعترف فقط بنصيب الأم من خسارة الشهرة."],["exam","نقطة امتحان",["IAS 36 يأتي في سؤال التجميع (انخفاض الشهرة وتأثيره على الحصة غير المسيطرة) وفي الحالات المتنوعة (توزيع خسارة على وحدة توليد نقد). موضوع \"متكرر جدًا\"."]]],"en":{"title":"13) IAS 36 Impairment of Assets","blocks":[["p","**Principle:** an asset may not be carried above its **recoverable amount** = the higher of (fair value less costs of disposal) and (value in use = present value of expected cash flows from use)."],["b","Test when there is an indication of impairment (internal or external), **and annually** for goodwill, indefinite-life intangibles and intangibles not yet available for use."],["b","Value-in-use cash flows exclude: uncommitted restructuring, future enhancements, financing and tax cash flows. The discount rate is pre-tax."],["b","**Cash-generating unit (CGU):** the smallest group of assets generating independent cash flows. An impairment loss is allocated: (1) to goodwill first, (2) then to the other assets pro rata to their carrying amounts, without reducing any asset below the higher of its individual recoverable amount or zero."],["b","Reversal of impairment is allowed except for goodwill. Impairment of a revalued asset is first deducted from the revaluation surplus."],["ex","Example 13 – Impairment of a cash-generating unit",["A CGU includes: goodwill 120, building 500, machinery 300 = 920. Recoverable amount 700 → loss 220.","Allocation: goodwill 120 (fully written off); the remaining 100 is allocated 500:300 → building 62.5 and machinery 37.5.","Balances after impairment: goodwill zero, building 437.5, machinery 262.5 = 700 ✓."]],["p","**Note on non-controlling interest:** if NCI was measured at its share of net assets (not fair value), goodwill must be \"grossed up\" by adding the NCI’s notional goodwill before comparing carrying amount to recoverable amount, and then only the parent’s share of the goodwill impairment is recognized."],["exam","Exam point",["IAS 36 appears in the consolidation question (goodwill impairment and its effect on NCI) and in mixed topics (allocating a loss to a CGU). A \"very frequently tested\" topic."]]]}},{"title":"14) IFRS 5 الأصول غير المتداولة المحتفظ بها للبيع والعمليات المتوقفة","blocks":[["p","**شروط التصنيف كمحتفظ به للبيع:** متاح للبيع الفوري بحالته الحالية، والبيع محتمل جدًا: التزام الإدارة بخطة، بدء برنامج فعال للبحث عن مشترٍ، تسويق بسعر معقول، توقع إتمام البيع خلال 12 شهرًا، وعدم توقع تغيير جوهري في الخطة."],["b","يقاس بالأقل بين القيمة الدفترية والقيمة العادلة ناقص تكاليف البيع. **يتوقف الإهلاك.** يُعرض منفصلًا في المركز المالي."],["b","الأصل المزمع **التخلي عنه** (Abandoned) لا يُصنف محتفظًا به للبيع."],["b","**العملية المتوقفة:** مكون تم استبعاده أو مصنف للبيع ويمثل خط أعمال رئيسيًا أو منطقة جغرافية رئيسية منفصلة. يُعرض مبلغ واحد في قائمة الدخل (ربح/خسارة العملية المتوقفة بعد الضريبة) مع التحليل في الإيضاحات وإعادة عرض المقارنة."],["ex","مثال 14",["مصنع قيمته الدفترية 500 في تاريخ التصنيف، قيمته العادلة 460 وتكاليف البيع المتوقعة 20 ← يقاس بـ 440 وخسارة انخفاض **60** في الأرباح والخسائر، ولا يُهلك بعد ذلك."]]],"en":{"title":"14) IFRS 5 Non-current Assets Held for Sale and Discontinued Operations","blocks":[["p","**Criteria for classification as held for sale:** available for immediate sale in its present condition, and the sale is highly probable: management is committed to a plan, an active programme to locate a buyer has started, it is marketed at a reasonable price, the sale is expected within 12 months, and significant changes to the plan are unlikely."],["b","Measured at the lower of carrying amount and fair value less costs to sell. **Depreciation stops.** Presented separately in the statement of financial position."],["b","An asset to be **abandoned** is not classified as held for sale."],["b","**Discontinued operation:** a component that has been disposed of or is classified as held for sale and represents a separate major line of business or geographical area. A single amount is shown in the income statement (post-tax profit/loss of the discontinued operation), with analysis in the notes and restated comparatives."],["ex","Example 14",["A factory with a carrying amount of 500 at the classification date, fair value 460 and expected costs to sell 20 → measured at 440, with an impairment loss of **60** in profit or loss, and no further depreciation."]]]}},{"title":"15) IFRS 16 عقود الإيجار","blocks":[["p","**تعريف عقد الإيجار:** عقد يمنح الحق في السيطرة على استخدام أصل محدد لفترة زمنية مقابل عوض. السيطرة = الحق في الحصول على كل المنافع الاقتصادية تقريبًا + الحق في توجيه الاستخدام."],["h3","المستأجر (نموذج واحد داخل الميزانية)"],["b","**التزام الإيجار** = القيمة الحالية لدفعات الإيجار غير المدفوعة (الثابتة، المتغيرة المرتبطة بمؤشر أو معدل، ضمانات القيمة المتبقية، سعر خيار الشراء المؤكد بشكل معقول، غرامات الإنهاء) مخصومة بالسعر الضمني أو سعر الاقتراض الإضافي."],["b","**أصل حق الاستخدام** = التزام الإيجار + دفعات مدفوعة مقدمًا + تكاليف مباشرة أولية + تكاليف الإزالة المقدرة – حوافز الإيجار المستلمة."],["b","**إعفاءات اختيارية:** الإيجارات قصيرة الأجل (12 شهرًا أو أقل بدون خيار شراء) والأصول منخفضة القيمة ← مصروف بالقسط الثابت."],["ex","مثال 15 – محاسبة المستأجر",["عقد إيجار لمدة 5 سنوات يبدأ 1/1/2027، دفعة سنوية 100,000 في نهاية كل سنة، سعر الاقتراض الإضافي 8%، تكاليف مباشرة أولية 5,000. معامل القيمة الحالية لدفعة عادية 5 سنوات بـ 8% = 3.9927.","التزام الإيجار = 100,000 × 3.9927 = **399,271**. أصل حق الاستخدام = 399,271 + 5,000 = **404,271** ← إهلاك سنوي 80,854."]],["t",["السنة","رصيد أول المدة","فائدة 8%","الدفعة","رصيد آخر المدة"],[["2027","399,271","31,942","(100,000)","331,213"],["2028","331,213","26,497","(100,000)","257,710"],["2029","257,710","20,617","(100,000)","178,327"]],[1600,2000,2000,2000,2038]],["p","**في 31/12/2027:** إجمالي الالتزام 331,213، منه متداول = 331,213 – 257,710 = **73,503** وغير متداول **257,710**. مصروفات قائمة الدخل: إهلاك 80,854 (تشغيلي) + فائدة 31,942 (فئة تمويلية وفق IFRS 18)."],["je",[["أصل حق الاستخدام","404,271",""],["التزام الإيجار","","399,271"],["النقدية (تكاليف أولية)","","5,000"]]],["h3","المؤجر"],["p","يصنف الإيجار **تمويليًا** إذا نُقلت كل المخاطر والمنافع تقريبًا (مؤشرات: نقل الملكية، خيار شراء بسعر مغرٍ، المدة تغطي معظم العمر، القيمة الحالية للدفعات تقارب القيمة العادلة، أصل متخصص)، فيعترف المؤجر بذمة = صافي الاستثمار في الإيجار. وإلا فهو **تشغيلي**: يبقى الأصل لدى المؤجر ويعترف بالإيراد بالقسط الثابت."],["h3","البيع وإعادة الاستئجار"],["p","إذا كان التحويل يمثل بيعًا وفق IFRS 15: البائع-المستأجر يستبعد الأصل ويعترف بحق استخدام بنسبة من القيمة الدفترية السابقة تعادل الحق المحتفظ به، ويعترف فقط بالربح المتعلق بالحقوق المنقولة للمشتري. وفق تعديل 2022، يقيس التزام الإيجار لاحقًا بحيث لا يعترف بأي ربح أو خسارة تتعلق بحق الاستخدام المحتفظ به. إذا لم يكن بيعًا: يبقى الأصل ويُعالج المتحصل كالتزام مالي (IFRS 9)."],["exam","نقطة امتحان",["IFRS 16 \"متكرر جدًا\" في DipIFR: حساب التزام الإيجار وأصل حق الاستخدام، فصل المتداول عن غير المتداول، وتحديد هل العقد يحتوي على إيجار، والبيع وإعادة الاستئجار."]]],"en":{"title":"15) IFRS 16 Leases","blocks":[["p","**Definition of a lease:** a contract that conveys the right to control the use of an identified asset for a period of time in exchange for consideration. Control = the right to obtain substantially all the economic benefits + the right to direct the use."],["h3","Lessee (a single on-balance-sheet model)"],["b","**Lease liability** = present value of unpaid lease payments (fixed, variable based on an index or rate, residual value guarantees, purchase option price if reasonably certain, termination penalties), discounted at the rate implicit in the lease or the incremental borrowing rate."],["b","**Right-of-use asset** = lease liability + prepaid payments + initial direct costs + estimated dismantling costs – lease incentives received."],["b","**Optional exemptions:** short-term leases (12 months or less with no purchase option) and low-value assets → expensed on a straight-line basis."],["ex","Example 15 – Lessee accounting",["A 5-year lease starting 1/1/2027, annual payment of 100,000 at the end of each year, incremental borrowing rate 8%, initial direct costs 5,000. The 5-year ordinary annuity factor at 8% = 3.9927.","Lease liability = 100,000 × 3.9927 = **399,271**. Right-of-use asset = 399,271 + 5,000 = **404,271** → annual depreciation 80,854."]],["t",["Year","Opening balance","Interest 8%","Payment","Closing balance"],[["2027","399,271","31,942","(100,000)","331,213"],["2028","331,213","26,497","(100,000)","257,710"],["2029","257,710","20,617","(100,000)","178,327"]],[1600,2000,2000,2000,2038]],["p","**At 31/12/2027:** total liability 331,213, of which current = 331,213 – 257,710 = **73,503** and non-current **257,710**. Income statement expenses: depreciation 80,854 (operating) + interest 31,942 (financing category under IFRS 18)."],["je",[["Right-of-use asset","404,271",""],["Lease liability","","399,271"],["Cash (initial costs)","","5,000"]]],["h3","Lessor"],["p","A lease is classified as a **finance lease** if substantially all risks and rewards are transferred (indicators: transfer of ownership, a bargain purchase option, the term covers most of the asset’s life, the PV of payments approximates fair value, a specialized asset), and the lessor recognizes a receivable = net investment in the lease. Otherwise it is an **operating lease**: the asset stays with the lessor, which recognizes income on a straight-line basis."],["h3","Sale and leaseback"],["p","If the transfer is a sale under IFRS 15: the seller-lessee derecognizes the asset and recognizes a right-of-use asset at the proportion of the previous carrying amount relating to the right retained, and recognizes only the gain relating to the rights transferred to the buyer. Under the 2022 amendment, it subsequently measures the lease liability so that it recognizes no gain or loss relating to the right of use retained. If it is not a sale: the asset stays on the books and the proceeds are a financial liability (IFRS 9)."],["exam","Exam point",["IFRS 16
