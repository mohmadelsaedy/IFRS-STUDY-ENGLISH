 is \"very frequently tested\" in DipIFR: calculating the lease liability and right-of-use asset, splitting current and non-current, deciding whether a contract contains a lease, and sale and leaseback."]]]}},{"title":"16) IFRS 13 قياس القيمة العادلة","blocks":[["p","**التعريف:** السعر الذي سيُستلم لبيع أصل أو يُدفع لتحويل التزام في معاملة منتظمة بين المشاركين في السوق في تاريخ القياس (سعر خروج). يُقاس في **السوق الرئيسي** (الأكبر حجمًا للأصل)، وإن لم يوجد ففي **السوق الأكثر فائدة**. تكاليف المعاملة **لا** تُخصم من القيمة العادلة، لكن تكاليف النقل تُخصم إذا كان الموقع خاصية للأصل."],["b","**الاستخدام الأعلى والأفضل** للأصول غير المالية: الاستخدام الممكن ماديًا والمسموح قانونيًا والمجدي ماليًا."],["b","**التسلسل الهرمي:** المستوى 1 أسعار معلنة في سوق نشط لأصول مطابقة؛ المستوى 2 مدخلات ملحوظة أخرى؛ المستوى 3 مدخلات غير ملحوظة."],["ex","مثال 16 – السوق الرئيسي مقابل الأكثر فائدة",["السوق (أ): السعر 26، تكاليف معاملة 3، تكاليف نقل 2. السوق (ب): السعر 25، تكاليف معاملة 1، تكاليف نقل 2.","إذا كان (أ) هو السوق الرئيسي: القيمة العادلة = 26 – 2 = **24** (لا نخصم تكاليف المعاملة).","إذا لم يوجد سوق رئيسي: نحدد الأكثر فائدة بصافي المبلغ: (أ) 26 – 3 – 2 = 21، (ب) 25 – 1 – 2 = 22 ← (ب) الأكثر فائدة ← القيمة العادلة = 25 – 2 = **23**."]]],"en":{"title":"16) IFRS 13 Fair Value Measurement","blocks":[["p","**Definition:** the price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date (an exit price). Measured in the **principal market** (the market with the greatest volume for the asset), or if none, in the **most advantageous market**. Transaction costs are **not** deducted from fair value, but transport costs are deducted if location is a characteristic of the asset."],["b","**Highest and best use** for non-financial assets: physically possible, legally permissible and financially feasible."],["b","**Hierarchy:** Level 1 quoted prices in active markets for identical assets; Level 2 other observable inputs; Level 3 unobservable inputs."],["ex","Example 16 – Principal market vs most advantageous market",["Market A: price 26, transaction costs 3, transport costs 2. Market B: price 25, transaction costs 1, transport costs 2.","If A is the principal market: fair value = 26 – 2 = **24** (transaction costs are not deducted).","If there is no principal market: identify the most advantageous market by net amount: A 26 – 3 – 2 = 21, B 25 – 1 – 2 = 22 → B is most advantageous → fair value = 25 – 2 = **23**."]]]}}],"intro":[],"en":{"title":"Part 3: Asset Standards","intro":[]}},{"title":"الجزء الرابع: الالتزامات والإيراد والضرائب والعاملين","lessons":[{"title":"17) IFRS 15 الإيراد من العقود مع العملاء","blocks":[["p","**نموذج الخطوات الخمس:**"],["n","تحديد العقد (موافقة الأطراف، تحديد الحقوق وشروط السداد، جوهر تجاري، احتمال تحصيل العوض).","num2"],["n","تحديد التزامات الأداء (السلع/الخدمات \"المتميزة\" القابلة للتمييز وتُستفاد منها منفصلة).","num2"],["n","تحديد سعر المعاملة (مع العوض المتغير بالقيمة المتوقعة أو المبلغ الأرجح بشرط \"احتمال كبير لعدم عكس الإيراد\"، ومكون التمويل الجوهري، والعوض غير النقدي، والعوض المدفوع للعميل).","num2"],["n","توزيع السعر على التزامات الأداء بنسبة أسعار البيع المستقلة.","num2"],["n","الاعتراف بالإيراد عند (أو كلما) تم الوفاء بالتزام الأداء: في نقطة زمنية أو على مدى زمني.","num2"],["p","**الاعتراف على مدى زمني** إذا تحقق أحد 3 شروط: العميل يستلم ويستهلك المنافع أثناء الأداء، أو الأداء ينشئ/يحسن أصلًا يسيطر عليه العميل، أو الأصل ليس له استخدام بديل وللمنشأة حق واجب النفاذ في السداد عن الأداء المكتمل حتى تاريخه."],["ex","مثال 17 – عقد متعدد الالتزامات",["باعت شركة في 1/1/2027 آلة مع تركيبها وخدمة صيانة لمدة سنتين بسعر إجمالي 1,000,000. أسعار البيع المستقلة: الآلة 800,000، التركيب 100,000، الصيانة 300,000 (المجموع 1,200,000). تم التسليم والتركيب في 1/1/2027.","التوزيع: الآلة 1,000,000 × 800/1,200 = **666,667**، التركيب **83,333**، الصيانة **250,000**.","إيراد 2027 = 666,667 + 83,333 + (250,000 ÷ 2) = **875,000**، والباقي 125,000 التزام عقد (إيراد مؤجل)."]],["ex","مثال 18 – عقد إنشاء على مدى زمني (طريقة المدخلات)",["سعر العقد 10,000,000، التكلفة الكلية المقدرة 8,000,000، التكلفة حتى نهاية 2027 = 3,000,000. نسبة الإنجاز = 3 ÷ 8 = 37.5%.","الإيراد = 3,750,000؛ تكلفة المبيعات = 3,000,000؛ الربح = 750,000.","لو كانت التكلفة الكلية المقدرة 11,000,000 (عقد خاسر): الخسارة الكلية المتوقعة 1,000,000 تُعترف **فورًا بالكامل** (كمخصص عقد مرهق وفق IAS 37)."]],["h3","مسائل خاصة شائعة في الامتحان"],["t",["الحالة","المعالجة"],[["الوكيل مقابل الأصيل","إذا سيطرت المنشأة على السلعة قبل نقلها للعميل فهي أصيل وتعترف بالإجمالي، وإلا فهي وكيل وتعترف بالعمولة فقط."],["الدفع المؤجل لأكثر من سنة","مكون تمويل: الإيراد = القيمة الحالية، والفرق إيراد فوائد على المدة."],["البيع مع حق الرد","إيراد للمتوقع عدم رده فقط + التزام استرداد + أصل لحق استرداد البضاعة."],["الضمان","ضمان \"تأكيدي\" (Assurance) ← مخصص IAS 37. ضمان \"خدمي\" إضافي يمكن شراؤه منفصلًا ← التزام أداء منفصل."],["الفاتورة والاحتفاظ (Bill-and-hold)","إيراد فقط إذا انتقلت السيطرة: سبب جوهري، البضاعة محددة ومنفصلة وجاهزة، ولا يمكن استخدامها لعميل آخر."],["تكاليف الحصول على العقد","التكاليف الإضافية (مثل عمولة البيع) تُرسمل إذا كانت متوقعة الاسترداد وتُطفأ."],["البيع وإعادة الشراء","التزام آجل أو خيار شراء للبائع ← لا بيع؛ ترتيب تمويل أو إيجار حسب السعر."]],[3000,6638]],["exam","نقطة امتحان",["IFRS 15 من أعلى المعايير تكرارًا في DipIFR (غالبًا في سؤال الحالات المتنوعة أو سؤال مستقل): توزيع السعر، وكيل/أصيل، مكون التمويل، الاعتراف على مدى زمني. موضوع \"متكرر جدًا\"."]]],"en":{"title":"17) IFRS 15 Revenue from Contracts with Customers","blocks":[["p","**The five-step model:**"],["n","Identify the contract (approval by the parties, identifiable rights and payment terms, commercial substance, collection of consideration probable).","num2"],["n","Identify the performance obligations (goods/services that are \"distinct\": capable of being distinct and distinct in the context of the contract).","num2"],["n","Determine the transaction price (variable consideration using expected value or most likely amount, subject to \"highly probable that no significant reversal\" constraint; significant financing component; non-cash consideration; consideration payable to the customer).","num2"],["n","Allocate the price to the performance obligations in proportion to standalone selling prices.","num2"],["n","Recognize revenue when (or as) each performance obligation is satisfied: at a point in time or over time.","num2"],["p","**Recognition over time** if one of 3 criteria is met: the customer simultaneously receives and consumes the benefits as the entity performs, or the performance creates/enhances an asset the customer controls, or the asset has no alternative use and the entity has an enforceable right to payment for performance completed to date."],["ex","Example 17 – A contract with multiple obligations",["On 1/1/2027 a company sold a machine with installation and two years of maintenance for a total price of 1,000,000. Standalone selling prices: machine 800,000, installation 100,000, maintenance 300,000 (total 1,200,000). Delivery and installation took place on 1/1/2027.","Allocation: machine 1,000,000 × 800/1,200 = **666,667**, installation **83,333**, maintenance **250,000**.","2027 revenue = 666,667 + 83,333 + (250,000 ÷ 2) = **875,000**, and the remaining 125,000 is a contract liability (deferred revenue)."]],["ex","Example 18 – A construction contract over time (input method)",["Contract price 10,000,000, total estimated cost 8,000,000, cost to the end of 2027 = 3,000,000. Percentage complete = 3 ÷ 8 = 37.5%.","Revenue = 3,750,000; cost of sales = 3,000,000; profit = 750,000.","If total estimated cost were 11,000,000 (a loss-making contract): the expected total loss of 1,000,000 is recognized **immediately in full** (as an onerous contract provision under IAS 37)."]],["h3","Common special issues in the exam"],["t",["Situation","Treatment"],[["Agent vs principal","If the entity controls the good before transferring it to the customer it is a principal and recognizes the gross amount; otherwise it is an agent and recognizes only the commission."],["Deferred payment of more than one year","A financing component: revenue = present value, and the difference is interest income over the period."],["Sale with a right of return","Revenue only for the amount not expected to be returned + a refund liability + an asset for the right to recover goods."],["Warranty","An \"assurance\" warranty → IAS 37 provision. An additional \"service\" warranty that can be bought separately → a separate performance obligation."],["Bill-and-hold","Revenue only if control has transferred: a substantive reason, the goods are identified separately and ready, and cannot be used for another customer."],["Costs of obtaining a contract","Incremental costs (such as a sales commission) are capitalized if expected to be recovered, and amortized."],["Sale and repurchase","A forward obligation or a call option for the seller → no sale; a financing arrangement or a lease depending on the price."]],[3000,6638]],["exam","Exam point",["IFRS 15 is among the most frequently tested standards in DipIFR (usually in mixed topics or a stand-alone question): allocating the price, agent/principal, financing component, recognition over time. A \"very frequently tested\" topic."]]]}},{"title":"18) IAS 37 المخصصات والالتزامات والأصول المحتملة","blocks":[["p","**يُعترف بالمخصص** عند توفر 3 شروط: (1) التزام حالي (قانوني أو ضمني) نتيجة حدث سابق، (2) احتمال (أكثر من 50%) تدفق موارد خارجة، (3) تقدير موثوق للمبلغ."],["t",["الاحتمال","الالتزام","الأصل"],[["مؤكد تقريبًا","مخصص","يُعترف به كأصل (ليس محتملًا)"],["محتمل","مخصص","إفصاح عن أصل محتمل"],["ممكن","إفصاح عن التزام محتمل","لا شيء"],["بعيد","لا شيء","لا شيء"]],[2800,3419,3419]],["b","**القياس:** أفضل تقدير. لمجموعة كبيرة من البنود ← القيمة المتوقعة. لالتزام واحد ← النتيجة الأرجح مع مراعاة النتائج الأخرى. يُخصم إذا كان أثر الزمن جوهريًا، ويُعترف بفك الخصم كمصروف تمويلي."],["b","**إعادة الهيكلة:** مخصص فقط عند وجود خطة رسمية تفصيلية **و** إعلانها للمتأثرين أو بدء التنفيذ (التزام ضمني). يشمل فقط التكاليف المباشرة الضرورية، ولا يشمل إعادة تدريب الموظفين المستمرين أو التسويق أو الاستثمار في أنظمة جديدة."],["b","**العقود المرهقة:** مخصص بالأقل بين تكلفة الوفاء (التكاليف الإضافية + توزيع التكاليف الأخرى المرتبطة مباشرة – تعديل 2022) وتكلفة الإنهاء."],["b","**لا مخصص** لخسائر التشغيل المستقبلية أو لإصلاحات مستقبلية لا يوجد التزام حالي بها."],["ex","مثال 19 – مخصص ضمان بالقيمة المتوقعة",["بيعت 1,000 وحدة. الخبرة: 75% بلا عيوب، 20% عيوب صغيرة تكلفة إصلاحها 100 للوحدة، 5% عيوب كبيرة تكلفتها 400 للوحدة.","المخصص = 1,000 × (0.20 × 100 + 0.05 × 400) = 1,000 × 40 = **40,000**."]],["ex","مثال 20 – مخصص إزالة مع فك الخصم",["منصة بترول تكلفة إزالتها بعد 10 سنوات 1,000,000، سعر الخصم 8% (معامل 0.4632) ← المخصص الأولي 463,200 يضاف لتكلفة الأصل.","فك الخصم في السنة الأولى = 463,200 × 8% = **37,056** مصروف تمويلي، ليصبح المخصص 500,256."]]],"en":{"title":"18) IAS 37 Provisions, Contingent Liabilities and Contingent Assets","blocks":[["p","**A provision is recognized** when 3 conditions are met: (1) a present obligation (legal or constructive) as a result of a past event, (2) an outflow of resources is probable (more than 50%), (3) a reliable estimate of the amount."],["t",["Likelihood","Liability","Asset"],[["Virtually certain","Provision","Recognized as an asset (not contingent)"],["Probable","Provision","Disclose a contingent asset"],["Possible","Disclose a contingent liability","Nothing"],["Remote","Nothing","Nothing"]],[2800,3419,3419]],["b","**Measurement:** best estimate. For a large population of items → expected value. For a single obligation → the most likely outcome, considering other outcomes. Discounted if the time effect is material, with the unwinding of the discount recognized as a finance cost."],["b","**Restructuring:** provide only when there is a detailed formal plan **and** it has been announced to those affected or implementation has started (a constructive obligation). Include only direct costs that are necessary, not retraining continuing staff, marketing, or investment in new systems."],["b","**Onerous contracts:** provide at the lower of the cost of fulfilling (incremental costs + an allocation of other directly related costs – 2022 amendment) and the cost of exiting."],["b","**No provision** for future operating losses or for future repairs with no present obligation."],["ex","Example 19 – Warranty provision at expected value",["1,000 units were sold. Experience: 75% have no defects, 20% have minor defects costing 100 per unit to repair, 5% have major defects costing 400 per unit.","Provision = 1,000 × (0.20 × 100 + 0.05 × 400) = 1,000 × 40 = **40,000**."]],["ex","Example 20 – Decommissioning provision with unwinding of discount",["An oil platform with dismantling cost of 1,000,000 in 10 years, discount rate 8% (factor 0.4632) → initial provision 463,200, added to the asset’s cost.","Unwinding in year 1 = 463,200 × 8% = **37,056** finance expense, bringing the provision to 500,256."]]]}},{"title":"19) IAS 12 ضرائب الدخل","blocks":[["p","**الضريبة الجارية** = الضريبة المستحقة على الربح الضريبي للفترة. **الضريبة المؤجلة** تنشأ من **الفروق المؤقتة** بين القيمة الدفترية للأصل/الالتزام وأساسه الضريبي."],["t",["الحالة","النتيجة"],[["القيمة الدفترية للأصل > أساسه الضريبي","فرق مؤقت خاضع للضريبة ← التزام ضريبي مؤجل"],["القيمة الدفترية للأصل < أساسه الضريبي","فرق قابل للخصم ← أصل ضريبي مؤجل"],["القيمة الدفترية للالتزام > أساسه الضريبي (مثل مخصص يُخصم ضريبيًا عند السداد)","فرق قابل للخصم ← أصل ضريبي مؤجل"]],[5000,4638]],["b","الأصل الضريبي المؤجل يُعترف به فقط في حدود احتمال وجود أرباح ضريبية مستقبلية (الخسائر الضريبية المرحلة تحتاج دليلًا مقنعًا)."],["b","يُقاس بالمعدل المتوقع تطبيقه عند التحقق (المعدل الصادر أو الصادر فعليًا في نهاية الفترة)، **ولا يُخصم**."],["b","الضريبة المؤجلة تتبع البند: إعادة تقييم في OCI ← ضريبتها في OCI."],["b","في التجميع: فروق القيمة العادلة عند الاستحواذ تُنشئ ضريبة مؤجلة تؤثر على الشهرة؛ الأرباح غير المحققة في المخزون تُنشئ أصلًا ضريبيًا مؤجلًا. لا ضريبة مؤجلة على الاعتراف الأولي بالشهرة."],["b","استثناء الاعتراف الأولي لا ينطبق على المعاملات التي تنشئ فروقًا متساوية خاضعة وقابلة للخصم (تعديل 2021: الإيجارات والتزامات الإزالة)."],["b","استثناء Pillar Two: لا يُعترف ولا يُفصح عن ضرائب مؤجلة متعلقة بضريبة الحد الأدنى العالمية، مع إفصاح عن مصروف الضريبة الجارية الخاص بها."],["ex","مثال 21 – ضريبة مؤجلة على أصل ثابت وإعادة تقييم",["آلة قيمتها الدفترية 800,000 وأساسها الضريبي 600,000؛ معدل الضريبة 25%. ← فرق خاضع 200,000 ← التزام مؤجل **50,000**. لو كان الرصيد الافتتاحي 35,000، يُحمل 15,000 مصروف ضريبة مؤجلة في الأرباح والخسائر.","إعادة تقييم مبنى بزيادة 400,000 (المثال 7) وأساسه الضريبي لم يتغير ← التزام مؤجل 100,000 يُحمل على **OCI**: صافي فائض إعادة التقييم = 300,000."]],["je",[["فائض إعادة التقييم (OCI)","100,000",""],["التزام ضريبي مؤجل","","100,000"]]],["exam","نقطة امتحان",["الضريبة المؤجلة تظهر في كل امتحان تقريبًا كجزء من بند آخر (إعادة تقييم، تكاليف تطوير، مدفوعات على أساس الأسهم، التجميع، الخسائر المرحلة). موضوع \"متكرر جدًا\"."]]],"en":{"title":"19) IAS 12 Income Taxes","blocks":[["p","**Current tax** = tax payable on the taxable profit for the period. **Deferred tax** arises from **temporary differences** between the carrying amount of an asset/liability and its tax base."],["t",["Situation","Result"],[["Carrying amount of an asset > its tax base","Taxable temporary difference → deferred tax liability"],["Carrying amount of an asset < its tax base","Deductible difference → deferred tax asset"],["Carrying amount of a liability > its tax base (e.g., a provision deductible for tax when paid)","Deductible difference → deferred tax asset"]],[5000,4638]],["b","A deferred tax asset is recognized only to the extent it is probable that future taxable profits will be available (carried-forward tax losses need convincing evidence)."],["b","Measured at the rate expected to apply on realization (rates enacted or substantively enacted by the end of the period), **and not discounted**."],["b","Deferred tax follows the item: a revaluation in OCI → its tax in OCI."],["b","In consolidation: fair value differences on acquisition create deferred tax that affects goodwill; unrealized profits in inventory create a deferred tax asset. No deferred tax on the initial recognition of goodwill."],["b","The initial recognition exemption does not apply to transactions that create equal taxable and deductible differences (2021 amendment: leases and decommissioning obligations)."],["b","Pillar Two exception: deferred taxes related to the global minimum tax are neither recognized nor disclosed, with disclosure of the related current tax expense."],["ex","Example 21 – Deferred tax on a fixed asset and a revaluation",["A machine with a carrying amount of 800,000 and a tax base of 600,000; tax rate 25%. → Taxable difference 200,000 → deferred tax liability **50,000**. If the opening balance was 35,000, 15,000 is charged as deferred tax expense in profit or loss.","A building revaluation increase of 400,000 (Example 7) with an unchanged tax base → deferred tax liability of 100,000 charged to **OCI**: net revaluation surplus = 300,000."]],["je",[["Revaluation surplus (OCI)","100,000",""],["Deferred tax liability","","100,000"]]],["exam","Exam point",["Deferred tax appears in almost every exam as part of another item (revaluation, development costs, share-based payments, consolidation, carried-forward losses). A \"very frequently tested\" topic."]]]}},{"title":"20) IAS 19 مزايا العاملين","blocks":[["b","**مزايا قصيرة الأجل:** مصروف عند تقديم الخدمة (مثل الإجازات المتراكمة المدفوعة)."],["b","**خطط المساهمة المحددة:** المصروف = المساهمة المستحقة عن الفترة. لا مخاطر على المنشأة."],["b","**خطط المنافع المحددة:** المنشأة تتحمل المخاطر الاكتوارية والاستثمارية. صافي الالتزام = القيمة الحالية للالتزام – القيمة العادلة لأصول الخطة."],["t",["المكون","أين يُعترف به؟"],[["تكلفة الخدمة الجارية + تكلفة الخدمة السابقة + أرباح/خسائر التسوية","الأرباح والخسائر (تشغيلي)"],["صافي الفائدة على صافي الالتزام (سعر الخصم × صافي الالتزام الافتتاحي مع تعديل المساهمات والمدفوعات)","الأرباح والخسائر (فئة تمويلية وفق IFRS 18)"],["إعادة القياس: الأرباح والخسائر الاكتوارية + العائد على الأصول بخلاف الفائدة","الدخل الشامل الآخر (لا يُعاد تصنيفها)"]],[6000,3638]],["ex","مثال 22 – خطة منافع محددة",["الرصيد الافتتاحي: الالتزام 10,000، الأصول 8,000. سعر الخصم 10%. تكلفة الخدمة الجارية 1,200. المساهمات 1,000 والمنافع المدفوعة 700 (كلاهما في نهاية السنة). الرصيد الختامي وفق الخبير: الالتزام 11,800، الأصول 9,500."]],["t",["البند","الالتزام","الأصول"],[["الرصيد الافتتاحي","10,000","8,000"],["الفائدة 10%","1,000","800"],["تكلفة الخدمة الجارية","1,200","–"],["المساهمات","–","1,000"],["المنافع المدفوعة","(700)","(700)"],["!الرصيد قبل إعادة القياس","11,500","9,100"],["إعادة القياس (رقم متمم)","300 خسارة","400 ربح"],["!الرصيد الختامي","11,800","9,500"]],[4638,2500,2500]],["p","**النتيجة:** الأرباح والخسائر = 1,200 + صافي فائدة 200 = **1,400**. الدخل الشامل الآخر = ربح 400 – خسارة 300 = **ربح 100**. صافي الالتزام في المركز المالي = 11,800 – 9,500 = **2,300**. (تحقق: 2,000 + 1,400 – 100 – 1,000 = 2,300 ✓)"]],"en":{"title":"20) IAS 19 Employee Benefits","blocks":[["b","**Short-term benefits:** expensed as the service is rendered (e.g., accumulating paid absences)."],["b","**Defined contribution plans:** expense = contribution payable for the period. No risk for the entity."],["b","**Defined benefit plans:** the entity bears actuarial and investment risk. Net liability = present value of the obligation – fair value of plan assets."],["t",["Component","Where is it recognized?"],[["Current service cost + past service cost + gains/losses on settlement","Profit or loss (operating)"],["Net interest on the net liability (discount rate × opening net liability, adjusted for contributions and benefits paid)","Profit or loss (financing category under IFRS 18)"],["Remeasurements: actuarial gains and losses + return on assets excluding interest","Other comprehensive income (never reclassified)"]],[6000,3638]],["ex","Example 22 – A defined benefit plan",["Opening balances: obligation 10,000, assets 8,000. Discount rate 10%. Current service cost 1,200. Contributions 1,000 and benefits paid 700 (both at year end). Closing balances per the actuary: obligation 11,800, assets 9,500."]],["t",["Item","Obligation","Assets"],[["Opening balance","10,000","8,000"],["Interest 10%","1,000","800"],["Current service cost","1,200","–"],["Contributions","–","1,000"],["Benefits paid","(700)","(700)"],["!Balance before remeasurement","11,500","9,100"],["Remeasurement (balancing figure)","300 loss","400 gain"],["!Closing balance","11,800","9,500"]],[4638,2500,2500]],["p","**Result:** profit or loss = 1,200 + net interest 200 = **1,400**. Other comprehensive income = gain 400 – loss 300 = **gain of 100**. Net liability in the statement of financial position = 11,800 – 9,500 = **2,300**. (Check: 2,000 + 1,400 – 100 – 1,000 = 2,300 ✓)"]]}},{"title":"21) IFRS 2 المدفوعات على أساس الأسهم","blocks":[["t",["النوع","القياس","الجانب الدائن"],[["مسددة بأدوات حقوق ملكية (خيارات أسهم)","القيمة العادلة في **تاريخ المنح**، لا يُعاد قياسها","حقوق الملكية"],["مسددة نقدًا (حقوق ارتفاع قيمة الأسهم SARs)","القيمة العادلة في **كل تاريخ تقرير** حتى السداد","التزام"]],[3400,3838,2400]],["b","التكلفة توزع على فترة الاستحقاق. شروط الخدمة وشروط الأداء غير السوقية تؤثر على **عدد** الأدوات المتوقع استحقاقها. شروط السوق (مثل سعر السهم) مدرجة في القيمة العادلة في تاريخ المنح ولا يُعدل لها لاحقًا."],["ex","مثال 23 – خيارات أسهم للموظفين",["منحت شركة 100 خيار لكل من 100 موظف في 1/1/2027، بشرط البقاء 3 سنوات. القيمة العادلة للخيار في تاريخ المنح 15. في نهاية 2027 يُتوقع بقاء 90% من الموظفين، وفي نهاية 2028 يُتوقع 85%.","2027: 100 × 100 × 90% × 15 × 1/3 = **45,000** (مدين مصروف مزايا عاملين / دائن حقوق ملكية).","2028: الرصيد المتراكم = 100 × 100 × 85% × 15 × 2/3 = 85,000 ← مصروف 2028 = 85,000 – 45,000 = **40,000**."]],["p","**لو كانت حقوق نقدية (SARs):** نفس الحساب لكن باستخدام القيمة العادلة في نهاية كل سنة، ويُعترف بالتزام، وأي تغير في القيمة يُحمل على الأرباح والخسائر."]],"en":{"title":"21) IFRS 2 Share-based Payment","blocks":[["t",["Type","Measurement","Credit side"],[["Equity-settled (share options)","Fair value at **grant date**, not remeasured","Equity"],["Cash-settled (share appreciation rights, SARs)","Fair value at **each reporting date** until settlement","Liability"]],[3400,3838,2400]],["b","The cost is spread over the vesting period. Service conditions and non-market performance conditions affect the **number** of instruments expected to vest. Market conditions (such as share price) are included in the grant-date fair value and are not adjusted for later."],["ex","Example 23 – Employee share options",["On 1/1/2027 a company granted 100 options to each of 100 employees, conditional on staying 3 years. Fair value per option at grant date was 15. At the end of 2027, 90% of employees are expected to stay; at the end of 2028, 85%.","2027: 100 × 100 × 90% × 15 × 1/3 = **45,000** (Dr employee benefits expense / Cr equity).","2028: cumulative balance = 100 × 100 × 85% × 15 × 2/3 = 85,000 → 2028 expense = 85,000 – 45,000 = **40,000**."]],["p","**If they were cash rights (SARs):** the same calculation but using fair value at the end of each year, a liability is recognized, and any change in value is charged to profit or loss."]]}},{"title":"22) IAS 21 آثار التغيرات في أسعار صرف العملات الأجنبية","blocks":[["p","**العملة الوظيفية:** عملة البيئة الاقتصادية الرئيسية (تتحدد بالعملة التي تؤثر على الأسعار والتكاليف، وعملة التمويل والتحصيلات). **عملة العرض:** التي تُعرض بها القوائم."],["h3","المعاملات بالعملة الأجنبية"],["b","الاعتراف الأولي: بسعر الصرف الفوري في تاريخ المعاملة (أو متوسط تقريبي)."],["b","في نهاية الفترة: **البنود النقدية** (نقدية، مدينون، دائنون، قروض) بسعر الإقفال والفروق في الأرباح والخسائر. **البنود غير النقدية** بالتكلفة التاريخية تبقى بالسعر التاريخي؛ وغير النقدية بالقيمة العادلة بسعر تاريخ تحديد القيمة العادلة."],["ex","مثال 24 – شراء بالدولار",["شركة عملتها الوظيفية الجنيه المصري اشترت بضاعة بـ 10,000 دولار آجلًا في 1/11/2027 (السعر 48 جنيه/دولار). في 31/12/2027 السعر 50، وتم السداد في 15/1/2028 بسعر 49.","1/11: مخزون / دائنون 480,000. 31/12: الدائنون = 500,000 ← خسارة صرف **20,000**. 15/1: السداد 490,000 ← ربح صرف **10,000**. المخزون يبقى 480,000 (بند غير نقدي)."]],["h3","ترجمة القوائم المالية لعملية أجنبية (في التجميع)"],["b","الأصول والالتزامات (بما فيها الشهرة وتعديلات القيمة العادلة) ← سعر الإقفال."],["b","الإيرادات والمصروفات ← سعر تاريخ المعاملة أو المتوسط."],["b","فروق الترجمة ← OCI (احتياطي الترجمة)، يُوزع جزء منها على الحصة غير المسيطرة، ويُعاد تصنيفه للأرباح والخسائر عند الاستبعاد."],["new","تحديثات IAS 21",["**عدم قابلية التبادل (سارٍ من 2025):** العملة غير قابلة للتبادل إذا لم تستطع المنشأة الحصول على العملة الأخرى خلال إطار زمني إداري معتاد ومن خلال آلية تنشئ حقوقًا والتزامات واجبة النفاذ. عندها تقدّر سعرًا فوريًا يعكس السعر الذي كان سيتم به التبادل بين مشاركين في السوق، مع إفصاحات عن المخاطر والأثر.","**الترجمة لعملة عرض ذات تضخم مفرط (سارٍ من 2027):** المنشأة ذات العملة الوظيفية غير التضخمية التي تعرض بعملة اقتصاد ذي تضخم مفرط تترجم كل البنود (بما فيها المقارنة) بسعر الإقفال لأحدث مركز مالي."]]],"en":{"title":"22) IAS 21 The Effects of Changes in Foreign Exchange Rates","blocks":[["p","**Functional currency:** the currency of the primary economic environment (determined by the currency that influences prices and costs, and the currency of financing and receipts). **Presentation currency:** the currency in which the statements are presented."],["h3","Foreign currency transactions"],["b","Initial recognition: at the spot rate on the transaction date (or an approximate average)."],["b","At the end of the period: **monetary items** (cash, receivables, payables, loans) at the closing rate, with differences in profit or loss. **Non-monetary items** at historical cost stay at the historical rate; non-monetary items at fair value at the rate when fair value was determined."],["ex","Example 24 – A purchase in dollars",["A company with functional currency Egyptian pounds bought goods for 10,000 dollars on credit on 1/11/2027 (rate 48 EGP/$). On 31/12/2027 the rate is 50, and payment was made on 15/1/2028 at 49.","1/11: inventory / payables 480,000. 31/12: payables = 500,000 → exchange loss **20,000**. 15/1: payment 490,000 → exchange gain **10,000**. Inventory stays at 480,000 (a non-monetary item)."]],["h3","Translating the financial statements of a foreign operation (on consolidation)"],["b","Assets and liabilities (including goodwill and fair value adjustments) → closing rate."],["b","Income and expenses → transaction-date rate or the average rate."],["b","Translation differences → OCI (translation reserve), with part allocated to NCI, and reclassified to profit or loss on disposal."],["new","IAS 21 updates",["**Lack of exchangeability (effective from 2025):** a currency is not exchangeable if the entity cannot obtain the other currency within a normal administrative time frame and through a market or exchange mechanism that creates enforceable rights and obligations. The entity then estimates a spot rate reflecting the rate at which an orderly exchange would take place between market participants, with disclosures of the risks and effects.","**Translation to a hyperinflationary presentation currency (effective from 2027):** an entity with a non-hyperinflationary functional currency that presents in the currency of a hyperinflationary economy translates all items (including comparatives) at the closing rate of the most recent statement of financial position."]]]}},{"title":"23) IAS 29 التقرير المالي في الاقتصادات ذات التضخم المفرط (مختصر)","blocks":[["p","إذا كانت العملة الوظيفية لاقتصاد ذي تضخم مفرط (من المؤشرات: تراكم التضخم على 3 سنوات يقارب أو يتجاوز 100%)، تُعاد صياغة القوائم بوحدة القياس الجارية في نهاية الفترة باستخدام مؤشر أسعار عام. البنود النقدية لا تعدل؛ البنود غير النقدية تعدل بالمؤشر؛ ويُعترف بأرباح أو خسائر المركز النقدي في الأرباح والخسائر."]],"en":{"title":"23) IAS 29 Financial Reporting in Hyperinflationary Economies (summary)","blocks":[["p","If the functional currency is that of a hyperinflationary economy (indicators include cumulative inflation over 3 years approaching or exceeding 100%), the statements are restated in the measuring unit current at the end of the period using a general price index. Monetary items are not restated; non-monetary items are restated by the index; and the gain or loss on the net monetary position is recognized in profit or loss."]]}}],"intro":[],"en":{"title":"Part 4: Liabilities, Revenue, Taxes and Employees","intro":[]}},{"title":"الجزء الخامس: الأدوات المالية","lessons":[{"title":"24) IAS 32 الأدوات المالية: العرض","blocks":[["p","**المبدأ:** الجوهر لا الشكل. الأداة **التزام** إذا تضمنت التزامًا تعاقديًا بتسليم نقدية أو أصل مالي (مثل الأسهم الممتازة القابلة للاسترداد الإلزامي أو بتوزيعات إلزامية) أو التسوية بعدد متغير من أسهم المنشأة. وهي **حقوق ملكية** إذا لم يوجد هذا الالتزام (مثل الأسهم العادية، والأسهم الممتازة غير القابلة للاسترداد بتوزيعات تقديرية)."],["b","**الأدوات المركبة (السندات القابلة للتحويل):** تُفصل إلى مكون التزام = القيمة الحالية للتدفقات مخصومة بسعر سند مماثل بدون خيار تحويل، ومكون حقوق ملكية = الباقي."],["b","الفوائد والتوزيعات على أداة مصنفة التزامًا ← مصروف؛ وعلى أداة حقوق ملكية ← تخفيض لحقوق الملكية. أسهم الخزينة تُخصم من حقوق الملكية ولا ربح/خسارة على تداولها."],["b","المقاصة بين أصل والتزام ماليين فقط عند وجود حق قانوني نافذ حاليًا ونية التسوية بالصافي أو بالتزامن."],["ex","مثال 25 – سند قابل للتحويل",["أصدرت شركة في 1/1/2027 سندات بقيمة اسمية 2,000,000 بالقيمة الاسمية، فائدة 4% سنويًا تدفع في نهاية السنة، مدة 3 سنوات، قابلة للتحويل لأسهم. سعر الفائدة لسندات مماثلة غير قابلة للتحويل 6%.","معاملات الخصم 6%: سنة 1 = 0.9434، سنة 2 = 0.8900، سنة 3 = 0.8396.","القيمة الحالية للفوائد = 80,000 × (0.9434 + 0.8900 + 0.8396) = 80,000 × 2.6730 = 213,840.","القيمة الحالية للأصل = 2,000,000 × 0.8396 = 1,679,200 ← **مكون الالتزام = 1,893,040**، **مكون حقوق الملكية = 106,960**.","مصروف التمويل 2027 = 1,893,040 × 6% = **113,582** (وليس 80,000 المدفوعة)، والالتزام في نهاية 2027 = 1,893,040 + 113,582 – 80,000 = **1,926,622**."]],["je",[["النقدية","2,000,000",""],["التزام مالي – سندات","","1,893,040"],["حقوق ملكية – خيار التحويل","","106,960"]]]],"en":{"title":"24) IAS 32 Financial Instruments: Presentation","blocks":[["p","**Principle:** substance over form. An instrument is a **liability** if it contains a contractual obligation to deliver cash or another financial asset (such as mandatorily redeemable preference shares or ones with mandatory dividends) or to settle in a variable number of the entity’s own shares. It is **equity** if no such obligation exists (such as ordinary shares, and non-redeemable preference shares with discretionary dividends)."],["b","**Compound instruments (convertible bonds):** split into a liability component = present value of cash flows discounted at the rate for a similar bond without the conversion option, and an equity component = the residual."],["b","Interest and dividends on an instrument classified as a liability → expense; on an equity instrument → a reduction of equity. Treasury shares are deducted from equity, with no gain or loss on their trading."],["b","A financial asset and liability are offset only when there is a currently legally enforceable right and an intention to settle net or simultaneously."],["ex","Example 25 – A convertible bond",["On 1/1/2027 a company issued bonds with a nominal value of 2,000,000 at par, interest 4% per year paid at year end, term 3 years, convertible into shares. The interest rate on similar non-convertible bonds is 6%.","Discount factors at 6%: year 1 = 0.9434, year 2 = 0.8900, year 3 = 0.8396.","PV of interest = 80,000 × (0.9434 + 0.8900 + 0.8396) = 80,000 × 2.6730 = 213,840.","PV of principal = 2,000,000 × 0.8396 = 1,679,200 → **liability component = 1,893,040**, **equity component = 106,960**.","Finance cost for 2027 = 1,893,040 × 6% = **113,582** (not the 80,000 paid), and the liability at the end of 2027 = 1,893,040 + 113,582 – 80,000 = **1,926,622**."]],["je",[["Cash","2,000,000",""],["Financial liability – bonds","","1,893,040"],["Equity – conversion option","","106,960"]]]]}},{"title":"25) IFRS 9 الأدوات المالية","blocks":[["h3","أولًا: تصنيف الأصول المالية"],["t",["الفئة","الشروط","القياس اللاحق"],[["التكلفة المستهلكة","نموذج أعمال هدفه الاحتفاظ لتحصيل التدفقات التعاقدية + التدفقات أصل وفائدة فقط (SPPI)","طريقة الفائدة الفعلية – خسائر ائتمان متوقعة"],["القيمة العادلة من خلال الدخل الشامل الآخر (أدوات دين)","نموذج الاحتفاظ للتحصيل **والبيع** + SPPI","قيمة عادلة؛ الفائدة والخسائر الائتمانية في الأرباح والخسائر؛ باقي التغير في OCI **ويُعاد تصنيفه** عند الاستبعاد"],["القيمة العادلة من خلال الدخل الشامل الآخر (أدوات حقوق ملكية)","اختيار نهائي غير قابل للإلغاء عند الاعتراف الأولي لأسهم غير محتفظ بها للمتاجرة","التغيرات في OCI و**لا يُعاد تصنيفها** أبدًا؛ التوزيعات في الأرباح والخسائر"],["القيمة العادلة من خلال الأرباح والخسائر","كل ما عدا ذلك (المتاجرة، المشتقات، أسهم بدون اختيار) أو اختيار القيمة العادلة لتجنب عدم التطابق المحاسبي","قيمة عادلة، والتغيرات في الأرباح والخسائر؛ تكاليف المعاملة مصروف"]],[2800,3838,3000]],["p","**الالتزامات المالية:** بالتكلفة المستهلكة عادة، إلا المحتفظ بها للمتاجرة والمشتقات (القيمة العادلة من خلال الأرباح والخسائر). عند اختيار القيمة العادلة لالتزام، التغير الناتج عن مخاطر الائتمان الخاصة بالمنشأة يذهب لـ OCI."],["ex","مثال 26 – طريقة الفائدة الفعلية (أصل بالتكلفة المستهلكة)",["اشترت شركة سندًا في 1/1/2027 بمبلغ 1,000 (شاملًا تكاليف المعاملة)، قيمته الاسمية 1,250، فائدة اسمية 4.72% (59 سنويًا)، يستحق بعد 5 سنوات. سعر الفائدة الفعلي 10% تقريبًا."]],["t",["السنة","أول المدة","فائدة فعلية 10% (أرباح وخسائر)","النقدية المستلمة","آخر المدة"],[["1","1,000","100","(59)","1,041"],["2","1,041","104","(59)","1,086"],["3","1,086","109","(59)","1,136"],["4","1,136","113","(59)","1,190"],["5","1,190","119","(1,309)","0"]],[1300,1800,2738,2000,1800]],["p","الفروق الصغيرة بسبب التقريب. لاحظ أن الإيراد في قائمة الدخل هو الفائدة الفعلية وليس الكوبون."],["h3","ثانيًا: الانخفاض في القيمة – نموذج الخسائر الائتمانية المتوقعة (ECL)"],["t",["المرحلة","الحالة","المخصص","أساس احتساب الفائدة"],[["1","لا زيادة جوهرية في مخاطر الائتمان منذ الاعتراف الأولي","خسائر متوقعة لـ 12 شهرًا","إجمالي القيمة الدفترية"],["2","زيادة جوهرية في المخاطر (افتراض قابل للدحض: تأخر أكثر من 30 يومًا)","خسائر متوقعة على العمر","إجمالي القيمة الدفترية"],["3","أصل منخفض القيمة ائتمانيًا (افتراض: تأخر أكثر من 90 يومًا)","خسائر متوقعة على العمر","صافي القيمة (بعد المخصص)"]],[1000,4038,2300,2300]],["p","**المدخل المبسط:** للذمم التجارية وأصول العقود بدون مكون تمويل جوهري ← دائمًا خسائر العمر، ويُستخدم عادة \"مصفوفة مخصصات\"."],["ex","مثال 27 – مصفوفة مخصصات للعملاء",["غير مستحقة 100,000 × 1% = 1,000؛ متأخرة 1–30 يومًا 40,000 × 3% = 1,200؛ متأخرة 31–60 يومًا 20,000 × 10% = 2,000؛ أكثر من 60 يومًا 10,000 × 40% = 4,000.","المخصص المطلوب = **8,200**. لو كان الرصيد السابق 6,000 ← يُحمل 2,200 على الأرباح والخسائر (فئة تشغيلية)."]],["h3","ثالثًا: الاستبعاد ومحاسبة التحوط (مختصر)"],["b","**استبعاد الأصل المالي:** عند انتهاء الحقوق التعاقدية أو تحويل الأصل مع تحويل كل المخاطر والمنافع تقريبًا. بيع الذمم \"مع حق الرجوع\" (Factoring with recourse) لا يؤدي للاستبعاد ← المتحصل يُعالج كقرض."],["b","**التحوط:** تحوط القيمة العادلة (التغير في البند المتحوط له والأداة في الأرباح والخسائر)، تحوط التدفقات النقدية (الجزء الفعال في OCI ثم يعاد تصنيفه)، تحوط صافي الاستثمار في عملية أجنبية. شروط: تخصيص وتوثيق رسمي وعلاقة اقتصادية ونسبة تحوط مناسبة."],["new","تعديلات IFRS 9 و IFRS 7 السارية من 1 يناير 2026",["**تاريخ الاستبعاد:** الالتزام المالي يُستبعد في **تاريخ التسوية**، مع خيار سياسة محاسبية يسمح باستبعاد الالتزامات المسددة عبر نظام دفع إلكتروني قبل تاريخ التسوية بشروط (عدم القدرة على إلغاء التعليمات، وعدم القدرة العملية على استخدام النقد، ومخاطر التسوية ضئيلة).","**اختبار SPPI:** توضيح تقييم الأصول ذات الخصائص المرتبطة بأحداث محتملة (مثل قروض يتغير سعرها بتحقيق أهداف بيئية ESG)، والأصول \"غير ذات حق الرجوع\" والأدوات المرتبطة تعاقديًا.","**إفصاحات جديدة:** لأدوات حقوق الملكية المخصصة بـ FVOCI، وللأدوات ذات الشروط التي قد تغير التدفقات بسبب أحداث محتملة.","**عقود الكهرباء المعتمدة على الطبيعة:** تيسيرات لتطبيق استثناء \"الاستخدام الخاص\" ومحاسبة التحوط على عقود شراء الطاقة المتجددة."]]],"en":{"title":"25) IFRS 9 Financial Instruments","blocks":[["h3","First: classification of financial assets"],["t",["Category","Conditions","Subsequent measurement"],[["Amortized cost","Business model to hold to collect contractual cash flows + cash flows are solely payments of principal and interest (SPPI)","Effective interest method – expected credit losses"],["Fair value through OCI (debt instruments)","Business model to hold to collect **and sell** + SPPI","Fair value; interest and credit losses in profit or loss; the rest of the change in OCI **and reclassified** on derecognition"],["Fair value through OCI (equity instruments)","An irrevocable election at initial recognition for shares not held for trading","Changes in OCI and **never reclassified**; dividends in profit or loss"],["Fair value through profit or loss","Everything else (trading, derivatives, shares without the election) or the fair value option to avoid an accounting mismatch","Fair value, with changes in profit or loss; transaction costs expensed"]],[2800,3838,3000]],["p","**Financial liabilities:** usually at amortized cost, except those held for trading and derivatives (fair value through profit or loss). If the fair value option is elected for a liability, the change due to the entity’s own credit risk goes to OCI."],["ex","Example 26 – Effective interest method (asset at amortized cost)",["On 1/1/2027 a company bought a bond for 1,000 (including transaction costs), nominal value 1,250, coupon 4.72% (59 per year), maturing in 5 years. The effective interest rate is approximately 10%."]],["t",["Year","Opening","Effective interest 10% (P/L)","Cash received","Closing"],[["1","1,000","100","(59)","1,041"],["2","1,041","104","(59)","1,086"],["3","1,086","109","(59)","1,136"],["4","1,136","113","(59)","1,190"],["5","1,190","119","(1,309)","0"]],[1300,1800,2738,2000,1800]],["p","Small differences are due to rounding. Note that income in the income statement is the effective interest, not the coupon."],["h3","Second: impairment – the expected credit loss (ECL) model"],["t",["Stage","Situation","Allowance","Basis for interest"],[["1","No significant increase in credit risk since initial recognition","12-month expected credit losses","Gross carrying amount"],["2","Significant increase in risk (rebuttable presumption: more than 30 days past due)","Lifetime expected credit losses","Gross carrying amount"],["3","Credit-impaired asset (presumption: more than 90 days past due)","Lifetime expected credit losses","Net carrying amount (after allowance)"]],[1000,4038,2300,2300]],["p","**Simplified approach:** for trade receivables and contract assets without a significant financing component → always lifetime losses, usually using a \"provision matrix\"."],["ex","Example 27 – A provision matrix for customers",["Not yet due 100,000 × 1% = 1,000; 1–30 days past due 40,000 × 3% = 1,200; 31–60 days 20,000 × 10% = 2,000; more than 60 days 10,000 × 40% = 4,000.","Required allowance = **8,200**. If the previous balance was 6,000 → 2,200 is charged to profit or loss (operating category)."]],["h3","Third: derecognition and hedge accounting (summary)"],["b","**Derecognition of a financial asset:** when contractual rights expire, or the asset is transferred with substantially all risks and rewards. Factoring receivables \"with recourse\" does not lead to derecognition → the proceeds are treated as a loan."],["b","**Hedging:** fair value hedges (changes in the hedged item and the instrument in profit or loss), cash flow hedges (the effective portion in OCI, then reclassified), hedges of a net investment in a foreign operation. Conditions: formal designation and documentation, an economic relationship, and an appropriate hedge ratio."],["new","IFRS 9 and IFRS 7 amendments effective from 1 January 2026",["**Derecognition date:** a financial liability is derecognized on the **settlement date**, with an accounting policy choice to derecognize liabilities settled through an electronic payment system before the settlement date if conditions are met (no ability to cancel the instruction, no practical ability to access the cash, and insignificant settlement risk).","**SPPI test:** clarification on assessing assets with features linked to contingent events (such as loans whose rate changes on meeting ESG targets), non-recourse assets and contractually linked instruments.","**New disclosures:** for equity instruments designated at FVOCI, and for instruments with terms that could change cash flows due to contingent events.","**Nature-dependent electricity contracts:** relief in applying the \"own-use\" exception and hedge accounting to renewable power purchase contracts."]]]}},{"title":"26) IFRS 7 الأدوات المالية: الإفصاحات (مختصر)","blocks":[["p","إفصاحات عن أهمية الأدوات المالية للمركز المالي والأداء، وطبيعة ومدى المخاطر: مخاطر الائتمان (بما فيها تسوية مخصص ECL)، مخاطر السيولة (تحليل الاستحقاقات)، مخاطر السوق (تحليل الحساسية)، والتحويلات التي لا تؤدي لاستبعاد."]],"en":{"title":"26) IFRS 7 Financial Instruments: Disclosures (summary)","blocks":[["p","Disclosures about the significance of financial instruments for financial position and performance, and the nature and extent of risks: credit risk (including a reconciliation of the ECL allowance), liquidity risk (maturity analysis), market risk (sensitivity analysis), and transfers that do not result in derecognition."]]}}],"intro":[],"en":{"title":"Part 5: Financial Instruments","intro":[]}},{"title":"الجزء السادس: القوائم المالية المجمعة والاستثمارات","lessons":[{"title":"27) IFRS 10 القوائم المالية المجمعة + IAS 27 القوائم المنفصلة","blocks":[["p","**السيطرة** = ثلاثة عناصر معًا: (1) سلطة على المنشأة المستثمر فيها (حقوق قائمة تمنح القدرة الحالية على توجيه الأنشطة ذات الصلة)، (2) التعرض لعوائد متغيرة أو الحق فيها، (3) القدرة على استخدام السلطة للتأثير على العوائد. يمكن وجود سيطرة بأقل من 50% (سيطرة فعلية De facto، اتفاقيات، حقوق تصويت محتملة جوهرية)."],["b","**إجراءات التجميع:** جمع البنود المتشابهة، استبعاد تكلفة الاستثمار مقابل حصة الأم في حقوق الملكية وإثبات الشهرة، استبعاد الأرصدة والمعاملات داخل المجموعة والأرباح غير المحققة بالكامل، توحيد السياسات والتواريخ (فرق 3 أشهر كحد أقصى مع التعديل)."],["b","**تغيرات الملكية دون فقدان السيطرة:** معاملات حقوق ملكية؛ الفرق بين المدفوع والتعديل في الحصة غير المسيطرة يُثبت مباشرة في حقوق الملكية (لا أرباح أو خسائر، ولا تعديل للشهرة)."],["b","**فقدان السيطرة:** استبعاد أصول والتزامات التابعة والشهرة والحصة غير المسيطرة، قياس أي حصة متبقية بالقيمة العادلة، والاعتراف بالربح/الخسارة في الأرباح والخسائر، وإعادة تصنيف بنود OCI القابلة لذلك (مثل احتياطي الترجمة)."],["b","**IAS 27:** في القوائم المنفصلة للأم، الاستثمارات في التابعة والشقيقة والمشروعات المشتركة بالتكلفة أو وفق IFRS 9 أو بطريقة حقوق الملكية."]],"en":{"title":"27) IFRS 10 Consolidated Financial Statements + IAS 27 Separate Financial Statements","blocks":[["p","**Control** = three elements together: (1) power over the investee (existing rights giving the current ability to direct the relevant activities), (2) exposure, or rights, to variable returns, (3) the ability to use power to affect returns. Control can exist with less than 50% (de facto control, agreements, substantive potential voting rights)."],["b","**Consolidation procedures:** combine like items, eliminate the cost of investment against the parent’s share of equity and recognize goodwill, eliminate intra-group balances, transactions and unrealized profits in full, and align policies and reporting dates (maximum 3-month difference, with adjustments)."],["b","**Changes in ownership without loss of control:** equity transactions; the difference between consideration paid and the adjustment to NCI is recognized directly in equity (no gain or loss, and no adjustment to goodwill)."],["b","**Loss of control:** derecognize the subsidiary’s assets, liabilities, goodwill and NCI, measure any retained interest at fair value, recognize the gain/loss in profit or loss, and reclassify recyclable OCI items (such as the translation reserve)."],["b","**IAS 27:** in the parent’s separate financial statements, investments in subsidiaries, associates and joint ventures are measured at cost, under IFRS 9, or using the equity method."]]}},{"title":"28) IFRS 3 تجميع الأعمال","blocks":[["p","طريقة الاستحواذ: (1) تحديد المستحوذ، (2) تحديد تاريخ الاستحواذ، (3) الاعتراف بالأصول المقتناة والالتزامات المتحملة بالقيمة العادلة (بما فيها الأصول غير الملموسة غير المعترف بها لدى المستحوذ عليه والالتزامات المحتملة إذا كانت التزامًا حاليًا يمكن قياسه)، (4) الاعتراف بالشهرة أو ربح الشراء بسعر مغرٍ."],["p","**الشهرة** = العوض المحول (بالقيمة العادلة) + الحصة غير المسيطرة + القيمة العادلة لأي حصة سابقة – صافي الأصول القابلة للتحديد بالقيمة العادلة."],["t",["عنصر العوض","المعالجة"],[["النقدية","بالقيمة المدفوعة"],["العوض المؤجل","القيمة الحالية؛ فك الخصم بعد الاستحواذ مصروف تمويلي"],["العوض المحتمل","القيمة العادلة في تاريخ الاستحواذ (حتى لو غير محتمل)؛ التغيرات اللاحقة لأحداث بعد الاستحواذ ← الأرباح والخسائر (إذا كان التزامًا)"],["الأسهم المصدرة","القيمة العادلة في تاريخ الاستحواذ"],["تكاليف الاستحواذ (قانونية، استشارية)","**مصروف** في الأرباح والخسائر؛ تكاليف إصدار الأسهم تُخصم من حقوق الملكية"],["تكاليف إعادة هيكلة يخطط لها المستحوذ","لا تُعترف كالتزام في تاريخ الاستحواذ"]],[3200,6438]],["b","**قياس الحصة غير المسيطرة:** بالقيمة العادلة (شهرة كاملة) أو بنسبتها من صافي الأصول القابلة للتحديد (شهرة جزئية) – اختيار لكل عملية."],["b","**فترة القياس:** حتى 12 شهرًا من تاريخ الاستحواذ لتعديل القيم المؤقتة بمعلومات عن ظروف كانت قائمة في تاريخ الاستحواذ ← تعديل الشهرة بأثر رجعي."],["b","**الاستحواذ على مراحل:** الحصة السابقة يُعاد قياسها بالقيمة العادلة في تاريخ السيطرة والفرق في الأرباح والخسائر."],["ex","مثال 28 – حساب الشهرة وقائمة المركز المالي المجمعة (سؤال تجميع متكامل)",["استحوذت P على 80% من S في 1/1/2027. العوض: نقدًا 1,000,000 + مبلغ 242,000 يُدفع في 1/1/2029 (معدل خصم 10% ← القيمة الحالية 200,000) + عوض محتمل قيمته العادلة 50,000. تكاليف قانونية 30,000.","حقوق ملكية S في تاريخ الاستحواذ: رأس المال 500,000 + أرباح محتجزة 400,000 = 900,000. القيمة العادلة لأرض S تزيد عن قيمتها الدفترية بـ 100,000. الحصة غير المسيطرة تقاس بالقيمة العادلة 260,000.","خلال 2027: ربح S = 200,000. باعت P إلى S بضاعة بـ 100,000 بهامش 25% على التكلفة، بقي منها 40% في مخزون S. في 31/12/2027 القيمة العادلة للعوض المحتمل 70,000. انخفاض قيمة الشهرة 30,000. الأرباح المحتجزة لـ P في 31/12/2027 (قبل أي تعديلات) = 3,000,000. (تجاهل الضرائب.)"]],["h3","الحل خطوة بخطوة"],["t",["(1) الشهرة","المبلغ"],[["النقدية","1,000,000"],["العوض المؤجل (القيمة الحالية)","200,000"],["العوض المحتمل","50,000"],["!إجمالي العوض","1,250,000"],["الحصة غير المسيطرة بالقيمة العادلة","260,000"],["ناقص: صافي الأصول بالقيمة العادلة (900,000 + 100,000)","(1,000,000)"],["!الشهرة في تاريخ الاستحواذ","510,000"],["انخفاض القيمة","(30,000)"],["!الشهرة في 31/12/2027","480,000"]],[6638,3000]],["p","**تكاليف الاستحواذ 30,000** مصروف في P (مفترض أنها محملة ضمن الأرباح المحتجزة البالغة 3,000,000)."],["t",["(2) الربح غير المحقق في المخزون (URP)","المبلغ"],[["الربح في المبيعات = 100,000 × 25/125","20,000"],["!المتبقي في المخزون 40%","8,000"]],[6638,3000]],["p","البائع هو الأم ← يُخصم الـ 8,000 بالكامل من الأرباح المحتجزة للمجموعة ومن المخزون المجمع. (لو كانت التابعة هي البائع، يُوزع 80/20 بين المجموعة والحصة غير المسيطرة.) كما تُستبعد المبيعات والمشتريات المتبادلة 100,000 بالكامل من قائمة الدخل المجمعة."],["t",["(3) الحصة غير المسيطرة في 31/12/2027","المبلغ"],[["القيمة العادلة في تاريخ الاستحواذ","260,000"],["20% × أرباح ما بعد الاستحواذ 200,000","40,000"],["20% × انخفاض الشهرة 30,000","(6,000)"],["!الإجمالي","294,000"]],[6638,3000]],["t",["(4) الأرباح المحتجزة المجمعة","المبلغ"],[["أرباح P المحتجزة","3,000,000"],["80% × أرباح S بعد الاستحواذ 200,000","160,000"],["الربح غير المحقق (URP)","(8,000)"],["فك خصم العوض المؤجل 200,000 × 10%","(20,000)"],["زيادة القيمة العادلة للعوض المحتمل","(20,000)"],["80% × انخفاض الشهرة","(24,000)"],["!الإجمالي","3,088,000"]],[6638,3000]],["p","**في المركز المالي المجمع:** الالتزامات تشمل العوض المؤجل 220,000 والعوض المحتمل 70,000، والأرض تزيد بـ 100,000 عن مجموع الدفاتر، والمخزون ينقص 8,000، والشهرة 480,000."],["exam","نقطة امتحان",["سؤال التجميع هو السؤال الأول والأكبر وزنًا في DipIFR في معظم الدورات: إعداد قائمة مركز مالي مجمعة أو قائمة أرباح وخسائر ودخل شامل مجمعة أو قائمة تدفقات نقدية مجمعة، مع شركة شقيقة غالبًا، وتعديلات قيمة عادلة، وعوض مؤجل/محتمل، وأرباح غير محققة، وانخفاض شهرة، وأحيانًا تابعة أجنبية. موضوع \"متكرر جدًا – في كل امتحان تقريبًا\"."]]],"en":{"title":"28) IFRS 3 Business Combinations","blocks":[["p","The acquisition method: (1) identify the acquirer, (2) determine the acquisition date, (3) recognize the identifiable assets acquired and liabilities assumed at fair value (including intangibles not recognized by the acquiree and contingent liabilities if they are a present obligation that can be measured), (4) recognize goodwill or a gain on a bargain purchase."],["p","**Goodwill** = consideration transferred (at fair value) + NCI + fair value of any previously held interest – identifiable net assets at fair value."],["t",["Element of consideration","Treatment"],[["Cash","At the amount paid"],["Deferred consideration","Present value; unwinding after acquisition is a finance cost"],["Contingent consideration","Fair value at the acquisition date (even if not probable); later changes due to post-acquisition events → profit or loss (if a liability)"],["Shares issued","Fair value at the acquisition date"],["Acquisition costs (legal, advisory)","**Expensed** in profit or loss; share issue costs are deducted from equity"],["Restructuring costs planned by the acquirer","Not recognized as a liability at the acquisition date"]],[3200,6438]],["b","**Measuring NCI:** at fair value (full goodwill) or at its proportionate share of identifiable net assets (partial goodwill), chosen for each combination."],["b","**Measurement period:** up to 12 months from the acquisition date to adjust provisional amounts using information about conditions that existed at the acquisition date → goodwill adjusted retrospectively."],["b","**Step acquisition:** the previously held interest is remeasured to fair value at the date control is obtained, with the difference in profit or loss."],["ex","Example 28 – Calculating goodwill and the consolidated statement of financial position (an integrated consolidation question)",["P acquired 80% of S on 1/1/2027. Consideration: cash 1,000,000 + 242,000 payable on 1/1/2029 (discount rate 10% → present value 200,000) + contingent consideration with a fair value of 50,000. Legal costs 30,000.","S’s equity at the acquisition date: share capital 500,000 + retained earnings 400,000 = 900,000. The fair value of S’s land exceeds its carrying amount by 100,000. NCI is measured at fair value 260,000.","During 2027: S’s profit = 200,000. P sold goods to S for 100,000 at a markup of 25% on cost, of which 40% remains in S’s inventory. At 31/12/2027 the fair value of the contingent consideration is 70,000. Goodwill impairment 30,000. P’s retained earnings at 31/12/2027 (before any adjustments) = 3,000,000. (Ignore taxes.)"]],["h3","Step-by-step solution"],["t",["(1) Goodwill","Amount"],[["Cash","1,000,000"],["Deferred consideration (present value)","200,000"],["Contingent consideration","50,000"],["!Total consideration","1,250,000"],["NCI at fair value","260,000"],["Less: net assets at fair value (900,000 + 100,000)","(1,000,000)"],["!Goodwill at acquisition date","510,000"],["Impairment","(30,000)"],["!Goodwill at 31/12/2027","480,000"]],[6638,3000]],["p","**Acquisition costs of 30,000** are an expense in P (assumed already charged within the retained earnings of 3,000,000)."],["t",["(2) Unrealized profit in inventory (URP)","Amount"],[["Profit on sales = 100,000 × 25/125","20,000"],["!Remaining in inventory 40%","8,000"]],[6638,3000]],["p","The seller is the parent → the 8,000 is deducted in full from group retained earnings and from consolidated inventory. (If the subsidiary were the seller, it would be split 80/20 between the group and NCI.) Intra-group sales and purchases of 100,000 are also eliminated in full from the consolidated income statement."],["t",["(3) NCI at 31/12/2027","Amount"],[["Fair value at acquisition date","260,000"],["20% × post-acquisition profit 200,000","40,000"],["20% × goodwill impairment 30,000","(6,000)"],["!Total","294,000"]],[6638,3000]],["t",["(4) Consolidated retained earnings","Amount"],[["P’s retained earnings","3,000,000"],["80% × S’s post-acquisition profit 200,000","160,000"],["Unrealized profit (URP)","(8,000)"],["Unwinding of deferred consideration 200,000 × 10%","(20,000)"],["Increase in fair value of contingent consideration","(20,000)"],["80% × goodwill impairment","(24,000)"],["!Total","3,088,000"]],[6638,3000]],["p","**In the consolidated statement of financial position:** liabilities include deferred consideration of 220,000 and contingent consideration of 70,000, land is 100,000 higher than the sum of the books, inventory is 8,000 lower, and goodwill is 480,000."],["exam","Exam point",["The consolidation question is the first and highest-weighted question in DipIFR in most sittings: preparing a consolidated statement of financial position, a consolidated statement of profit or loss and OCI, or a consolidated statement of cash flows, usually with an associate, fair value adjustments, deferred/contingent consideration, unrealized profits, goodwill impairment, and sometimes a foreign subsidiary. \"Very frequently tested – in almost every exam\"."]]]}},{"title":"29) IAS 28 الاستثمارات في الشركات الشقيقة والمشروعات المشتركة","blocks":[["p","**الشركة الشقيقة:** للمستثمر **نفوذ مؤثر** (القدرة على المشاركة في القرارات المالية والتشغيلية دون سيطرة؛ افتراض قابل للدحض عند 20%–50%؛ مؤشرات: تمثيل في مجلس الإدارة، معاملات جوهرية، تبادل موظفين إداريين، معلومات فنية أساسية)."],["p","**طريقة حقوق الملكية:** الاستثمار بالتكلفة + الحصة في أرباح ما بعد الاقتناء + الحصة في OCI – التوزيعات المستلمة – انخفاض القيمة. الشهرة ضمنية داخل رصيد الاستثمار ولا تُختبر منفصلة."],["ex","مثال 29 – شركة شقيقة",["اشترت شركة 30% من A بمبلغ 600,000 في 1/1/2027. ربح A لسنة 2027 = 400,000، ووزعت 100,000. باعت الشركة المستثمرة لـ A بضاعة حققت فيها ربحًا 50,000 ما زالت كلها في مخزون A.","الحصة في الربح = 30% × 400,000 = 120,000. الأرباح غير المحققة = 30% × 50,000 = 15,000 (تُستبعد **حصة المستثمر فقط**).","الاستثمار في 31/12/2027 = 600,000 + 120,000 – 15,000 – 30,000 (توزيعات) = **675,000**. في قائمة الدخل: حصة في ربح شقيقة 105,000 (فئة استثمارية وفق IFRS 18)."]]],"en":{"title":"29) IAS 28 Investments in Associates and Joint Ventures","blocks":[["p","**Associate:** the investor has **significant influence** (the power to participate in financial and operating policy decisions without control; rebuttable presumption at 20%–50%; indicators: board representation, material transactions, interchange of managerial personnel, essential technical information)."],["p","**Equity method:** investment at cost + share of post-acquisition profit + share of OCI – dividends received – impairment. Goodwill is implicit within the investment balance and is not tested separately."],["ex","Example 29 – An associate",["A company bought 30% of A for 600,000 on 1/1/2027. A’s profit for 2027 = 400,000, and it paid dividends of 100,000. The investor sold goods to A at a profit of 50,000, all still in A’s inventory.","Share of profit = 30% × 400,000 = 120,000. Unrealized profit = 30% × 50,000 = 15,000 (only **the investor’s share** is eliminated).","Investment at 31/12/2027 = 600,000 + 120,000 – 15,000 – 30,000 (dividends) = **675,000**. In the income statement: share of profit of associate 105,000 (investing category under IFRS 18)."]]]}},{"title":"30) IFRS 11 الترتيبات المشتركة + IFRS 12 الإفصاح عن الحصص","blocks":[["p","**سيطرة مشتركة:** قرارات الأنشطة ذات الصلة تتطلب موافقة إجماعية من الأطراف المشتركة في السيطرة."],["t",["النوع","التعريف","المحاسبة"],[["عملية مشتركة","للأطراف حقوق في الأصول والتزامات عن الالتزامات (غالبًا بدون كيان منفصل)","كل طرف يعترف بحصته من الأصول والالتزامات والإيرادات والمصروفات"],["مشروع مشترك","للأطراف حقوق في صافي أصول الترتيب (كيان منفصل)","طريقة حقوق الملكية وفق IAS 28"]],[2200,4238,3200]],["p","**IFRS 12:** إفصاحات عن الأحكام الجوهرية في تحديد السيطرة أو السيطرة المشتركة أو النفوذ المؤثر، والحصص في التابعة (خاصة ذات الحصص غير المسيطرة الجوهرية)، والترتيبات المشتركة، والشركات الشقيقة، والمنشآت المهيكلة غير المجمعة."]],"en":{"title":"30) IFRS 11 Joint Arrangements + IFRS 12 Disclosure of Interests","blocks":[["p","**Joint control:** decisions about the relevant activities require the unanimous consent of the parties sharing control."],["t",["Type","Definition","Accounting"],[["Joint operation","The parties have rights to the assets and obligations for the liabilities (often without a separate vehicle)","Each party recognizes its share of assets, liabilities, revenue and expenses"],["Joint venture","The parties have rights to the net assets of the arrangement (a separate vehicle)","Equity method under IAS 28"]],[2200,4238,3200]],["p","**IFRS 12:** disclosures about significant judgements in determining control, joint control or significant influence, interests in subsidiaries (especially those with material NCI), joint arrangements, associates, and unconsolidated structured entities."]]}}],"intro":[],"en":{"title":"Part 6: Consolidated Financial Statements and Investments","intro":[]}},{"title":"الجزء السابع: معايير الإفصاح والمعايير الخاصة","lessons":[{"title":"31) IAS 33 ربحية السهم","blocks":[["p","**ربحية السهم الأساسية** = الربح المتاح لحملة الأسهم العادية (بعد توزيعات الأسهم الممتازة غير القابلة للاسترداد) ÷ المتوسط المرجح لعدد الأسهم العادية."],["t",["الحدث","المعالجة في المتوسط المرجح"],[["إصدار بسعر السوق الكامل","يُرجح بالفترة من تاريخ الإصدار"],["أسهم مجانية (Bonus) / تجزئة","كأنها كانت موجودة من بداية الفترة + إعادة عرض ربحية المقارنة"],["حقوق اكتتاب بأقل من سعر السوق (Rights issue)","معامل \"عنصر المنحة\" = سعر السوق قبل الحقوق ÷ السعر النظري بعد الحقوق (TERP)، يطبق على الفترة قبل الإصدار وعلى المقارنة"]],[4000,5638]],["ex","مثال 30 – إصدار حقوق اكتتاب",["أسهم قائمة 1,000,000 في 1/1/2027. في 1/4/2027 إصدار حقوق 1 لكل 4 بسعر 2، وسعر السوق قبل الإصدار 3. صافي الربح 1,500,000.","TERP = (4 × 3 + 1 × 2) ÷ 5 = 2.8 ← المعامل = 3 ÷ 2.8 = 1.0714.","المتوسط المرجح = 1,000,000 × 1.0714 × 3/12 + 1,250,000 × 9/12 = 267,857 + 937,500 = 1,205,357.","ربحية السهم = 1,500,000 ÷ 1,205,357 = **1.24**. ربحية سهم المقارنة تُعدل بضربها في 1 ÷ 1.0714."]],["ex","مثال 31 – ربحية السهم المخفضة",["صافي الربح 2,000,000؛ الأسهم 4,000,000. سندات قابلة للتحويل 1,000,000 بفائدة 5% (مصروف الفائدة 50,000) قابلة للتحويل إلى 400 سهم لكل 1,000؛ معدل الضريبة 25%.","الأساسية = 2,000,000 ÷ 4,000,000 = **0.50**.","المخففة: البسط = 2,000,000 + 50,000 × (1 – 25%) = 2,037,500؛ المقام = 4,000,000 + 400,000 = 4,400,000 ← **0.463** (مخففة لأنها أقل من 0.50).","خيارات الأسهم: الأسهم \"المجانية\" فقط تُضاف = عدد الخيارات × (1 – سعر الممارسة ÷ متوسط سعر السوق)."]]],"en":{"title":"31) IAS 33 Earnings per Share","blocks":[["p","**Basic EPS** = profit attributable to ordinary shareholders (after dividends on non-redeemable preference shares) ÷ weighted average number of ordinary shares."],["t",["Event","Treatment in the weighted average"],[["Issue at full market price","Weighted from the issue date"],["Bonus issue / share split","As if it existed from the start of the period + restate comparative EPS"],["Rights issue below market price","A \"bonus element\" factor = market price before the rights ÷ theoretical ex-rights price (TERP), applied to the period before the issue and to the comparative"]],[4000,5638]],["ex","Example 30 – A rights issue",["Shares outstanding 1,000,000 on 1/1/2027. On 1/4/2027 a 1-for-4 rights issue at 2, with a market price before the issue of 3. Net profit 1,500,000.","TERP = (4 × 3 + 1 × 2) ÷ 5 = 2.8 → factor = 3 ÷ 2.8 = 1.0714.","Weighted average = 1,000,000 × 1.0714 × 3/12 + 1,250,000 × 9/12 = 267,857 + 937,500 = 1,205,357.","EPS = 1,500,000 ÷ 1,205,357 = **1.24**. Comparative EPS is restated by multiplying by 1 ÷ 1.0714."]],["ex","Example 31 – Diluted EPS",["Net profit 2,000,000; shares 4,000,000. Convertible bonds of 1,000,000 at 5% (interest expense 50,000), convertible into 400 shares per 1,000; tax rate 25%.","Basic = 2,000,000 ÷ 4,000,000 = **0.50**.","Diluted: numerator = 2,000,000 + 50,000 × (1 – 25%) = 2,037,500; denominator = 4,000,000 + 400,000 = 4,400,000 → **0.463** (dilutive because it is below 0.50).","Share options: only the \"free\" shares are added = number of options × (1 – exercise price ÷ average market price)."]]]}},{"title":"32) IAS 24 الإفصاح عن الأطراف ذات العلاقة","blocks":[["p","الأطراف ذات العلاقة تشمل: الأشخاص (أو أقاربهم المقربون) الذين يسيطرون أو لديهم نفوذ مؤثر أو أعضاء الإدارة العليا، والمنشآت في نفس المجموعة، والشقيقة والمشروعات المشتركة، وخطط مزايا ما بعد الخدمة. **ليسوا أطرافًا ذات علاقة بمجرد:** ممول، نقابة، مرفق عام، جهة حكومية، عميل أو مورد رئيسي. يُفصح عن طبيعة العلاقة والمعاملات والأرصدة ومكافآت الإدارة العليا – حتى لو كانت بدون مقابل. السبب: المعاملات قد لا تكون بشروط السوق."]],"en":{"title":"32) IAS 24 Related Party Disclosures","blocks":[["p","Related parties include: persons (or their close family members) who have control, significant influence, or are key management personnel; entities in the same group; associates and joint ventures; and post-employment benefit plans. **Not related parties merely because they are:** a provider of finance, a trade union, a public utility, a government agency, or a major customer or supplier. Disclose the nature of the relationship, transactions, balances and key management compensation, even if no price is charged. The reason: transactions may not be on market terms."]]}},{"title":"33) IFRS 8 القطاعات التشغيلية","blocks":[["p","للشركات المدرجة. القطاع التشغيلي يحدده \"متخذ القرار التشغيلي الرئيسي\". يُفصح عن القطاع إذا بلغ 10% أو أكثر من الإيرادات المجمعة أو الأرباح (بالقيمة المطلقة) أو الأصول. يجب أن تغطي القطاعات المفصح عنها 75% على الأقل من الإيرادات الخارجية. المعلومات تُعرض كما تُرفع للإدارة مع تسوية لأرقام القوائم."]],"en":{"title":"33) IFRS 8 Operating Segments","blocks":[["p","For listed entities. An operating segment is identified by the \"chief operating decision maker\". A segment is reportable if it is 10% or more of combined revenue, profit (in absolute terms) or assets. Reportable segments must cover at least 75% of external revenue. Information is presented as reported to management, with a reconciliation to the financial statement figures."]]}},{"title":"34) IAS 34 التقارير المالية الأولية","blocks":[["p","الحد الأدنى: قوائم مختصرة وإيضاحات مختارة. نفس السياسات المحاسبية السنوية. الضريبة بالمعدل الفعلي المتوقع للسنة كاملة. الإيرادات الموسمية لا تُؤجل أو تُقدم."]],"en":{"title":"34) IAS 34 Interim Financial Reporting","blocks":[["p","The minimum: condensed statements and selected notes. The same accounting policies as the annual statements. Tax at the expected effective rate for the full year. Seasonal revenue is not deferred or anticipated."]]}},{"title":"35) IFRS 1 تطبيق المعايير الدولية لأول مرة","blocks":[["p","قائمة مركز مالي افتتاحية في تاريخ التحول، تطبيق المعايير السارية في نهاية أول فترة تقرير بأثر رجعي، مع استثناءات إلزامية (مثل التقديرات ومحاسبة التحوط) وإعفاءات اختيارية (مثل التكلفة المفترضة للأصول الثابتة، تجميعات الأعمال السابقة، فروق الترجمة المتراكمة). التحسينات السنوية المجلد 11 عدّلت IFRS 1 بخصوص محاسبة التحوط لدى المطبق لأول مرة."]],"en":{"title":"35) IFRS 1 First-time Adoption of IFRS","blocks":[["p","An opening statement of financial position at the transition date, retrospective application of the standards effective at the end of the first reporting period, with mandatory exceptions (such as estimates and hedge accounting) and optional exemptions (such as deemed cost for PPE, past business combinations, cumulative translation differences). Annual Improvements Volume 11 amended IFRS 1 regarding hedge accounting by a first-time adopter."]]}},{"title":"36) IFRS 17 عقود التأمين (مختصر)","blocks":[["p","النموذج العام (BBA): مجموعة العقود = التدفقات النقدية للوفاء (تقديرات التدفقات + الخصم + تعديل المخاطر غير المالية) + **هامش الخدمة التعاقدية (CSM)** الذي يمثل الربح غير المكتسب ويُعترف به على مدى فترة التغطية. العقود الخاسرة يُعترف بخسارتها فورًا. يوجد نهج مبسط (PAA) للعقود القصيرة ونهج الرسوم المتغيرة للعقود المشاركة."]],"en":{"title":"36) IFRS 17 Insurance Contracts (summary)","blocks":[["p","The general model (BBA): a group of contracts = fulfilment cash flows (estimates of cash flows + discounting + a risk adjustment for non-financial risk) + **the contractual service margin (CSM)**, which represents unearned profit and is recognized over the coverage period. Losses on onerous contracts are recognized immediately. There is a simplified approach (PAA) for short contracts and a variable fee approach for participating contracts."]]}},{"title":"37) IFRS 19 الشركات التابعة غير الخاضعة للمساءلة العامة (جديد – 2027)","blocks":[["p","معيار إفصاحات فقط: يسمح للتابعة المؤهلة بتطبيق متطلبات الاعتراف والقياس الكاملة لـ IFRS مع إفصاحات مخفضة. شروط الأهلية: أن تكون تابعة، وليست خاضعة للمساءلة العامة (أدواتها غير متداولة في سوق عام ولا تحتفظ بأصول بصفة ائتمانية كنشاط رئيسي مثل البنوك)، وأن تكون الأم النهائية أو الوسيطة تصدر قوائم مجمعة متاحة للعامة وفق IFRS."]],"en":{"title":"37) IFRS 19 Subsidiaries without Public Accountability (new – 2027)","blocks":[["p","A disclosure-only standard: it allows an eligible subsidiary to apply full IFRS recognition and measurement requirements with reduced disclosures. Eligibility: it is a subsidiary, it does not have public accountability (its instruments are not traded in a public market and it does not hold assets in a fiduciary capacity as a main business, like banks), and its ultimate or intermediate parent produces publicly available consolidated statements under IFRS."]]}},{"title":"38) IFRS 20 الأصول والالتزامات التنظيمية (صدر مايو 2026 – سريان 2029)","blocks":[["p","الشركات التي تحدد جهة تنظيمية أسعارها (مثل الكهرباء والمياه) يحق لها أحيانًا رفع الأسعار مستقبلًا لاسترداد تكاليف حالية (أصل تنظيمي) أو تلتزم بتخفيضها لرد مبالغ حصلتها (التزام تنظيمي). IFRS 20 يلزم بالاعتراف بهذه الأصول والالتزامات التنظيمية ليعكس الأداء الفعلي للفترة، ويحل محل IFRS 14."]],"en":{"title":"38) IFRS 20 Regulatory Assets and Regulatory Liabilities (issued May 2026 – effective 2029)","blocks":[["p","Entities whose prices are set by a regulator (such as electricity and water) are sometimes entitled to raise future prices to recover current costs (a regulatory asset) or are obliged to reduce them to return amounts already collected (a regulatory liability). IFRS 20 requires recognizing these regulatory assets and liabilities to reflect the period’s actual performance, and replaces IFRS 14."]]}},{"title":"39) معايير الاستدامة IFRS S1 و IFRS S2 (للعلم)","blocks":[["p","صادرة عن مجلس معايير الاستدامة الدولية (ISSB) وليست من معايير المحاسبة: S1 متطلبات عامة للإفصاح عن المخاطر والفرص المتعلقة بالاستدامة، وS2 الإفصاحات المتعلقة بالمناخ (بما فيها انبعاثات النطاقات 1 و2 و3). تطبيقها يعتمد على تبني كل دولة لها."]],"en":{"title":"39) Sustainability standards IFRS S1 and IFRS S2 (for awareness)","blocks":[["p","Issued by the International Sustainability Standards Board (ISSB), not accounting standards: S1 sets general requirements for disclosing sustainability-related risks and opportunities, and S2 covers climate-related disclosures (including Scope 1, 2 and 3 emissions). Their application depends on each jurisdiction’s adoption."]]}}],"intro":[],"en":{"title":"Part 7: Disclosure Standards and Specialized Standards","intro":[]}}],"exams":[{"title":"سؤال DipIFR (1) – قائمة أرباح وخسائر مجمعة مع استحواذ خلال السنة (تجميع)","tag":"مستوى التكرار: متكرر جدًا. هذا هو شكل السؤال الأول في معظم دورات DipIFR (قائمة أرباح وخسائر ودخل شامل مجمعة أو قائمة مركز مالي مجمعة) مع استحواذ في منتصف السنة وشركة شقيقة وأرباح غير محققة وانخفاض شهرة.","q":["استحوذت شركة \"ألفا\" على 75% من \"بيتا\" في 1/4/2027. السنة المالية تنتهي 31/12/2027. الأرقام بالآلاف:","ألفا: إيرادات 8,000؛ تكلفة مبيعات 5,000؛ مصروفات تشغيلية 1,000؛ تكاليف تمويل 200؛ ضريبة 450.","بيتا (للسنة كاملة، تتحقق بانتظام): إيرادات 4,800؛ تكلفة مبيعات 3,000؛ مصروفات تشغيلية 600؛ تكاليف تمويل 80؛ ضريبة 280.","(1) في تاريخ الاستحواذ كانت القيمة العادلة لآلات بيتا تزيد بـ 400 عن قيمتها الدفترية، والعمر المتبقي 5 سنوات (الإهلاك ضمن تكلفة المبيعات).","(2) بعد الاستحواذ باعت ألفا لبيتا بضاعة بـ 600 بهامش ربح 20% على سعر البيع، وبقي ثلثها في مخزون بيتا.","(3) انخفاض قيمة الشهرة في 31/12/2027 = 50 (الحصة غير المسيطرة مقاسة بالقيمة العادلة؛ الانخفاض ضمن المصروفات التشغيلية).","(4) تمتلك ألفا 30% من شركة شقيقة \"جاما\" منذ سنوات، وربح جاما للسنة 500.","المطلوب: إعداد قائمة الأرباح والخسائر المجمعة وفق IFRS 18، وتوزيع الربح بين ملاك الأم والحصة غير المسيطرة."],"sol":[["h3","الحل"],["p","**الخطوة 1 – تجميع بيتا من تاريخ الاستحواذ فقط (9/12):** إيرادات 3,600؛ تكلفة مبيعات 2,250؛ مصروفات 450؛ تمويل 60؛ ضريبة 210."],["p","**الخطوة 2 – التعديلات:** إهلاك إضافي = 400 ÷ 5 × 9/12 = 60. الربح غير المحقق = 600 × 20% × 1/3 = 40 (البائع الأم). استبعاد المبيعات المتبادلة 600 من الإيرادات وتكلفة المبيعات."],["t",["البند","الحساب","المبلغ"],[["الإيرادات","8,000 + 3,600 – 600","11,000"],["تكلفة المبيعات","5,000 + 2,250 – 600 + 40 + 60","(6,750)"],["!مجمل الربح","","4,250"],["المصروفات التشغيلية","1,000 + 450 + 50","(1,500)"],["!الربح التشغيلي","","2,750"],["حصة في ربح شقيقة","30% × 500","150"],["!الربح قبل التمويل وضرائب الدخل","","2,900"],["تكاليف التمويل","200 + 60","(260)"],["!الربح قبل الضريبة","","2,640"],["ضريبة الدخل","450 + 210","(660)"],["!صافي ربح السنة","","1,980"]],[3600,3638,2400]],["p","**الخطوة 3 – الحصة غير المسيطرة:** ربح بيتا بعد الاستحواذ = 3,600 – 2,250 – 450 – 60 – 210 = 630 – إهلاك إضافي 60 – انخفاض الشهرة 50 = 520 × 25% = **130**. (الربح غير المحقق لا يؤثر على الحصة غير المسيطرة لأن البائع هو الأم.)"],["p","**الخطوة 4 – التوزيع:** ملاك الأم = 1,980 – 130 = **1,850**؛ الحصة غير المسيطرة = **130**."],["note","أخطاء شائعة يخصم عليها المصحح",["تجميع بيتا عن السنة كاملة، أو خصم الربح غير المحقق من نصيب الحصة غير المسيطرة رغم أن البائع هو الأم، أو وضع حصة الشقيقة داخل الربح التشغيلي (خطأ وفق IFRS 18)، أو نسيان أن انخفاض الشهرة يُحمّل على الحصة غير المسيطرة عند قياسها بالقيمة العادلة."]]],"en":{"title":"DipIFR Question (1) – Consolidated statement of profit or loss with a mid-year acquisition (consolidation)","tag":"Frequency: very frequently tested. This is the shape of Question 1 in most DipIFR sittings (a consolidated statement of profit or loss and OCI or a consolidated statement of financial position) with a mid-year acquisition, an associate, unrealized profits and goodwill impairment.","q":["Alpha acquired 75% of Beta on 1/4/2027. The financial year ends on 31/12/2027. Figures in thousands:","Alpha: revenue 8,000; cost of sales 5,000; operating expenses 1,000; finance costs 200; tax 450.","Beta (for the full year, accruing evenly): revenue 4,800; cost of sales 3,000; operating expenses 600; finance costs 80; tax 280.","(1) At the acquisition date the fair value of Beta’s plant exceeded its carrying amount by 400, with a remaining life of 5 years (depreciation within cost of sales).","(2) After acquisition Alpha sold goods to Beta for 600 at a profit margin of 20% on selling price, and one third remained in Beta’s inventory.","(3) Goodwill impairment at 31/12/2027 = 50 (NCI measured at fair value; impairment within operating expenses).","(4) Alpha has owned 30% of an associate, Gamma, for years; Gamma’s profit for the year is 500.","Required: prepare the consolidated statement of profit or loss under IFRS 18, and allocate profit between owners of the parent and NCI."],"sol":[["h3","Solution"],["p","**Step 1 – Consolidate Beta from the acquisition date only (9/12):** revenue 3,600; cost of sales 2,250; expenses 450; finance 60; tax 210."],["p","**Step 2 – Adjustments:** extra depreciation = 400 ÷ 5 × 9/12 = 60. Unrealized profit = 600 × 20% × 1/3 = 40 (seller is the parent). Eliminate intra-group sales of 600 from revenue and cost of sales."],["t",["Item","Working","Amount"],[["Revenue","8,000 + 3,600 – 600","11,000"],["Cost of sales","5,000 + 2,250 – 600 + 40 + 60","(6,750)"],["!Gross profit","","4,250"],["Operating expenses","1,000 + 450 + 50","(1,500)"],["!Operating profit","","2,750"],["Share of profit of associate","30% × 500","150"],["!Profit before financing and income taxes","","2,900"],["Finance costs","200 + 60","(260)"],["!Profit before tax","","2,640"],["Income tax","450 + 210","(660)"],["!Profit for the year","","1,980"]],[3600,3638,2400]],["p","**Step 3 – NCI:** Beta’s post-acquisition profit = 3,600 – 2,250 – 450 – 60 – 210 = 630 – extra depreciation 60 – goodwill impairment 50 = 520 × 25% = **130**. (The unrealized profit does not affect NCI because the seller is the parent.)"],["p","**Step 4 – Allocation:** owners of the parent = 1,980 – 130 = **1,850**; NCI = **130**."],["note","Common mistakes the examiner penalizes",["Consolidating Beta for the full year, deducting the unrealized profit from NCI even though the parent is the seller, putting the associate’s share inside operating profit (wrong under IFRS 18), or forgetting that goodwill impairment is charged to NCI when NCI is measured at fair value."]]]}},{"title":"سؤال DipIFR (2) – IFRS 15: مكون تمويل جوهري","tag":"مستوى التكرار: متكرر جدًا. يأتي عادة كجزء (5–8 درجات) من سؤال الحالات المتنوعة، أو داخل سؤال التجميع كتعديل على إيرادات التابعة.","q":["في 1/1/2027 باعت شركة \"دلتا\" معدات لعميل وانتقلت السيطرة فورًا. السعر 1,210,000 يُسدد بالكامل في 1/1/2029. سعر الفائدة المناسب للعميل 10%. سجلت دلتا إيرادًا بمبلغ 1,210,000 في 2027. اشرح المعالجة الصحيحة وأثرها على قوائم 2027."],"sol":[["p","**المبدأ:** وفق الخطوة 3 من IFRS 15، يُعدل سعر المعاملة لأثر القيمة الزمنية للنقود إذا تضمن العقد مكون تمويل جوهريًا (فترة أكثر من سنة بين التسليم والسداد)."],["p","**التطبيق:** الإيراد = 1,210,000 ÷ 1.1² = **1,000,000** يُعترف به في 1/1/2027 (نقطة انتقال السيطرة). الفرق 210,000 إيراد فوائد على مدى سنتين بطريقة الفائدة الفعلية: 2027 = **100,000** (فئة استثمارية وفق IFRS 18)، 2028 = 110,000."],["p","**الأثر:** يُخفض الإيراد المسجل بـ 210,000 ويُعترف بإيراد فوائد 100,000 ← صافي انخفاض الربح 110,000. المدينون في 31/12/2027 = **1,100,000** (غير متداول)."],["je",[["الإيرادات","210,000",""],["المدينون","","110,000"],["إيراد فوائد","","100,000"]]]],"en":{"title":"DipIFR Question (2) – IFRS 15: a significant financing component","tag":"Frequency: very frequently tested. Usually appears as part (5–8 marks) of a mixed-topics question, or inside the consolidation question as an adjustment to a subsidiary’s revenue.","q":["On 1/1/2027 Delta sold equipment to a customer and control passed immediately. The price of 1,210,000 is payable in full on 1/1/2029. The appropriate interest rate for the customer is 10%. Delta recorded revenue of 1,210,000 in 2027. Explain the correct treatment and its effect on the 2027 financial statements."],"sol":[["p","**Principle:** under step 3 of IFRS 15, the transaction price is adjusted for the time value of money if the contract contains a significant financing component (more than one year between delivery and payment)."],["p","**Application:** revenue = 1,210,000 ÷ 1.1² = **1,000,000**, recognized on 1/1/2027 (the point control transfers). The difference of 210,000 is interest income over two years using the effective interest method: 2027 = **100,000** (investing category under IFRS 18), 2028 = 110,000."],["p","**Effect:** recorded revenue is reduced by 210,000 and interest income of 100,000 is recognized → net decrease in profit of 110,000. Receivables at 31/12/2027 = **1,100,000** (non-current)."],["je",[["Revenue","210,000",""],["Receivables","","110,000"],["Interest income","","100,000"]]]]}},{"title":"سؤال DipIFR (3) – IFRS 16: البيع وإعادة الاستئجار","tag":"مستوى التكرار: متكرر. يأتي في الحالات المتنوعة، ويختبر أولًا هل التحويل \"بيع\" وفق IFRS 15 ثم الحساب.","q":["في 1/1/2027 باعت شركة \"إبسيلون\" مبنى قيمته الدفترية 1,200,000 بمبلغ 2,000,000 نقدًا (يساوي القيمة العادلة)، واستأجرته فورًا لمدة 10 سنوات. القيمة الحالية لدفعات الإيجار 800,000. التحويل يستوفي شروط البيع وفق IFRS 15. احسب المبالغ وسجل القيد."],"sol":[["p","**المبدأ:** البائع-المستأجر يقيس أصل حق الاستخدام بنسبة من القيمة الدفترية السابقة تعادل الحق المحتفظ به، ويعترف فقط بالربح المتعلق بالحقوق المنقولة للمشتري."],["p","**نسبة الحق المحتفظ به** = 800,000 ÷ 2,000,000 = 40%."],["p","**أصل حق الاستخدام** = 1,200,000 × 40% = **480,000**."],["p","**الربح الكلي** = 2,000,000 – 1,200,000 = 800,000 ← المعترف به = 800,000 × 60% = **480,000** (الباقي 320,000 مضمن في انخفاض قيمة حق الاستخدام)."],["je",[["النقدية","2,000,000",""],["أصل حق الاستخدام","480,000",""],["المبنى","","1,200,000"],["التزام الإيجار","","800,000"],["ربح البيع وإعادة الاستئجار","","480,000"]]],["p","**لو لم يكن التحويل بيعًا** (مثلًا للبائع خيار إعادة شراء): يبقى المبنى في الدفاتر ويُسجل 2,000,000 كالتزام مالي وفق IFRS 9."]],"en":{"title":"DipIFR Question (3) – IFRS 16: sale and leaseback","tag":"Frequency: frequently tested. Appears in mixed topics; it first tests whether the transfer is a \"sale\" under IFRS 15, then the calculation.","q":["On 1/1/2027 Epsilon sold a building with a carrying amount of 1,200,000 for 2,000,000 cash (equal to fair value) and immediately leased it back for 10 years. The present value of the lease payments is 800,000. The transfer meets the sale criteria under IFRS 15. Calculate the amounts and record the journal entry."],"sol":[["p","**Principle:** the seller-lessee measures the right-of-use asset at the proportion of the previous carrying amount relating to the right retained, and recognizes only the gain relating to the rights transferred to the buyer."],["p","**Proportion of the right retained** = 800,000 ÷ 2,000,000 = 40%."],["p","**Right-of-use asset** = 1,200,000 × 40% = **480,000**."],["p","**Total gain** = 2,000,000 – 1,200,000 = 800,000 → recognized = 800,000 × 60% = **480,000** (the remaining 320,000 is embedded in the lower right-of-use asset)."],["je",[["Cash","2,000,000",""],["Right-of-use asset","480,000",""],["Building","","1,200,000"],["Lease liability","","800,000"],["Gain on sale and leaseback","","480,000"]]],["p","**If the transfer were not a sale** (e.g., the seller has a repurchase option): the building stays on the books and the 2,000,000 is recorded as a financial liability under IFRS 9."]]}},{"title":"سؤال DipIFR (4) – IAS 37 و IAS 10: حالات مخصصات","tag":"مستوى التكرار: متكرر جدًا. موضوعات المخصصات والأحداث اللاحقة من أكثر بنود سؤال الحالات المتنوعة تكرارًا، وتعتمد على الشرح أكثر من الحساب.","q":["السنة المالية تنتهي 31/12/2027 وتُعتمد القوائم في 15/3/2028. ناقش المعالجة لكل حالة:","(أ) قرر مجلس الإدارة في 1/12/2027 إغلاق فرع، لكن لم يُعلن القرار ولم توضع خطة تفصيلية حتى 20/1/2028. التكلفة المقدرة 900,000.","(ب) قضية مرفوعة على الشركة من عميل؛ رأي المحامي في 31/12/2027 أن احتمال الخسارة 30%. في 20/2/2028 صدر حكم ابتدائي ضد الشركة بـ 400,000 والشركة لن تستأنف.","(ج) الشركة تعمل في دولة لا يوجد بها قانون بيئي، لكنها تعلن سياسة منشورة تلتزم فيها بتنظيف أي تلوث تسببه، والتزمت بها تاريخيًا. تقدير التنظيف 250,000."],"sol":[["p","**(أ)** لا يوجد التزام ضمني في 31/12/2027 لأن الخطة لم تكن تفصيلية ولم تُعلن للمتأثرين ← **لا مخصص**. الإعلان بعد نهاية السنة حدث غير معدِّل ← إفصاح فقط إذا كان جوهريًا."],["p","**(ب)** الحكم بعد نهاية السنة يوفر دليلًا على ظرف كان قائمًا (القضية) ← **حدث معدِّل** وفق IAS 10 ← يُعترف بمخصص **400,000** في قوائم 2027 رغم أن التقدير السابق كان 30%."],["p","**(ج)** السياسة المعلنة والممارسة السابقة أنشأت **التزامًا ضمنيًا** وتوقعًا مشروعًا لدى الغير ← مخصص **250,000** (مخصومًا إن كان أثر الزمن جوهريًا). إذا كان التلوث مرتبطًا بإنشاء أصل يضاف للتكلف
