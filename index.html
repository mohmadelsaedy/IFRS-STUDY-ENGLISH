ions for liabilities, not to net assets.",null,"Consolidation is for sole control; here control is joint.","Fair value is not the default for joint ventures (except for certain entities such as venture capital organizations)."]}},{"tag":"Conceptual Framework","ans":1,"ar":{"q":"وفق الإطار المفاهيمي، ما الخاصيتان النوعيتان الأساسيتان للمعلومات المالية المفيدة؟","opts":["القابلية للمقارنة والتوقيت المناسب","الملاءمة والتمثيل الصادق","القابلية للتحقق والفهم","الحيطة والحذر والثبات"],"why":"الإطار المفاهيمي بيحدد خاصيتين **أساسيتين** لازم يتحققوا علشان المعلومة تبقى مفيدة: **الملاءمة** (تفرق في القرار) و**التمثيل الصادق** (كاملة ومحايدة وخالية من الأخطاء).","wrong":["دول خاصيتين **معززتين**، بيحسنوا المعلومة لكن مش بيخلوا المعلومة غير الملائمة مفيدة.",null,"دول برضه خاصيتين معززتين.","الحيطة بتدعم الحياد بس مش خاصية أساسية لوحدها، والثبات مش من الخصائص المذكورة."]},"en":{"q":"Under the Conceptual Framework, what are the two fundamental qualitative characteristics of useful financial information?","opts":["Comparability and timeliness","Relevance and faithful representation","Verifiability and understandability","Prudence and consistency"],"why":"The Framework specifies two **fundamental** characteristics that must be present for information to be useful: **relevance** (it makes a difference to decisions) and **faithful representation** (complete, neutral and free from error).","wrong":["These are **enhancing** characteristics: they improve information but cannot make irrelevant information useful.",null,"These are also enhancing characteristics.","Prudence supports neutrality but is not a fundamental characteristic on its own, and consistency is not one of the listed characteristics."]}},{"tag":"IFRS S2","ans":1,"ar":{"q":"انبعاثات الكهرباء المشتراة اللي استهلكتها الشركة تُصنف في IFRS S2 كـ:","opts":["النطاق 1","النطاق 2","النطاق 3","لا يُفصح عنها"],"why":"حسب بروتوكول الغازات الدفيئة اللي IFRS S2 بيعتمد عليه: **النطاق 2** هو الانبعاثات غير المباشرة من **الطاقة المشتراة** (كهرباء، بخار، تبريد) اللي المنشأة استهلكتها.","wrong":["النطاق 1 هو الانبعاثات **المباشرة** من مصادر بتملكها أو بتسيطر عليها المنشأة، زي أفرانها وعربياتها.",null,"النطاق 3 هو باقي سلسلة القيمة (الموردين، استخدام العملاء للمنتج، السفر).","IFRS S2 بيطلب الإفصاح عن النطاقات التلاتة."]},"en":{"q":"Emissions from purchased electricity consumed by a company are classified under IFRS S2 as:","opts":["Scope 1","Scope 2","Scope 3","Not disclosed"],"why":"Under the GHG Protocol, which IFRS S2 relies on, **Scope 2** is indirect emissions from **purchased energy** (electricity, steam, cooling) consumed by the entity.","wrong":["Scope 1 is **direct** emissions from sources the entity owns or controls, such as its furnaces and vehicles.",null,"Scope 3 covers the rest of the value chain (suppliers, customers’ use of products, travel).","IFRS S2 requires disclosure of all three scopes."]}},{"tag":"IAS 34","ans":1,"ar":{"q":"وفق IAS 34، القوائم الأولية المختصرة لازم تشمل كحد أدنى:","opts":["نفس إيضاحات القوائم السنوية بالكامل","القوائم الأساسية المختصرة وإيضاحات مختارة عن الأحداث المهمة منذ آخر قوائم سنوية","قائمة الدخل فقط","الميزانية فقط"],"why":"IAS 34 بيعتبر التقرير الأولي **تحديث** لآخر قوائم سنوية. فالحد الأدنى: قوائم أساسية **مختصرة** (مركز مالي، دخل، تغيرات في حقوق الملكية، تدفقات) و**إيضاحات مختارة** بتشرح الأحداث والمعاملات المهمة اللي حصلت من آخر قوائم سنوية.","wrong":["تكرار كل الإيضاحات السنوية مش مطلوب. ممكن المنشأة تعمل كده اختياريًا لو بتصدر قوائم أولية كاملة.",null,"المعيار بيطلب كل القوائم الأساسية (مختصرة)، مش واحدة بس.","الميزانية لوحدها مش كفاية."]},"en":{"q":"Under IAS 34, condensed interim financial statements must include at a minimum:","opts":["All the notes of the annual statements","Condensed primary statements and selected notes on significant events since the last annual statements","The income statement only","The balance sheet only"],"why":"IAS 34 treats an interim report as an **update** to the last annual statements. The minimum is **condensed** primary statements (financial position, income, changes in equity, cash flows) and **selected notes** explaining significant events and transactions since the last annual statements.","wrong":["Repeating all annual notes is not required; an entity may choose to if it issues complete interim statements.",null,"The standard requires all primary statements (condensed), not just one.","The balance sheet alone is not enough."]}}],"plan":[["t",["الأسبوع","المحتوى","التدريب"],[["1","الإطار المفاهيمي، IFRS 18، IAS 8، IAS 10، IAS 7","تصنيف بنود قائمة الدخل وقائمة تدفقات نقدية بسيطة"],["2","IAS 2، IAS 16، IAS 23، IAS 20، IAS 40، IAS 41","أسئلة تحويل عقار وإعادة تقييم وضريبة مؤجلة"],["3","IAS 36، IAS 38، IFRS 5، IFRS 13","توزيع خسارة على وحدة توليد نقد"],["4","IFRS 15، IAS 37، IAS 12","سؤالين حالات متنوعة كاملين بزمن محدد"],["5","IFRS 16، IAS 19، IFRS 2، IAS 21، IAS 33","جداول الإيجار والمعاشات وربحية السهم"],["6","IAS 32، IFRS 9، IFRS 7","السندات القابلة للتحويل والفائدة الفعلية وECL"],["7–8","IFRS 3، IFRS 10، IAS 28، IFRS 11 + تابعة أجنبية","سؤال تجميع كامل كل يومين من امتحانات ACCA السابقة"],["9–10","مراجعة شاملة","امتحانات تجريبية كاملة بالكمبيوتر (CBE) مع قراءة تقارير المصحح"]],[1300,4338,4000]],["b","**ابدأ بالتجميع:** هو أكبر سؤال وأكثره ثباتًا في الشكل؛ الإتقان فيه يضمن جزءًا كبيرًا من درجة النجاح."],["b","**في الأسئلة المقالية:** اكتب جملة واحدة للمبدأ، ثم طبّقه على الوقائع، ثم الرقم والأثر على القوائم. تجنب سرد المعيار كاملًا."],["b","**وزّع الوقت حسب الدرجات** ولا تتجاوز وقت سؤال على حساب آخر."],["b","**اقرأ تقارير المصحح (Examiner’s reports):** توضح الأخطاء المتكررة التي يخصم عليها، وهي من أفضل مصادر التحضير."],["b","**راجع قائمة المستندات القابلة للامتحان لدورتك** على موقع ACCA قبل الامتحان، خاصة مع دخول IFRS 18 والتعديلات الجديدة."],["p"," "],["p","**بالتوفيق في الامتحان!**"]],"planEn":[["t",["Week","Content","Practice"],[["1","Conceptual Framework, IFRS 18, IAS 8, IAS 10, IAS 7","Classifying income statement items and a simple cash flow statement"],["2","IAS 2, IAS 16, IAS 23, IAS 20, IAS 40, IAS 41","Property transfers, revaluation and deferred tax questions"],["3","IAS 36, IAS 38, IFRS 5, IFRS 13","Allocating a loss to a cash-generating unit"],["4","IFRS 15, IAS 37, IAS 12","Two complete timed mixed-topics questions"],["5","IFRS 16, IAS 19, IFRS 2, IAS 21, IAS 33","Lease, pension and EPS schedules"],["6","IAS 32, IFRS 9, IFRS 7","Convertible bonds, effective interest and ECL"],["7–8","IFRS 3, IFRS 10, IAS 28, IFRS 11 + foreign subsidiary","A full consolidation question every two days from past ACCA exams"],["9–10","Full revision","Full computer-based mock exams (CBE) and reading examiner’s reports"]],[1300,4338,4000]],["b","**Start with consolidation:** it is the biggest question and the most consistent in format; mastering it secures a large part of the pass mark."],["b","**In written questions:** write one sentence for the principle, then apply it to the facts, then the number and the effect on the statements. Avoid reciting the whole standard."],["b","**Allocate time by marks** and do not overrun one question at the expense of another."],["b","**Read the examiner’s reports:** they show the recurring mistakes that lose marks and are among the best preparation resources."],["b","**Check the examinable documents list for your sitting** on the ACCA website before the exam, especially with IFRS 18 and the new amendments."],["p"," "],["p","**Good luck in the exam!**"]],"dipIntro":[["p","**شكل امتحان DipIFR:** امتحان إلكتروني (CBE) يجمع بين سؤال تجميع كبير (إعداد قائمة مجمعة) وأسئلة على الحالات المتنوعة تطلب الشرح والحساب معًا. المصحح يعطي الدرجات على: تحديد المعيار الصحيح، شرح المبدأ، تطبيقه على الوقائع، والرقم النهائي. لذلك الحلول هنا مكتوبة بنفس الطريقة: **المبدأ ← التطبيق ← الرقم ← القيد**."],["note","تذكير",["الأسئلة التالية من تأليفي على نمط ومستوى DipIFR وليست نسخًا من أسئلة ACCA الأصلية. تحت كل سؤال ستجد تصنيف \"مستوى التكرار\" للموضوع في الامتحانات السابقة ونوع السؤال الذي يأتي فيه، بدلًا من رقم دورة لا أستطيع التحقق منه."]]],"dipIntroEn":[["p","**DipIFR exam format:** a computer-based exam (CBE) combining a large consolidation question (preparing a consolidated statement) with mixed-topic questions that require both explanation and calculation. The examiner awards marks for: identifying the correct standard, explaining the principle, applying it to the facts, and the final number. So the solutions here follow the same pattern: **principle → application → number → journal entry**."],["note","Reminder",["The following questions are written by me in the style and level of DipIFR and are not copies of original ACCA questions. Under each question you will find a \"frequency\" rating for the topic in past exams and the type of question it appears in, instead of a sitting date I cannot verify."]]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const main = $('#main');
const AR = 'أبجد', ABC = 'ABCD';
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ifrs.'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ifrs.'+k, JSON.stringify(v)); }catch(e){} }
};
let lang = store.get('lang', 'both');

/* ---------- data ---------- */
const lessons = [];
D.sections.forEach((s, si) => s.lessons.forEach(l => { l.si = si; l.id = lessons.length; l.clean = l.title.replace(/^\d+\)\s*/, ''); l.en.clean = l.en.title.replace(/^\d+\)\s*/, ''); lessons.push(l); }));
const secName = (s, L) => (L === 'en' ? s.en.title : s.title).replace(/^الجزء [^:]+:\s*/, '').replace(/^Part \d+:\s*/, '');
const codesOf = t => (t.match(/(IFRS|IAS)\s?S?\d+/g) || []).map(c => c.replace(/(IFRS|IAS)(\S)/, '$1 $2'));
lessons.forEach(l => { l.codes = codesOf(l.en.title); if (/Conceptual Framework/.test(l.en.title)) l.codes.push('Conceptual Framework'); });
const mcqs = D.mcqs.map((m, i) => ({ ...m, id: 'q' + i, code: m.tag }));
const lessonOf = code => lessons.find(l => l.codes.includes(code));
const lessonMcqs = l => mcqs.filter(m => l.codes.includes(m.code));
D.exams.forEach((e, i) => { e.id = i; e.codes = codesOf(e.en.title); e.short = e.title.replace(/^سؤال DipIFR \(\d+\)\s*–\s*/, ''); e.en.short = e.en.title.replace(/^DipIFR Question \(\d+\)\s*–\s*/, ''); });

/* ---------- text helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmt = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const cellFmt = s => String(s).replace(/^!/, '').split('|').map(fmt).join('<br>');
const dirAttr = () => lang === 'ar' ? 'rtl' : 'ltr';
const one = (ar, en) => lang === 'ar' ? ar : (en ?? ar);
const key = i => lang === 'ar' ? AR[i] : ABC[i];
function T(ar, en, f = fmt){
  if (lang === 'ar' || en == null) return f(ar);
  if (lang === 'en') return f(en);
  if (String(en).trim() === String(ar).trim()) return f(en);
  return `<span class="bi"><span class="e" dir="ltr">${f(en)}</span><span class="a" dir="rtl">${f(ar)}</span></span>`;
}
function renderBlocks(arB, enB){
  let h = '', list = null;
  const close = () => { if (list){ h += `</${list}>`; list = null; } };
  arB.forEach((b, bi) => {
    const [k, ...a] = b; const e = enB ? enB[bi].slice(1) : null;
    if (k === 'b' || k === 'n'){ const t = k === 'b' ? 'ul' : 'ol'; if (list !== t){ close(); h += `<${t}>`; list = t; } h += `<li>${T(a[0], e && e[0])}</li>`; return; }
    close();
    if (k === 'h1' || k === 'h2' || k === 'h3') h += `<h3>${T(a[0], e && e[0])}</h3>`;
    else if (k === 'p'){ if (String(a[0]).trim()) h += `<p>${T(a[0], e && e[0])}</p>`; }
    else if (k === 't') h += `<div class="tbl"><table><thead><tr>${a[0].map((x, i) => `<th>${T(x, e && e[0][i])}</th>`).join('')}</tr></thead><tbody>${a[1].map((r, ri) => `<tr class="${String(r[0]).startsWith('!') ? 'strong' : ''}">${r.map((c, ci) => `<td>${T(c, e && e[1][ri][ci], cellFmt)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    else if (k === 'je') h += `<div class="ledger"><div class="lh"><span>${one('قيد اليومية', 'Journal entry')}</span><span>${one('مدين ← دائن', 'Dr → Cr')}</span></div><table><thead><tr><th>${one('الحساب', 'Account')}</th><th>${one('مدين', 'Dr')}</th><th>${one('دائن', 'Cr')}</th></tr></thead><tbody>${a[0].map((r, ri) => `<tr class="${r[1] ? '' : 'credit'}"><td>${T(r[0], e && e[0][ri][0])}</td><td class="amt dr">${esc(r[1] || '')}</td><td class="amt cr">${esc(r[2] || '')}</td></tr>`).join('')}</tbody></table></div>`;
    else if (['ex','note','new','exam'].includes(k)){
      const pre = k === 'new' ? one('جديد: ', 'New: ') : '';
      h += `<div class="box ${k}"><div class="bt">${pre}${T(a[0], e && e[0])}</div>${a[1].map((x, i) => `<p>${T(x, e && e[1][i])}</p>`).join('')}</div>`;
    }
  });
  close(); return h;
}
function blocksToText(blocks){
  return blocks.map(([k, ...a]) => {
    if (k === 't') return [a[0].join(' | '), ...a[1].map(r => r.join(' | '))].join('\n');
    if (k === 'je') return a[0].map(r => `${r[0]}: Dr ${r[1]||'-'} Cr ${r[2]||'-'}`).join('\n');
    if (['ex','note','new','exam'].includes(k)) return a[0] + ':\n' + a[1].join('\n');
    return String(a[0] ?? '');
  }).join('\n').replace(/\*\*/g, '');
}
const lessonText = l => 'ENGLISH:\n' + blocksToText(l.en.blocks) + '\n\nARABIC:\n' + blocksToText(l.blocks);
function md(src){
  const lines = esc(src).split('\n'); let h = '', list = null, tbl = null;
  const close = () => { if (list){ h += `</${list}>`; list = null; } if (tbl){ h += '</tbody></table></div>'; tbl = null; } };
  const inline = s => s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<b>$1</b>');
  for (const ln of lines){
    const t = ln.trim(); let m;
    if (/^\|.*\|$/.test(t)){
      if (/^\|[\s:|-]+\|$/.test(t)) continue;
      const cells = t.slice(1, -1).split('|').map(c => inline(c.trim()));
      if (!tbl){ close(); h += `<div class="tbl"><table><thead><tr>${cells.map(c => `<th dir="auto">${c}</th>`).join('')}</tr></thead><tbody>`; tbl = 1; }
      else h += `<tr>${cells.map(c => `<td dir="auto">${c}</td>`).join('')}</tr>`;
      continue;
    }
    if ((m = t.match(/^[-*•]\s+(.*)/))){ if (list !== 'ul'){ close(); h += '<ul>'; list = 'ul'; } h += `<li dir="auto">${inline(m[1])}</li>`; continue; }
    if ((m = t.match(/^\d+[.)]\s+(.*)/))){ if (list !== 'ol'){ close(); h += '<ol>'; list = 'ol'; } h += `<li dir="auto">${inline(m[1])}</li>`; continue; }
    close();
    if ((m = t.match(/^#{1,4}\s+(.*)/))) h += `<h4 dir="auto">${inline(m[1])}</h4>`;
    else if (t) h += `<p dir="auto">${inline(t)}</p>`;
  }
  close(); return h;
}

// m: {ans, ar:{q,opts,why,wrong}, en:{...}, id?, code?}
function qHtml(m){
  const prev = m.id ? answered[m.id] : null;
  return `<div class="q" ${m.id ? `data-q="${m.id}"` : ''} dir="${dirAttr()}"><div class="qt">${T(m.ar.q, m.en.q)}</div><div class="opts">${m.ar.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${key(i)}</span><span>${T(o, m.en.opts[i])}</span></button>`).join('')}</div>${prev != null ? `<div class="tag">${one(`جاوبته قبل كده ${prev ? 'صح' : 'غلط'}`, `Answered before: ${prev ? 'correct' : 'wrong'}`)}</div>` : ''}</div>`;
}
function explainHtml(m, chosen){
  const ok = chosen === m.ans;
  const L = one('ar', 'en');
  let h = `<div class="exp"><div class="verdict ${ok ? 'ok' : 'no'}">${ok ? one('إجابة صحيحة ✓', 'Correct ✓') : one(`إجابتك (${key(chosen)}) غلط ✗`, `Your answer (${key(chosen)}) is wrong ✗`)}${lang === 'both' ? ` <span style="font-weight:600">· ${ok ? 'إجابة صحيحة' : 'إجابتك غلط'}</span>` : ''}</div>`;
  if (!ok) h += `<div class="blk bad"><span class="h">${one(`ليه (${key(chosen)}) غلط؟`, `Why (${key(chosen)}) is wrong`)}${lang === 'both' ? ` · ليه (${AR[chosen]}) غلط؟` : ''}</span>${T(m.ar.wrong[chosen], m.en.wrong[chosen])}</div>`;
  h += `<div class="blk good"><span class="h">${one(`ليه الإجابة الصح (${key(m.ans)})؟`, `Why the correct answer is (${key(m.ans)})`)}${lang === 'both' ? ` · ليه الإجابة الصح (${AR[m.ans]})؟` : ''}</span>${T(m.ar.why, m.en.why)}</div>`;
  h += `<details><summary>${one('تحليل كل الاختيارات', 'Analysis of every option')}${lang === 'both' ? ' · تحليل كل الاختيارات' : ''}</summary><ul class="all">${m.ar.opts.map((o, i) => `<li><span class="m ${i === m.ans ? 'y' : 'n'}">${key(i)}</span><span>${T(o, m.en.opts[i])}<br><span style="color:var(--muted)">${i === m.ans ? T('ده الصح. شوف الشرح فوق.', 'This is correct. See the explanation above.') : T(m.ar.wrong[i], m.en.wrong[i])}</span></span></li>`).join('')}</ul></details>`;
  const l = m.code ? lessonOf(m.code) : null;
  h += `<div class="row">${l && current.view !== 'lesson' ? `<button class="btn" data-go="l${l.id}">${one('راجع درس ', 'Review ')}${esc(m.code)}</button>` : ''}<button class="btn ai-only" ${sample ? '' : 'hidden'} data-more>${one('لسه مش فاهم؟ اشرحلي أكتر', 'Still unclear? Explain more')}</button></div><div class="more-out"></div>`;
  if (m.code) h += `<div class="tag">${esc(m.code)}</div>`;
  return h + '</div>';
}
function bindQ(card, m, onDone){
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, btns = card.querySelectorAll('.opt');
    btns.forEach(x => x.disabled = true);
    btns[m.ans].classList.add('right');
    const ok = i === m.ans; if (!ok) btns[i].classList.add('wrong');
    card.querySelector('.tag')?.remove();
    card.insertAdjacentHTML('beforeend', explainHtml(m, i));
    const mb = card.querySelector('[data-more]'); if (mb) mb.onclick = () => explainMore(m, i, card.querySelector('.more-out'), mb);
    if (m.id){ answered[m.id] = ok; store.set('mcq2', answered); }
    onDone && onDone(ok, i);
  });
}

    <div id="runQ">${qHtml(m)}</div><div class="row" id="runNext" hidden><button class="btn primary">${r.i === r.pool.length-1 ? 'شوف النتيجة' : 'السؤال اللي بعده'}</button></div></div>`;
  bindQ(main.querySelector('.q'), m, (ok, i) => { r.res[r.i] = ok; r.pick[r.i] = i; $('#runNext').hidden = false; });
  $('#runNext button').onclick = () => { r.i++; stepRun(); window.scrollTo(0, 0); };
}

/* ---------- exams ---------- */
function examItem(e){
  const has = store.get('ans', {})[e.id];
  const t = lang === 'ar' ? esc(e.short) : lang === 'en' ? `<span dir="ltr">${esc(e.en.short)}</span>` : `<span dir="ltr">${esc(e.en.short)}</span><span class="es">${esc(e.short)}</span>`;
  return `<li><button data-go="q${e.id}"><span class="en num">${e.id+1}</span><span><span class="et">${t}</span><span class="es">${esc(one(String(e.tag).split('.')[0], String(e.en.tag).split('.')[0]))}</span></span>${has ? '<span class="st">كتبت إجابة</span>' : ''}</button></li>`;
}
function viewExams(){
  main.innerHTML = `<div class="col"><h1 class="lesson-title">أسئلة على نمط ACCA DipIFR</h1>
    <div dir="${dirAttr()}">${renderBlocks(D.dipIntro, D.dipIntroEn)}</div>
    <p>اقرا السؤال، اكتب إجابتك كأنك في الامتحان (يفضل بالإنجليزي)، وبعدين اطلب التصحيح أو افتح الحل النموذجي.</p>
    <ul class="elist">${D.exams.map(examItem).join('')}</ul></div>`;
}
function viewExam(id){
  const e = D.exams[id]; if (!e) return viewExams();
  const ans = store.get('ans', {});
  main.innerHTML = `<article class="col">
    <div class="crumb"><button class="btn" data-go="exams">كل الأسئلة</button></div>
    <div dir="${dirAttr()}">
    <h1 class="lesson-title" style="margin-top:12px">${T(e.title, e.en.title)}</h1>
    <div class="box ex"><div class="bt">${one('السؤال', 'Question')}</div>${e.q.map((x, i) => `<p>${T(x, e.en.q[i])}</p>`).join('')}</div>
    </div>
    <h3>إجابتك</h3>
    <textarea id="myAns" dir="auto" placeholder="اكتب الحل هنا: المبدأ، تطبيقه على الوقائع، الأرقام، القيود… (Principle → application → numbers → entries)">${esc(ans[id] || '')}</textarea>
    <div class="row" style="margin:10px 0 6px">
      <button class="btn ai-only" hidden id="gradeBtn">صحّحلي إجابتي</button>
      <button class="btn primary" id="solBtn">اظهر الحل النموذجي</button>
    </div>
    <div id="gradeOut"></div>
    <div id="sol" hidden dir="${dirAttr()}">${renderBlocks(e.sol, e.en.sol)}<div class="box exam"><div class="bt">${one('أين يأتي هذا في الامتحان؟', 'Where does this appear in the exam?')}</div><p>${T(e.tag, e.en.tag)}</p></div></div>
    <div class="row" style="margin-top:28px;padding-top:18px;border-top:1px solid var(--rule)">
      ${id > 0 ? `<button class="btn" data-go="q${id-1}">السؤال اللي فات</button>` : ''}<span style="margin-inline-start:auto"></span>
      ${id < D.exams.length-1 ? `<button class="btn primary" data-go="q${id+1}">السؤال اللي بعده</button>` : ''}
    </div></article>`;
  let t; $('#myAns').oninput = ev => { clearTimeout(t); t = setTimeout(() => { const a = store.get('ans', {}); const v = ev.target.value.trim(); v ? a[id] = v : delete a[id]; store.set('ans', a); }, 400); };
  $('#solBtn').onclick = () => { const s = $('#sol'); s.hidden = !s.hidden; $('#solBtn').textContent = s.hidden ? 'اظهر الحل النموذجي' : 'اخفي الحل'; };
  $('#gradeBtn').onclick = () => gradeAnswer(e);
  showAI();
}
function viewPlan(){ main.innerHTML = `<div class="col"><h1 class="lesson-title">${one('خطة المذاكرة ونصايح الامتحان', 'Study Plan and Exam Tips')}</h1><div dir="${dirAttr()}">${renderBlocks(D.plan, D.planEn)}</div></div>`; }

/* ---------- routing ---------- */
function go(token, push = true){
  token = token || 'home';
  if (token === 'lessons') token = 'l' + (store.get('last', 0) ?? 0);
  let view = token;
  if (/^l\d+$/.test(token) && lessons[+token.slice(1)]){ view = 'lesson'; current.token = token; current.view = view; viewLesson(+token.slice(1)); }
  else if (/^q\d+$/.test(token) && D.exams[+token.slice(1)]){ view = 'exam'; viewExam(+token.slice(1)); }
  else if (token === 'practice'){ run = null; viewPractice(); }
  else if (token === 'exams') viewExams();
  else if (token === 'plan') viewPlan();
  else { token = 'home'; view = 'home'; viewHome(); }
  setActive(view, token);
  current.view = view; current.token = token;
  updateTutorCtx();
  if (push && location.hash.slice(1) !== token) history.replaceState(null, '', '#' + token);
  $('#toc').classList.remove('open');
  if (push) window.scrollTo(0, 0);
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-go]'); if (!b) return;
  ev.preventDefault(); go(b.dataset.go);
});
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
$('#menuBtn').onclick = () => $('#toc').classList.toggle('open');
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== current.token) go(location.hash.slice(1), false); });

/* ---------- AI ---------- */
let sample = null;
function persona(){
  const style = lang === 'en' ? 'Answer in clear, simple English, as the DipIFR and Cert IFR exams are in English.'
    : lang === 'ar' ? 'اكتب بالعامية المصرية الواضحة، واذكر المصطلحات الإنجليزية الأساسية بين قوسين.'
    : 'اكتب كل نقطة بالإنجليزي البسيط الأول (زي لغة الامتحان)، وبعدها مباشرة شرحها بالعامية المصرية. خلي المصطلحات الإنجليزية واضحة علشان الطالب يحفظها.';
  return 'إنت مدرس محاسبة خبير في المعايير الدولية IFRS بتحضّر طالب مصري لامتحان ACCA DipIFR وشهادة ICAEW Cert IFR (الامتحانين بالإنجليزي). ' + style + ' استخدم أرقام وقيود يومية لما ينفع. خلّي الشرح مركز ومفيد، واستخدم Markdown بسيط (عناوين صغيرة، نقاط، جداول). المعلومات حسب آخر تحديث للمعايير (IFRS 18 بدل IAS 1 من 2027). لو مش متأكد من حاجة قول كده.';
}
function showAI(){ document.querySelectorAll('.ai-only').forEach(el => el.hidden = !sample); }
const errMsg = e => ({ not_granted: 'المدرس الذكي مش متاح لأن الإذن اترفض. باقي الصفحة شغالة عادي.', rate_limited: 'طلبات كتير ورا بعض. استنى دقيقة وجرب تاني.' }[e?.code] || 'حصلت مشكلة في الرد. جرب تاني بعد شوية.');
function handleErr(e){ if (e?.code === 'not_granted'){ sample = null; showAI(); } }
async function streamInto(el, input, label){
  el.innerHTML = `<div class="ai-out"><div class="lab"><span>${esc(label)}</span><button class="btn" style="padding:2px 10px;font-size:13px">وقّف</button></div><div class="body"><span class="thinking">بيفكر</span></div></div>`;
  const body = el.querySelector('.body'), stop = el.querySelector('.lab button'); const ctl = new AbortController();
  stop.onclick = () => ctl.abort();
  try{ const r = await sample(input, { signal: ctl.signal, cache: false, onText: ({ text }) => { body.innerHTML = md(text); } }); body.innerHTML = md(r.text); }
  catch(e){ body.innerHTML = e?.text ? md(e.text) : `<p>${esc(e?.code === 'aborted' ? 'اتوقف.' : errMsg(e))}</p>`; handleErr(e); }
  stop.remove();
}
function explainMore(m, pick, el, btn){
  btn.disabled = true;
  const ok = pick === m.ans;
  streamInto(el, `${persona()}\n\nالطالب جاوب على سؤال اختيار من متعدد ${ok ? 'صح بس عاوز يفهم أعمق' : 'غلط'}.\nالسؤال (EN): ${m.en.q}\nالسؤال (AR): ${m.ar.q}\nالاختيارات:\n${m.en.opts.map((o, i) => `${ABC[i]}) ${o} / ${m.ar.opts[i]}`).join('\n')}\nالإجابة الصحيحة: ${ABC[m.ans]}\nاختيار الطالب: ${ABC[pick]}\nالشرح الموجود: ${m.en.why}\n\nالمطلوب:\n### الفكرة اللي ورا السؤال\nاشرح القاعدة من المعيار ${m.code || ''} ببساطة وبمثال من الحياة العملية.\n${ok ? '' : '### ليه الطالب ممكن يكون اختار ' + ABC[pick] + '\nإيه سوء الفهم الشائع اللي بيخلي حد يختار الاختيار ده، وإزاي يصححه.\n'}### إزاي تحل سؤال زي ده في الامتحان\nخطوات سريعة أو قاعدة تفتكرها.\n### اختبر نفسك\nسؤال قصير شبهه بأرقام مختلفة، والإجابة تحته.`, one('شرح إضافي', 'More explanation'));
}
function lessonAI(l, kind, btn){
  const ask = { simple: 'اشرحلي الدرس ده بأبسط طريقة ممكنة كأني أول مرة أسمع عنه، بتشبيه من الحياة العملية في شركة مصرية، وبعدين لخّص أهم 5 نقاط لازم أحفظها للامتحان.',
    example: 'اكتبلي مثال رقمي جديد (مختلف عن الأمثلة اللي في الدرس) على مستوى امتحان DipIFR، وحلّه خطوة بخطوة بالمبدأ ثم الحساب ثم قيود اليومية.',
    terms: 'اعملي جدول بأهم المصطلحات الإنجليزية في الدرس ده (المصطلح | معناه بالعربي | جملة إنجليزي زي اللي بتيجي في الامتحان)، وبعده أشهر 3 صيغ أسئلة بالإنجليزي على الموضوع.' }[kind];
  streamInto($('#aiLesson'), `${persona()}\n\nده نص الدرس اللي الطالب بيذاكره:\n"""\n${lessonText(l).slice(0, 11000)}\n"""\n\nطلب الطالب: ${ask}`, btn.textContent);
}
const pair = v => (v && typeof v === 'object') ? { en: String(v.en ?? ''), ar: String(v.ar ?? v.en ?? '') } : { en: String(v ?? ''), ar: String(v ?? '') };
async function genQuestion(title, ctx, container, btn){
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'بيكتب السؤال…';
  try{
    const m = await sample.json(`${persona()}\n\nاكتب سؤال اختيار من متعدد واحد جديد على نمط شهادة ICAEW Cert IFR عن: ${title}.\nالمرجع:\n"""\n${ctx.slice(0, 7000)}\n"""\nالسؤال تطبيقي (فيه أرقام أو حالة) ومش مكرر من الأمثلة. 4 اختيارات، واحد بس صح، والاختيارات الغلط تكون أخطاء شائعة مقنعة. اكتب كل نص بالإنجليزي (بأسلوب الامتحان) وبالعربي المصري. لكل اختيار غلط اكتب ليه غلط (وفي مكان الصح حط null).\nرجّع JSON بس:\n{"q":{"en":"","ar":""},"opts":[{"en":"","ar":""},{"en":"","ar":""},{"en":"","ar":""},{"en":"","ar":""}],"ans":0,"why":{"en":"شرح مفصل للحل","ar":""},"wrong":[null,{"en":"","ar":""},{"en":"","ar":""},{"en":"","ar":""}]}`, { cache: false });
    if (!m || !Array.isArray(m.opts) || m.opts.length !== 4 || !(m.ans >= 0 && m.ans < 4) || !m.q) throw { code: 'bad' };
    const q = pair(m.q), w = pair(m.why), os = m.opts.map(pair), wr = [0,1,2,3].map(i => i === +m.ans ? null : pair((m.wrong || [])[i] || ''));
    const qq = { ans: +m.ans, ar: { q: q.ar, opts: os.map(o => o.ar), why: w.ar, wrong: wr.map(x => x && x.ar) }, en: { q: q.en, opts: os.map(o => o.en), why: w.en, wrong: wr.map(x => x && x.en) } };
    const box = document.createElement('div'); box.innerHTML = qHtml(qq); const card = box.firstElementChild; bindQ(card, qq);
    card.insertAdjacentHTML('afterbegin', `<div class="tag" style="margin:0 0 6px">${one('سؤال مولّد بالذكاء الاصطناعي، راجعه مع الدرس لو حسيت إن فيه حاجة غريبة.', 'AI-generated question; check it against the lesson if anything looks off.')}</div>`);
    container.appendChild(card); card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch(e){ const p = document.createElement('p'); p.style.color = 'var(--cr)'; p.textContent = e?.code === 'bad' ? 'السؤال اللي اتولد مكانش بالشكل الصح. جرب تاني.' : errMsg(e); container.appendChild(p); handleErr(e); }
  btn.disabled = false; btn.textContent = old;
}
function gradeAnswer(e){
  const mine = $('#myAns').value.trim();
  if (mine.length < 20){ $('#gradeOut').innerHTML = '<p style="color:var(--cr)">اكتب إجابتك الأول (على الأقل سطرين) علشان أصححها.</p>'; return; }
  streamInto($('#gradeOut'), `${persona()}\n\nإنت دلوقتي مصحح امتحان DipIFR. صحّح إجابة الطالب مقارنة بالحل النموذجي.\n\nالسؤال:\n${e.en.q.join('\n')}\n\nالحل النموذجي:\n${blocksToText(e.en.sol)}\n\nإجابة الطالب:\n"""\n${mine.slice(0, 6000)}\n"""\n\nالمطلوب:\n### الدرجة التقديرية\nدرجة من 10 بشكل واقعي زي مصحح ACCA (الدرجات على: تحديد المعيار، شرح المبدأ، التطبيق على الوقائع، الأرقام، القيود).\n### اللي عملته صح\n### اللي ناقص أو غلط وليه\nمع الرقم أو القيد الصحيح وشرح السبب.\n### صياغة إنجليزي أحسن\nلو الطالب كتب بالعربي أو بإنجليزي ضعيف، اكتبله جملتين إنجليزي زي اللي المصحح متوقعها.\n### نصيحة للمرة الجاية\nسطرين.`, 'تصحيح إجابتك');
}

/* tutor chat */
let chat = [], busy = false;
function updateTutorCtx(){
  const c = current.view === 'lesson' ? lessons[current.lesson].clean : current.view === 'exam' ? D.exams[+current.token.slice(1)].short : 'سؤال عام';
  $('#tutorCtx').textContent = 'بتسأل عن: ' + c;
  const chips = current.view === 'lesson' ? ['ترجملي المصطلحات المهمة', 'اعملي ملخص في جدول', 'إمتى بيتسأل عليه في الامتحان؟'] : current.view === 'exam' ? ['أبدأ الحل منين؟', 'اديني تلميح من غير ما تحل', 'إزاي أكتب الإجابة بالإنجليزي؟'] : ['أبدأ مذاكرة DipIFR منين؟', 'إيه الجديد في IFRS 18؟', 'إزاي أتعود على أسئلة الإنجليزي؟'];
  $('#chips').innerHTML = chips.map(c => `<button type="button">${esc(c)}</button>`).join('');
  $('#chips').querySelectorAll('button').forEach(b => b.onclick = () => sendChat(b.textContent));
}
function ctxText(){
  if (current.view === 'lesson') return 'الطالب بيذاكر الدرس ده:\n' + lessonText(lessons[current.lesson]).slice(0, 9000);
  if (current.view === 'exam'){ const e = D.exams[+current.token.slice(1)]; return 'الطالب بيحل السؤال ده (متكشفش الحل كامل إلا لو طلب صراحة):\n' + e.en.q.join('\n') + '\nالحل النموذجي للمرجعية:\n' + blocksToText(e.en.sol).slice(0, 5000); }
  return 'الطالب في الصفحة الرئيسية لتطبيق مذاكرة IFRS.';
}
function addMsg(role, html){ const d = document.createElement('div'); d.className = 'msg ' + role; d.innerHTML = html; $('#chat').appendChild(d); $('#chat').scrollTop = 1e9; return d; }
async function sendChat(text){
  text = text.trim(); if (!text || busy) return;
  busy = true; $('#tutorSend').disabled = true; $('#tutorIn').value = '';
  addMsg('u', esc(text)); const a = addMsg('a', '<span class="thinking">بيفكر</span>');
  chat.push({ role: 'user', content: text });
  const turns = chat.slice(-10); while (turns.length && turns[0].role !== 'user') turns.shift();
  const input = turns.map((t, i) => i === 0 ? { role: 'user', content: `${persona()}\n\n${ctxText()}\n\nسؤال الطالب: ${t.content}` } : t);
  try{ const r = await sample(input, { cache: false, onText: ({ text }) => { a.innerHTML = md(text); $('#chat').scrollTop = 1e9; } }); a.innerHTML = md(r.text); chat.push({ role: 'assistant', content: r.text }); }
  catch(e){ a.innerHTML = `<p>${esc(errMsg(e))}</p>`; chat.pop(); handleErr(e); if (!sample) $('#tutor').hidden = true; }
  busy = false; $('#tutorSend').disabled = false;
}
$('#tutorFab').onclick = () => { const t = $('#tutor'); t.hidden = !t.hidden; if (!t.hidden){ if (!$('#chat').children.length) addMsg('a', '<p>أهلًا! اسألني أي حاجة في الدرس أو السؤال اللي فاتحه، بالعربي أو بالإنجليزي.</p>'); $('#tutorIn').focus(); } };
$('#tutorClose').onclick = () => $('#tutor').hidden = true;
$('#tutorForm').onsubmit = ev => { ev.preventDefault(); sendChat($('#tutorIn').value); };

/* ---------- boot ---------- */
setLang(lang, false); updateMeter();
go(location.hash.slice(1) || 'home', false);
(async () => { try{ sample = window.claude ? await window.claude.use('sample') : null; } catch(e){ sample = null; } showAI(); })();
</script>
</body>
</html>
